# Allowlist central de servidores MCP. Vive num repositório da engenharia, separado dos projetos,
# versionado por tag, e só muda por pedido de revisão. Os servidores abaixo são fictícios.
# Entrada que roda pacote com npx -y fixa a versão (pacote@x.y.z): sem isso o registro serve o que
# houver no dia da execução.
versao: 1
servidores:
  - nome: docs-internos
    origem: proprio
    command: npx
    args: ["-y", "@exemplo/servidor-docs@1.4.2"]
    revisado_em: 2026-10-06
    revisado_contra: criterios-mcp-v1
  - nome: rastreador-de-chamados
    origem: fornecedor-confiavel
    url: https://mcp.rastreador.example/v1
    revisado_em: 2026-10-06
    revisado_contra: criterios-mcp-v1
