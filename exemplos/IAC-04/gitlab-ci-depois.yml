stages: [plano, homologacao, producao]

variables:
  TF_VAR_versao: $CI_COMMIT_SHA # a mesma versão para todos os serviços e ambientes

.tofu:
  image: ghcr.io/opentofu/opentofu:1.13.2
  before_script:
    - cd infra && tofu init -input=false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plano-producao:
  extends: .tofu
  stage: plano
  script:
    - tofu workspace select -or-create producao
    - tofu plan -input=false -var-file=ambientes/producao.tfvars -out=producao.plano
  artifacts:
    paths: [infra/producao.plano]

aplicar-homologacao:
  extends: .tofu
  stage: homologacao
  environment: homologacao
  script:
    - tofu workspace select -or-create homologacao
    - tofu apply -input=false -auto-approve -var-file=ambientes/homologacao.tfvars

aplicar-producao:
  stage: producao
  image: ghcr.io/opentofu/opentofu:1.13.2
  environment: producao
  needs: [plano-producao, aplicar-homologacao]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - cd infra && tofu init -input=false
    - tofu workspace select producao
    - tofu apply -input=false producao.plano
