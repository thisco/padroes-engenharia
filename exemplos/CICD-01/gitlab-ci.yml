# Gates da merge request (CICD-01): lint, suíte e verificador de PR, todos obrigatórios.
# Requer no repositório: código Python, tests/ com unittest e, para o verificador de PR, o histórico
# completo com a branch de destino. O verificador não fica no repositório: o job o baixa do portal,
# confere o SHA-256 (sdd-scaffold 1.7.1) e só então o roda. Troque PORTAL_URL pelo endereço do
# portal publicado. O `python3 -I` roda o script em modo isolado.
stages:
  - gates

variables:
  PORTAL_URL: "https://portal.example.com"
  VERIFICAR_PR_SHA256: "616cc4c2357a1c0bda831e310722e24001820e1b7aa8cbc6e6200b60a57eb30e"

.so-em-merge-request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  extends: .so-em-merge-request
  stage: gates
  image: python:3.11
  script:
    - pip install --quiet --disable-pip-version-check ruff==0.16.10
    - ruff check .
    - ruff format --check .

suite:
  extends: .so-em-merge-request
  stage: gates
  image: python:3.11
  script:
    - python3 -m unittest discover -s tests -v

verificador-de-pr:
  extends: .so-em-merge-request
  stage: gates
  image: python:3.11
  variables:
    GIT_DEPTH: "0"
  script:
    - ALVO="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git rev-parse --verify --quiet "refs/remotes/origin/$ALVO" >/dev/null || git fetch --quiet origin "+refs/heads/$ALVO:refs/remotes/origin/$ALVO"
    - git rev-parse --verify "refs/remotes/origin/$ALVO"
    - curl -fsSL "$PORTAL_URL/.well-known/mecanismos/sdd-scaffold/verificar_pr.py" -o /tmp/verificar_pr.py
    - echo "$VERIFICAR_PR_SHA256  /tmp/verificar_pr.py" | sha256sum -c -
    - python3 -I /tmp/verificar_pr.py --base "origin/$ALVO"
