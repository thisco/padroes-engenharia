name: iac-ambiente
services:
  db:
    image: postgres:16-alpine
    container_name: iac-db
    environment:
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.saude
    container_name: iac-api
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
