services:
  api:
    build: ./app
    ports: ["8000:8000"]
    environment:
      OTEL_SERVICE_NAME: api-boletos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: ${OTEL_EXPORTADOR:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_EXPORTADOR:-none}
      OTEL_LOGS_EXPORTER: none
      OTEL_SEMCONV_STABILITY_OPT_IN: http

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: [observabilidade]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observabilidade/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observabilidade]
    ports: ["9090:9090"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
