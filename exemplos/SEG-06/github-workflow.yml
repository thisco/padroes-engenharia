# SEG-06 no GitHub Actions: .github/workflows/seguranca.yml
# Actions fixadas pelo SHA do commit da tag (git ls-remote, 2026-11-04), com a tag em comentário;
# a imagem do Semgrep, pela tag e pelo digest. Ao subir a versão, troque os dois.
name: seguranca
on: [pull_request]

jobs:
  varredura-imagem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build -t app:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH

  sast:
    runs-on: ubuntu-24.04
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: semgrep scan --config p/default --error --metrics off .
