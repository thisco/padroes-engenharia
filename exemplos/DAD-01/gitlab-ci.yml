# Trava da DAD-01 no pipeline de merge request do GitLab.
# É o job normas-do-pr da receita "Ligar o CI do GitLab com as travas".
# Requer scripts/verificar_pr.py do sdd-scaffold 1.7.1 (commit cd121cd), baixado do portal em
# /.well-known/mecanismos/sdd-scaffold/verificar_pr.py, com o hash conferido. O `python3 -I` roda o
# script em modo isolado, como o CI do template.
stages:
  - travas

normas-do-pr:
  stage: travas
  image: python:3.11
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - ALVO="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git rev-parse --verify --quiet "refs/remotes/origin/$ALVO" >/dev/null || git fetch --quiet origin "+refs/heads/$ALVO:refs/remotes/origin/$ALVO"
    - git rev-parse --verify "refs/remotes/origin/$ALVO"
    - python3 -I scripts/verificar_pr.py --base "origin/$ALVO"
