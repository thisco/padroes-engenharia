[importlinter]
root_package = boletos
include_external_packages = True

[importlinter:contract:dominio-sem-framework]
name = O dominio nao importa framework nem banco
type = forbidden
source_modules =
    boletos.dominio
forbidden_modules =
    flask
    sqlalchemy
    boletos.aplicacao
    boletos.adaptadores

[importlinter:contract:camadas]
name = Adaptadores dependem da aplicacao, e a aplicacao do dominio
type = layers
layers =
    boletos.adaptadores
    boletos.aplicacao
    boletos.dominio
