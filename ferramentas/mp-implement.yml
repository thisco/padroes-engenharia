caminhos:
  - momento: enquanto-escreve
    passo: executar
    papel: caminho
    bom_quando: "a spec ou os tickets já existem e você quer a implementação na branch atual: tdd nas costuras combinadas, tipos e testes rodados no caminho, suíte inteira no fim e code-review ao terminar."
    cuidado: "é uma skill de poucas linhas: busca o ticket no rastreador de issues e só manda commitar na branch corrente, sem passo de branch ou worktree; só a pessoa a aciona."
como_instalar: |
  Instale a coleção como plugin pelo marketplace do seu harness ou como arquivos copiados pelo
  instalador de skills, um dos dois por agente, e rode o setup dela (/setup-matt-pocock-skills) uma
  vez por repositório, incluindo-o ao escolher as skills no instalador [ref:mattpocock-readme]. Sem
  instalador, copie skills/engineering/implement/ do commit fixado (49dd158) para a pasta de skills
  do harness [ref:mattpocock-implement]; o README só documenta plugin e instalador
  [ref:mattpocock-readme]. O caminho de cada harness está na página da ferramenta dele.
limites: |
  Sem caso interno nem referência forte, fica em avaliar; o portal fixa a 1.3.1
  [ref:portal-referencias]. A skill tem poucas linhas: busca o ticket no rastreador de issues quando
  recebe uma referência, chama a tdd nas costuras combinadas, roda tipos e arquivos de teste ao
  longo do caminho e a suíte inteira uma vez no fim, chama a code-review ao terminar e commita na
  branch corrente; não há passo de branch nem de worktree [ref:mattpocock-implement]. O rastreador
  de issues que ela espera é definido uma vez por repositório pelo setup da coleção, que aceita a
  opção Other com o fluxo descrito em um parágrafo [ref:mattpocock-setup-matt-pocock-skills]; neste
  portal, esse parágrafo aponta docs/specs e docs/plans. Só a pessoa a aciona
  [ref:mattpocock-implement].
referencias: [mattpocock-implement, mattpocock-readme, portal-referencias, mattpocock-setup-matt-pocock-skills]
