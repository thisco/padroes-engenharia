id: sp-using-git-worktrees
titulo: using-git-worktrees
categoria: skill
colecao: superpowers
status: adotar
casos: [origem-do-modelo]
versao_minima: "7.0.0"
dono: engenharia
praticas: [P1-01]
receitas: []
caminhos:
  - momento: enquanto-escreve
    passo: isolar
    papel: caminho
    bom_quando: "você quer uma branch isolada sem sujar o diretório atual: a skill detecta isolamento já existente, prefere a ferramenta nativa do harness e só então cai no git worktree."
    cuidado: "pede consentimento antes de criar o worktree, salvo preferência já declarada, exige o diretório no .gitignore e roda a suíte como linha de base antes de implementar."
como_instalar: |
  Instale o plugin superpowers no seu harness; a instalação é por harness, e quem usa mais de um
  instala em cada um [ref:superpowers-readme]. Sem plugin, copie a pasta skills/ inteira do commit
  fixado (bb92a77) para a pasta de skills do harness, porque as skills da coleção citam umas às
  outras pelo nome com prefixo e arquivos vizinhos; o README só documenta a instalação por plugin
  [ref:superpowers-readme]. O caminho de cada harness está na página da ferramenta dele.
limites: |
  O caso de origem usou a série 6.x [ref:origem-do-modelo-instalacoes]; o portal fixa a 7.0.0
  [ref:portal-referencias]. A skill prefere a ferramenta nativa de worktree do harness e só usa git
  worktree add sem ela; pede consentimento antes de criar, salvo preferência já declarada nas
  instruções, e se o diretório do worktree não estiver no .gitignore ela o adiciona e commita essa
  mudança [ref:superpowers-using-git-worktrees].
referencias: [superpowers-using-git-worktrees, superpowers-readme, origem-do-modelo-instalacoes, portal-referencias]
