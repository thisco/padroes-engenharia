  skills do harness: o caminho de cada um está na página da ferramenta dele (Claude Code, Codex,
  Kiro, Antigravity ou Copilot).
limites: |
  É um procedimento em Markdown que o agente lê e segue [ref:sdd-lifecycle]. O repositório da
  skill traz o `SKILL.md` e documentação, sem código nem verificador próprio
  [ref:sdd-lifecycle-repo]; o rigor depende de o agente seguir cada fase.
