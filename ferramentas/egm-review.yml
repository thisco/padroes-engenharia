id: egm-review
titulo: egm-review
categoria: skill
colecao: elephant-goldfish-model
status: avaliar
versao_minima: "0.1.0"
dono: engenharia
praticas: [P1-12]
receitas: []
caminhos:
  - momento: antes-de-escrever
    passo: revisar-spec
    papel: caminho
    bom_quando: "o design doc está escrito e ninguém além do autor o leu: revisores sem o histórico da conversa recebem só o documento e os arquivos que ele cita e passam por cinco estágios (Zoom Out inicial, teste de compreensão com paráfrase, crítica do desenho, Zoom Out intermediário e prontidão de implementação)."
    cuidado: "os relatórios vão para arquivos (zoom_out_report.md, comprehension_report.md, critic_report.md, intermediate_zoom_out_report.md e implementation_readiness_report.md), não para o chat; no modo interativo, cada estágio termina num portão de uma pergunta, e cada um aceita no máximo uma nova auditoria. Link para fora da pasta de trabalho e URL só entram no contexto dos revisores com a sua aprovação."
como_instalar: |
  Instale o plugin inteiro, e não só esta skill: o README pede o plugin completo para que as
  skills leiam os prompts dos revisores e os padrões de documento [ref:egm-readme]. Antigravity
  CLI: `agy plugin install https://github.com/google/elephant-goldfish-model`. Claude Code:
  `claude plugin marketplace add google/elephant-goldfish-model` e depois
  `claude plugin install egm@egm`. Codex: `codex plugin marketplace add
  google/elephant-goldfish-model` e depois `codex plugin add egm@egm` [ref:egm-harnesses]. Abra
  uma sessão nova depois de instalar; no Antigravity CLI e no Claude Code a skill se chama com o
  prefixo, `/egm:egm-review`, e no Codex ela é escolhida na lista de skills [ref:egm-readme].
  Esses comandos não fixam commit. Quem precisa de reprodutibilidade clona o repositório no commit
  fixado (113a3af); a origem só documenta a cópia manual para o Antigravity App e o Antigravity
  para IDEs, com o pacote inteiro (`plugin.json`, `README.md`, `LICENSE`, `skills`, `agents`,
  `resources`, `docs` e `assets`) em `~/.gemini/config/plugins/egm/`, apagando a pasta antiga
  antes de atualizar [ref:egm-harnesses]. Copilot e Kiro não aparecem na tabela de instalação nem
  na situação de suporte da página de harnesses, e a origem só conta um harness como suportado
  depois que egm-brainstorm, egm-draft e egm-review rodam de ponta a ponta pela instalação do
  plugin [ref:egm-harnesses]; para os dois, o portal não tem caminho conferido.
limites: |
  A revisão exige um harness que crie subagentes com contexto novo: sem ferramenta de
  subagente a skill para e avisa que revisar no mesmo contexto não é revisão Goldfish
  [ref:egm-review-skill]. Contexto novo não quer dizer sem arquivos de instrução: há relato de que
  o Codex CLI e o Antigravity CLI passam o `AGENTS.md` do projeto ao revisor, e a origem não
  verificou a exclusão desses arquivos nesses dois harnesses [ref:egm-harnesses]. A revisão não
  substitui os testes nem o julgamento humano [ref:egm-readme], e devolve muito achado de
  propósito: você escolhe o que acatar [ref:egm-getting-started]. Os estágios 7 e 9 chamam a
  egm-review-loop, o despachante interno dos revisores, que o portal não lista como ferramenta
  própria [ref:egm-review-skill]. Relatórios e mensagens saem em inglês simples, com proibição de
  adjetivos de elogio e de pedidos de desculpa [ref:egm-review-skill].
  Instalar só a pasta `skills/` quebra o EGM, porque as skills leem `agents/` e
  `resources/document_standards/` em tempo de execução [ref:egm-harnesses]. O frontmatter
  declara `disable-model-invocation: true` [ref:egm-review-skill]: a skill é chamada pelo comando, e não
  escolhida pelo agente por conta própria, nos harnesses que respeitam o campo. A origem é
  pré-1.0: a versão canônica é a do `plugin.json`, e nomes de skill, parâmetros, caminhos de saída
  e formato de relatório só ficam estáveis na 1.0 [ref:egm-releases]. Ela não tem `CHANGELOG.md`:
  o versionamento está em `docs/releases.md` e as mudanças, nas notas de cada release
  [ref:egm-releases], então a revalidação confere a versão à mão. O portal fixa o commit 113a3af
  da `main`, com `0.1.0` no `plugin.json`; a única tag, `v0.1.0`, ficou 54 commits para trás e
  ainda nomeia esta skill `egm_review`, com sublinhado [ref:egm-review-skill].
referencias: [egm-readme, egm-harnesses, egm-review-skill, egm-getting-started, egm-releases]
