    bom_quando: "a faixa é Observabilidade: antes de instrumentar, escrever as perguntas que o plantão vai fazer; log estruturado com ID de correlação, métricas RED com rótulos limitados, rastreamento com OpenTelemetry e alerta por sintoma com runbook."
