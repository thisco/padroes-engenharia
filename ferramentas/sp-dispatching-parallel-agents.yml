id: sp-dispatching-parallel-agents
titulo: dispatching-parallel-agents
categoria: skill
colecao: superpowers
status: adotar
casos: [origem-do-modelo]
versao_minima: "7.0.0"
dono: engenharia
praticas: [P1-01]
receitas: []
caminhos:
  - momento: enquanto-escreve
    passo: executar
    papel: complemento
    bom_quando: "há dois ou mais problemas independentes, sem estado compartilhado, para investigar ao mesmo tempo: um agente por domínio, despachados na mesma resposta."
    cuidado: "não serve quando as falhas estão relacionadas ou os agentes editariam os mesmos arquivos; depois, a suíte inteira roda e cada resumo é conferido."
como_instalar: |
  Instale o plugin superpowers no seu harness; a instalação é por harness, e quem usa mais de um
  instala em cada um [ref:superpowers-readme]. Sem plugin, copie a pasta skills/ inteira do commit
  fixado (bb92a77) para a pasta de skills do harness, porque as skills da coleção citam umas às
  outras pelo nome com prefixo e arquivos vizinhos; o README só documenta a instalação por plugin
  [ref:superpowers-readme]. O caminho de cada harness está na página da ferramenta dele.
limites: |
  O caso de origem usou a série 6.x [ref:origem-do-modelo-instalacoes]; o portal fixa a 7.0.0
  [ref:portal-referencias]. A skill é para falhas independentes: um agente por domínio de problema,
  com escopo, objetivo, restrições e saída esperada no pedido; não é para falhas relacionadas nem
  para agentes que editariam os mesmos arquivos, e o resultado é conferido com a suíte inteira
  [ref:superpowers-dispatching-parallel-agents]. A subagent-driven-development, ao contrário, nunca
  despacha dois implementadores em paralelo [ref:superpowers-subagent-driven-development].
referencias: [superpowers-dispatching-parallel-agents, superpowers-readme, origem-do-modelo-instalacoes, portal-referencias, superpowers-subagent-driven-development]
