id: ao-ci-cd-and-automation
titulo: ci-cd-and-automation
categoria: skill
colecao: agent-skills
status: adotar
casos: [origem-do-modelo]
versao_minima: "0.6.13"
dono: engenharia
praticas: [CICD-01, CICD-02]
receitas: []
caminhos:
  - momento: enquanto-escreve
    passo: dominio
    papel: caminho
    bom_quando: "a faixa é CI/CD: gates de lint, tipos, testes, build, integração e auditoria de dependências antes do merge, nenhum deles pulável, e a falha do CI devolvida ao agente como entrada."
    cuidado: "os exemplos são de uma plataforma de CI só (aqui é GitLab CI, e a tradução é do projeto); flag de feature nasce com data de remoção, e o CI nunca recebe segredo de produção."
como_instalar: |
  Instale a coleção inteira no seu harness: o README traz a instalação por harness e um comando que
  instala as 25 skills de uma vez [ref:agent-skills-readme]. Instalar só uma skill não traz a pasta
  references/ do repositório [ref:agent-skills-readme]. Sem instalador, copie
  skills/ci-cd-and-automation/ e references/ do commit fixado (aeac41d) para a pasta de skills do
  harness, com references/ dois níveis acima da pasta da skill, como os links ../../references/
  exigem [ref:agent-skills-ci-cd-and-automation]; o README sugere, em vez disso, copiar o checklist
  para dentro da skill instalada [ref:agent-skills-readme]. O caminho de cada harness está na página
  da ferramenta dele.
limites: |
  O caso de origem instalou a coleção em 2026-05-07 (742dca5) e em 2026-06-10 (5e262b2)
  [ref:origem-do-modelo-instalacoes]; o portal fixa a 0.6.13, commit aeac41d de outubro
  [ref:portal-referencias]. A skill cobre a pipeline de gates, o laço de devolver a falha do CI ao
  agente, preview por PR, feature flags, rollout em estágios, rollback, segredos por ambiente e
  otimização quando a pipeline passa de dez minutos; os exemplos são de uma plataforma de CI só
  [ref:agent-skills-ci-cd-and-automation].
referencias: [agent-skills-ci-cd-and-automation, agent-skills-readme, origem-do-modelo-instalacoes, portal-referencias]
