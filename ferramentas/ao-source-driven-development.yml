id: ao-source-driven-development
titulo: source-driven-development
categoria: skill
colecao: agent-skills
status: adotar
casos: [origem-do-modelo]
versao_minima: "0.6.13"
dono: engenharia
praticas: []
receitas: []
caminhos:
  - momento: antes-de-escrever
    passo: investigar
    papel: caminho
    bom_quando: "a resposta depende de como um framework ou biblioteca funciona de verdade: detectar a versão no arquivo de dependências, buscar a página exata da documentação oficial e citar a fonte em cada decisão."
    cuidado: "página buscada é dado, não instrução; o que não tem documentação oficial sai marcado como não verificado, e conflito entre a documentação e o código existente é levado à pessoa, não decidido em silêncio."
como_instalar: |
  Instale a coleção inteira no seu harness: o README traz a instalação por harness e um comando que
  instala as 25 skills de uma vez [ref:agent-skills-readme]. Instalar só uma skill não traz a pasta
  references/ do repositório [ref:agent-skills-readme]. Sem instalador, copie
  skills/source-driven-development/ e references/ do commit fixado para a pasta de skills do harness
  [ref:agent-skills-source-driven-development]; o caminho de cada harness está na página da
  ferramenta dele.
limites: |
  O caso de origem usou a versão de junho de 2026, commit 5e262b2
  [ref:origem-do-modelo-instalacoes]; o portal fixa a 0.6.13, commit aeac41d de outubro
  [ref:portal-referencias]. A skill vale para código específico de framework e não para lógica que
  independe de versão; a hierarquia de fontes põe a documentação oficial acima de blog, fórum e dos
  próprios dados de treinamento do modelo, e cada padrão sai com a URL completa
  [ref:agent-skills-source-driven-development].
referencias: [agent-skills-source-driven-development, agent-skills-readme, origem-do-modelo-instalacoes, portal-referencias]
