id: ao-test-driven-development
titulo: test-driven-development
categoria: skill
colecao: agent-skills
status: adotar
casos: [origem-do-modelo]
versao_minima: "0.6.13"
dono: engenharia
praticas: [QLD-01]
receitas: []
caminhos:
  - momento: enquanto-escreve
    passo: tdd
    papel: caminho
    bom_quando: "toda lógica nova e todo bug: teste que falha antes do código, e o bug reproduzido por um teste antes de qualquer tentativa de correção (padrão prove-it)."
    cuidado: "descobrir primeiro como o repositório testa (wrapper, framework, comando do teste focado e da suíte) em vez de assumir um comando padrão; preferir implementação real a mock, e não repetir a suíte sem mudança no código."
como_instalar: |
  Instale a coleção inteira no seu harness: o README traz a instalação por harness e um comando que
  instala as 25 skills de uma vez [ref:agent-skills-readme]. Instalar só uma skill não traz a pasta
  references/ do repositório [ref:agent-skills-readme], que esta skill cita (a pasta references/ do
  repositório (testing-patterns.md)). Sem instalador, copie skills/test-driven-development/ e
  references/ do commit fixado (aeac41d) para a pasta de skills do harness, com references/ dois
  níveis acima da pasta da skill, como os links ../../references/ exigem
  [ref:agent-skills-test-driven-development]; o README sugere, em vez disso, copiar o checklist para
  dentro da skill instalada [ref:agent-skills-readme]. O caminho de cada harness está na página da
  ferramenta dele.
limites: |
  O caso de origem instalou a coleção em 2026-05-07 (742dca5) e em 2026-06-10 (5e262b2)
  [ref:origem-do-modelo-instalacoes]; o portal fixa a 0.6.13, commit aeac41d de outubro
  [ref:portal-referencias]. O ciclo é vermelho, verde, refatorar, com o refatorar dentro do laço; a
  skill traz a pirâmide de testes, tamanhos por recurso consumido e regras de teste bom (estado em
  vez de interação, DAMP, uma asserção por conceito). A verificação no navegador é remetida a outra
  skill da coleção, e os exemplos são de um ecossistema só
  [ref:agent-skills-test-driven-development].
referencias: [agent-skills-test-driven-development, agent-skills-readme, origem-do-modelo-instalacoes, portal-referencias]
