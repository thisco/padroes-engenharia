id: mp-domain-modeling
titulo: domain-modeling
categoria: skill
colecao: mattpocock-skills
status: avaliar
versao_minima: "1.3.1"
dono: engenharia
praticas: [ARQ-01]
receitas: []
caminhos:
  - momento: antes-de-escrever
    passo: decidir
    papel: caminho
    bom_quando: "o vocabulário do domínio está em disputa: a skill contesta termos contra o glossário, propõe o termo canônico, testa cenários de borda, confere o código e grava GLOSSARY.md e ADR na hora."
    cuidado: "só oferece ADR quando a decisão é difícil de reverter, surpreende sem contexto e vem de um trade-off real; o glossário fica sem detalhe de implementação, e o esquema de arquivos é o dela (GLOSSARY.md na raiz, docs/adr/)."
como_instalar: |
  Instale a coleção como plugin pelo marketplace do seu harness ou como arquivos copiados pelo
  instalador de skills, um dos dois por agente, e rode o setup dela (/setup-matt-pocock-skills) uma
  vez por repositório, incluindo-o ao escolher as skills no instalador [ref:mattpocock-readme]. Sem
  instalador, copie skills/engineering/domain-modeling/ do commit fixado (49dd158) para a pasta de
  skills do harness [ref:mattpocock-domain-modeling]; o README só documenta plugin e instalador
  [ref:mattpocock-readme]. O caminho de cada harness está na página da ferramenta dele.
limites: |
  Sem caso interno nem referência forte, fica em avaliar; o portal fixa a 1.3.1
  [ref:portal-referencias]. A skill é a disciplina ativa de mudar o modelo, não de só ler o
  glossário; grava GLOSSARY.md na raiz e ADRs em docs/adr/, criados só quando há o que escrever, com
  um GLOSSARY-MAP.md para repositórios com vários contextos; a ADR só é oferecida quando a decisão é
  difícil de reverter, surpreende sem contexto e vem de um trade-off real, e os formatos ficam em
  arquivos ao lado dela [ref:mattpocock-domain-modeling].
referencias: [mattpocock-domain-modeling, mattpocock-readme, portal-referencias]
