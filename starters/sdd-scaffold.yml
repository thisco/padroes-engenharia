id: sdd-scaffold
titulo: "SDD scaffold: projeto novo com constituição, steering e skills"
descricao: >-
  Gera um projeto com a constituição no AGENTS.md, modelos de PRD, spec, plano e ADR, o
  steering em docs/steering/, quatro skills de domínio, a skill sdd-lifecycle instalada na
  geração e os verificadores em scripts/ [ref:sdd-scaffold-readme]. O CI pronto que acompanha
  o projeto é de GitHub Actions (.github/workflows/qualidade.yml) [ref:sdd-scaffold-readme].
  No GitLab, a receita "Ligar o CI do GitLab com as travas" traz as três travas do CI do scaffold: normas do PR, governança e segredos.
repo: https://github.com/thisco/sdd-scaffold
versao: "1.7.1"
comando: |
  # Requer Python 3.11+, git com user.name e user.email configurados e rede (o gerador
  # clona a skill sdd-lifecycle, na tag v3.0.0). O destino não pode ter uma pasta com o nome do projeto.
  git clone --depth 1 --branch v1.7.1 https://github.com/thisco/sdd-scaffold.git
  git -C sdd-scaffold rev-parse HEAD   # deve imprimir cd121cd973945c486e63029496ed7ec879a18e32
  python3 sdd-scaffold/criar_projeto.py --nome meu-projeto --destino ~/workspace \
    --stack "Python 3.11" --descricao "Descrição do projeto"
prompt_para_agente: |
  Quero instanciar o sdd-scaffold neste ambiente e deixar o projeto pronto para trabalhar. Siga
  esta ordem e pare para eu confirmar antes de qualquer passo destrutivo.

  1. Pergunte o nome do projeto, a stack (ex.: "Python 3.12 + FastAPI") e uma descrição de uma
     linha. Se eu não souber a stack ou a descrição, siga com os defaults e deixe os marcadores
     <!-- preencher --> para depois.

  2. Clone o scaffold num diretório temporário e rode o gerador a partir dele (nada global):
       git clone --depth 1 --branch v1.7.1 https://github.com/thisco/sdd-scaffold.git /tmp/sdd-scaffold
       python3 /tmp/sdd-scaffold/criar_projeto.py --nome <nome> --destino . \
         --stack "<stack>" --descricao "<descricao>"
     O gerador copia o template, substitui os placeholders, instala a skill sdd-lifecycle em
     skills/sdd-lifecycle/ a partir da tag fixada no repositório dela, roda git init e faz o
     primeiro commit.

  3. Entre na pasta <nome> criada e confirme a instalação:
     - skills/sdd-lifecycle/SKILL.md existe. Se em vez disso houver skills/SKILL-CICLO-AUSENTE.md,
       a origem estava inacessível: me avise e siga sem a skill do ciclo.
     - .claude/skills, .codex/skills, .kiro/skills e .agents/skills apontam para skills/ (cada
       harness enxerga as skills por um desses pontos de montagem; .agents/skills serve ao Codex e
       ao Antigravity).
     - AGENTS.md tem nome, stack e descrição já substituídos (é a constituição, lida a cada turno).

  4. Leia AGENTS.md por completo e a skill sdd-lifecycle. A partir daqui, respeite a governança do
     projeto: não edite a constituição (docs/constituicao/), as ADRs nem Arquitetura/mapa.yml por
     conta própria. O hook de .claude/settings.json (Claude Code) e, se o harness for o Kiro,
     o .kiro/permissions.yaml pedem confirmação ou negam esses caminhos.

  5. Conduza a configuração pós-geração comigo: percorra os marcadores <!-- preencher --> e me
     pergunte o que faltar para completá-los em docs/steering/ (comandos de teste e lint, mecanismo
     de auth, escopos de commit, ordem de rebuild) e também em pyproject.toml, tests/README.md e
     docs/prd/MODELO-prd.md (e em .kiro/permissions.yaml, se o harness for o Kiro).

  6. Valide o que der para validar sozinho e me mostre a saída:
       python3 scripts/verificar_constituicao.py --raiz .
       pip install pyyaml && python3 scripts/verificar_drift_arquitetura.py
     No primeiro run, com "componentes: []" vazio, o drift check aponta o módulo de exemplo como
     "não mapeado" — isso é esperado e não bloqueia.

  7. Ao final, liste o que ainda depende de mim: desenhar Arquitetura/arquitetura.drawio, mapear
     Arquitetura/mapa.yml e escrever o PRD antes da primeira spec de Tier 2.
praticas_aplicadas: [P1-01, DAD-01]
receitas: [ligar-ci-gitlab-travas, instalar-skills-por-harness]
dono: nuarq
status: adotar
referencias: [sdd-scaffold-readme, sdd-scaffold-changelog]
planta:
  - grupo: Governança
    quando: "Todo turno de qualquer agente."
    arquivo: Constituição e ponteiros
    caminhos: [AGENTS.md, CLAUDE.md, GEMINI.md, docs/constituicao/padrao-v1.0.md]
    nota: "O GEMINI.md é um ponteiro de quatro linhas para o AGENTS.md [ref:sdd-scaffold-readme]. O CLAUDE.md também aponta para ele e, desde a 1.7.0, o importa com @AGENTS.md [ref:sdd-scaffold-changelog]."
    mecanismos:
      - forca: orienta
        texto: "o AGENTS.md entra no contexto do agente e o orienta [ref:sdd-scaffold-readme]"
      - forca: bloqueia
        texto: "scripts/verificar_constituicao.py reprova (exit 1) a constituição editada no projeto [ref:sdd-scaffold-readme]"
  - grupo: Governança
    quando: "Quando o agente tenta escrever num caminho protegido."
    arquivo: Proteção dos arquivos de governança
    caminhos: [scripts/proteger_governanca.py, .claude/settings.json, .kiro/permissions.yaml]
    nota: "Hook no Claude Code e regra declarativa no Kiro, um por ferramenta [ref:sdd-scaffold-readme]. A proteção vale contra descuido e não contra má-fé: a escrita indireta por shell não passa pelo hook, o Kiro cobre só a escrita de arquivo e, sem alguém para responder, a regra de pedir aprovação não protege [ref:sdd-scaffold-readme]."
    mecanismos:
      - forca: bloqueia
        texto: "o hook e a regra declarativa rodam fora do modelo [ref:sdd-scaffold-readme]"
  - grupo: Governança
    quando: "Em toda sessão do Codex."
    arquivo: Atribuição de IA desligada no Codex
    caminhos: [.codex/requirements.toml]
    nota: "O arquivo fixa git_attribution desligado, o que protege o princípio de não citar marca de IA; não protege caminho de escrita [ref:sdd-scaffold-readme]."
  - grupo: Ciclo e skills
    quando: "Antes de escrever, enquanto escreve e antes do merge."
    arquivo: Skills montadas nas ferramentas
    caminhos: [skills/sdd-lifecycle/, skills/arquitetura-viva/, skills/threat-model/, skills/migrations-reversiveis/, skills/estados-de-interface/]
    nota: ".claude/skills, .codex/skills, .kiro/skills e .agents/skills são links para a mesma pasta skills/; o .agents/skills serve ao Codex e ao Antigravity [ref:sdd-scaffold-readme] [ref:sdd-scaffold-changelog]."
    mecanismos:
      - forca: orienta
        texto: "a skill entra no contexto como procedimento que o agente segue [ref:sdd-scaffold-readme]"
  - grupo: Verificação
    quando: "A cada PR."
    arquivo: Verificador de PR e CI
    caminhos: [scripts/verificar_pr.py, .github/workflows/qualidade.yml]
    nota: "O CI que acompanha o projeto é de GitHub Actions [ref:sdd-scaffold-readme]."
    mecanismos:
      - forca: bloqueia
        texto: "editar uma migration já aplicada reprova, e desde a 1.7.1 renomeá-la também [ref:sdd-scaffold-readme] [ref:sdd-scaffold-changelog]"
      - forca: avisa
        texto: "spec sem threat-model, plano sem rollback e plano sem evidência de teste só avisam [ref:sdd-scaffold-readme]"
  - grupo: Verificação
    quando: "Antes do PR, quando a mudança toca compose, IaC ou diagrama."
    arquivo: Verificador de drift da arquitetura
    caminhos: [scripts/verificar_drift_arquitetura.py, Arquitetura/mapa.yml]
    mecanismos:
      - forca: avisa
        texto: "o check é informativo e nunca bloqueia o CI [ref:sdd-scaffold-readme]"
