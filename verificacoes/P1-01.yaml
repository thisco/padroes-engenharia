- tipo: prompt
  prompt: P1-01-prompt-1
  harness: claude-code
  resultado: passou
  evidencia: 'Subagente do Claude Code em sessão nova, só com o prompt final e {mudança} = "acrescentar
    o telefone (texto, até 20 caracteres) no cadastro de cliente: uma coluna nova na tabela cliente e
    um campo novo na API de cadastro", numa cópia do projeto de teste (cópia local do sdd-scaffold no
    commit fixado a8ebdf3c6734f11f6763c182b2325fe227216b65). Leu o AGENTS.md e docs/steering/sdd-processo.md
    e anunciou "Tier 2" com a justificativa antes de criar o arquivo. git status --porcelain: uma linha
    "?? docs/plans/2026-10-04-telefone-cliente.md". O grep achou uma linha "> **Tier:** 2 — mudança de
    schema (nova coluna em cliente) e de contrato (novo campo na API de cadastro)". verificar-tier.sh
    saiu com 0. Transcrição: relatório final do agente em curadoria-a5/transcricoes/P1-01-prompt-2.txt;
    uma rodada anterior, com a versão do prompt sem o caso do modelo ausente, teve o mesmo resultado.'
  data: '2026-10-04'
revisao_adversarial:
  revisor: sessao-independente
  data: '2026-10-04'
  achados:
  - afirmacao: antes de abrir qualquer arquivo de código, registre o tier no pedido, na spec ou no plano
      [ref:sdd-lifecycle]
    problema: a skill só manda anunciar o tier com justificativa de uma linha; o momento e o registro
      são regra do portal, mas a referência estava colada nela
    tratamento: o texto passou a dizer 'a regra do portal é…' e a referência ficou só nos critérios e
      no anúncio
  - afirmacao: Tier 0 é a mudança sem efeito observável em runtime
    problema: a fonte tem dois critérios (nenhuma linha de código executável alterada, ou sem efeito observável);
      o texto citava só o segundo
    tratamento: os dois critérios entraram no texto
  - afirmacao: Tier 2 passa por spec, gate, checkpoint, plano, TDD e revisão adversarial
    problema: 'omissão menor: a lista não cita o isolamento em branch nem o encerramento'
    tratamento: 'aceito: a frase resume as fases que distinguem o Tier 2'
  - afirmacao: o Spec Kit separa esses caminhos [ref:spec-kit]
    problema: o Spec Kit separa por tipo de trabalho, não por tamanho ou risco, e o fluxo de bug é extensão
      opcional; a ponte para os tiers não é da fonte
    tratamento: o texto diz que o Spec Kit separa por tipo de trabalho e que o tier é outro critério
  - afirmacao: lotes pequenos entre as sete capacidades do DORA [ref:dora-ai-capabilities]
    problema: a página do modelo só diz 'sete capacidades'; quem confirma a capacidade é a página dela,
      e o ganho citado é no desempenho do produto, não geral
    tratamento: texto reescrito com 'desempenho do produto'; a referência cita as duas páginas; a frase-ponte
      sobre quebrar a mudança em partes, sem fonte, foi retirada
  - afirmacao: mudança de schema entra sem spec, sem ADR e sem revisão
    problema: a skill só pede ADR para mudança destrutiva; o exemplo é aditivo
    tratamento: '''sem ADR'' saiu da frase'
  - afirmacao: verificador de PR avisa código sem plano [ref:sdd-scaffold-verificar-pr]
    problema: código é reconhecido só por extensão de arquivo; SQL, YAML e Terraform sem plano passam
      sem aviso
    tratamento: limite dito no texto de Como verificar
  - afirmacao: sdd-lifecycle e sdd-scaffold são repositórios do próprio autor
    problema: fontes internas valem só para as próprias definições e não provam que a prática funciona;
      o DORA trata de lotes pequenos, não de tiers
    tratamento: status segue experimentar; a decisão de adotar fica para o dono, no checkpoint
  - afirmacao: regra de quatro linhas para o AGENTS.md
    problema: a regra tem três linhas
    tratamento: o texto passou a dizer 'regra curta'
  - afirmacao: sem o modelo, comece o plano por essa linha
    problema: contradição com o Exemplo, que põe o título antes da linha de tier
    tratamento: o passo diz título do plano e, logo abaixo, a linha de tier
  - afirmacao: um plano que ainda traz a linha do modelo é recusado
    problema: 'falso em parte: um plano que mantém a linha do modelo e ganha outra linha de tier válida
      passa; o script aceita tier sem justificativa, Tier 0 e arquivo vazio de planos, e recusa justificativa
      com o caractere |'
    tratamento: Como verificar descreve o que o script confere e o que não confere
  - afirmacao: 'não executável sem inventar: Como aplicar passo 1 sem AGENTS.md nem steering'
    problema: a skill não vinha indicada
    tratamento: passo 1 diz que a skill vem no projeto do scaffold ou pelo como_instalar da ferramenta
  - afirmacao: 'não executável sem inventar: passo 3 do prompt sem MODELO-plano.md'
    problema: num repositório vazio o agente teria de inventar o plano
    tratamento: o prompt ganhou o caso do modelo ausente (plano só com título e linha de tier) e foi testado
      de novo
  - afirmacao: 'não executável sem inventar: bash exemplos/P1-01/verificar-tier.sh . sem o script no repositório'
    problema: o texto não dizia de onde copiar o script
    tratamento: Como verificar manda copiar o script do portal e roda bash verificar-tier.sh .
  - afirmacao: 'não executável sem inventar: Tier 0 e Por ferramenta para Antigravity e Copilot'
    problema: Tier 0 não deixa rastro verificável; as ferramentas remetem ao como_instalar
    tratamento: o passo 4 diz que o anúncio do Tier 0 fica na resposta e na mensagem do commit; Antigravity
      e Copilot seguem o como_instalar, que diz que não houve execução
