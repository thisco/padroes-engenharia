revisao_adversarial:
  revisor: conferente independente, modelo econômico (ADR 0005)
  data: '2026-10-06'
  achados:
  - afirmacao: 'Verificador: "política de permissões ... completa" (exemplos/P3-04/verificar-permissoes.py)'
    problema: '[médio] prova a presença de regras, não a semântica do harness. Reproduzido: passa com Bash(python3:*)
      em allow (execução livre de escrita), com o hook "echo "exit 2"" (a checagem é a substring "exit 2") e sem
      nenhum deny do próprio verificador. Os limites do Como verificar dizem que ele "lê arquivos", mas não citam
      esses escapes.'
    tratamento: 'Tratado em T10: o verificador reprova Bash com curinga em allow fora de comandos de leitura, hook
      que não chama scripts/proteger_governanca.py e hook sem ''|| { ...; exit 2; }'' no fim; o texto lista que
      o padrão pode ser interpretado diferente pelo harness. Reexecutado nos dois estados e em dois casos ruins
      (Bash(python3:*) com hook echo ''exit 2''; Bash(*) com hook sem o script), todos saída 1.'
  - afirmacao: '"escrita por comando de shell passa por regras ask que cobrem o padrão direto (redirecionamento,
      cp, mv, sed -i)" (P3-04.md, Como aplicar 5) x exemplos/P3-04/permissoes-agente.json'
    problema: '[médio] a escrita por terminal fora de Edit/Write é só mencionada: a política do Exemplo traz ask
      apenas para sed -i e tee, sem redirecionamento, cp nem mv, e o verificador não confere nenhum Bash em ask.
      O texto descreve o template do scaffold, e o Exemplo é um recorte menor.'
    tratamento: 'Tratado em T10: o texto diz que a política cobre Edit e Write e que a escrita por terminal é limite
      documentado do scaffold 1.7.1; o recorte do Exemplo traz em ask só sed -i e tee, e o verificador não exige
      Bash em ask.'
  - afirmacao: deny com Edit(scripts/verificar_*.py) (exemplos/P3-04/permissoes-agente.json)
    problema: '[baixo] o padrão verificar_*.py não casa com scripts/verificar-permissoes.py (hífen), o verificador
      do próprio Exemplo; fnmatch falso, reproduzido. Também .github/** em Exemplo cuja CI é GitLab.'
    tratamento: 'Tratado em T10: o deny traz scripts/verificar_*.py e scripts/verificar-*.py e .gitlab-ci.yml (no
      lugar de .github/**), e o verificador confere o próprio verificador e o CI como caminhos de governança.'
  - afirmacao: '"Antes": "10 ao todo" (P3-04.md, Antes e depois; verificacoes/P3-04.yaml, evidência)'
    problema: '[baixo] com cinco caminhos mais a própria política e Edit e Write, são 12 linhas, e foi o que a reprodução
      deu (t9-p3-04); a evidência diz "dez linhas ... cinco caminhos mais a própria política".'
    tratamento: 'Tratado em T10: com os dois caminhos novos a conta dá 16 linhas (7 caminhos mais a própria política,
      com Edit e Write), reexecutada; o texto foi atualizado.'
  - afirmacao: 'Prompt: "único shell" e escrita por ferramenta (trazido do plano)'
    problema: '[baixo] o agente editou o JSON pela ferramenta de escrita do harness, não por shell; o prompt supõe
      shell.'
    tratamento: 'Tratado em T10: o prompt manda usar um único shell ou refazer as variáveis a cada comando. Prompt
      alterado: aguarda novo teste em sessão nova. A lista de caminhos negados do teste precisa incluir scripts/verificar-permissoes.py
      e .gitlab-ci.yml.'
