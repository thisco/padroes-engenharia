conteudo: ARQ-03
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: a intenção da arquitetura hexagonal é permitir que a aplicação seja operada por usuários, programas,
    testes ou scripts de lote e desenvolvida e testada isolada de dispositivos e bancos de dados
  ref: cockburn-hexagonal
  localizacao: seção Intent
  resultado: confirmada
- texto: portas são pontos de conversa entre o núcleo e o exterior; adaptadores traduzem entre a API interna
    e a tecnologia de fora
  ref: cockburn-hexagonal
  localizacao: seção Ports and Adapters
  resultado: confirmada
- texto: um adaptador específico da tecnologia converte o evento em chamada ou mensagem, e a aplicação
    não conhece a natureza do dispositivo de entrada
  ref: cockburn-hexagonal
  localizacao: texto principal, parágrafo sobre eventos de fontes externas
  resultado: confirmada
- texto: o Import Linter permite impor restrições às importações entre módulos Python, com contratos num
    arquivo de configuração, e o lint-imports confere os contratos
  ref: import-linter-docs
  localizacao: página inicial (Overview e Configuration)
  resultado: confirmada
- texto: o contrato forbidden impede um conjunto de módulos de ser importado por outro, e cobre pacotes
    externos se include_external_packages = True e o pacote entra pela raiz
  ref: import-linter-docs
  localizacao: contract_types/forbidden
  resultado: confirmada
- texto: o contrato layers lista as camadas da mais alta para a mais baixa; a mais baixa não importa a
    mais alta
  ref: import-linter-docs
  localizacao: contract_types/layers
  resultado: confirmada
