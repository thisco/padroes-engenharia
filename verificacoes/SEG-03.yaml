revisao_adversarial:
  revisor: conferência em lote (ADR 0005) e revisão forte da Tarefa 6, sessões independentes
  data: '2026-10-08'
  achados:
  - afirmacao: "Fonte privada removida do requirements.txt, pom ou gradle (dependency confusion)"
    problema: "[importante] só a fonte nova pedia; a removida deixava o nome interno resolver no índice público."
    tratamento: "Tratado: fonte nova, alterada ou removida pede em qualquer formato; dependência que perde origem também pede."
  - afirmacao: "overrides, resolutions, pnpm.overrides, override-dependencies do uv e resolution.overrides do PDM"
    problema: "[importante] trocam a origem sem passar pelas listas lidas."
    tratamento: "Tratado: lidos como item override:<nome> com a origem da especificação."
  - afirmacao: "Diferenças de parser com o pip, o npm-package-arg e o go"
    problema: "[importante] comentário com barra engolia a linha seguinte; require( não abria bloco; git@host:x/y.git, x.tgz e user/repo eram tratados como versão."
    tratamento: "Tratado, com um teste para cada caso reproduzido."
  - afirmacao: "npx, uvx, pipx run e afins"
    problema: "[importante] executam pacote não declarado e não casavam; escrita direta pelo shell num arquivo da tabela também não."
    tratamento: "Tratado: VERBOS e gatilho cobrem os comandos do item 5 e a escrita por >, >>, tee, sed -i, cp e mv; shell sem comando sai 2."
  - afirmacao: "dependencias-aprovadas.txt editável"
    problema: "[importante] a lista que dá a aprovação podia ser editada sem pedido."
    tratamento: "Tratado: qualquer edição pede; o Como aplicar diz o CODEOWNERS e a regra de proteção que torna a aprovação obrigatória, com fonte."
  - afirmacao: "Texto: pip install -r, índice, origem do npm, require em bloco e Gradle"
    problema: "[fonte] afirmações falsas e [ref:gradle-declaring-dependencies] mal posicionado."
    tratamento: "Tratado: frases corrigidas; a referência do Gradle ficou só no que a página sustenta."
  - afirmacao: "Executabilidade: passos 3, 4 e 7 do Como aplicar"
    problema: "[executabilidade] sintaxe e local do CODEOWNERS e a regra de branch não eram dados; o passo 4 não dizia onde obter o candidato, não mostrava o job e o --indice vinha sem valor; o passo 7 não liga hoje."
    tratamento: "Tratado nos passos 3 e 4; o passo 7 segue dizendo que o gatilho de harness não liga à mão até a F2 e a F4. Passos 1, 2, 5 e 6 executáveis."
  - afirmacao: verificar-dependencias.py --indice aceita qualquer URL, inclusive file://
    problema: '[baixo] só importa se o CI deixar quem abre a MR escolher o argumento.'
    tratamento: 'Tratado: o Limites diz que o índice vem do job do CI, e não da MR.'
