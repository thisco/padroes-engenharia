conteudo: SEG-03
verificado_em: '2026-10-08'
verificador: agente-curadoria
afirmacoes:
- texto: o estudo analisou 576.000 amostras de código de 16 modelos em duas linguagens e achou ao menos
    5,2% de pacotes alucinados nos modelos comerciais e 21,7% nos de código aberto, com 205.474 nomes
    únicos
  ref: usenix-pacotes-alucinados
  localizacao: resumo do artigo (abstract)
  resultado: confirmada
- texto: os autores descrevem a alucinação de pacote como uma forma nova de ataque de confusão de pacotes,
    ameaça à integridade da cadeia de suprimentos de software
  ref: usenix-pacotes-alucinados
  localizacao: resumo do artigo (abstract)
  resultado: confirmada
- texto: a injeção de prompt indireta ocorre quando o modelo aceita entrada de fontes externas, como sites
    ou arquivos; a mitigação inclui restringir privilégios do modelo ao mínimo e controle humano para
    operações privilegiadas
  ref: owasp-llm-top10
  localizacao: seção 'Indirect Prompt Injections' e lista de prevenção e mitigação
  resultado: confirmada
  nota: A página é a LLM01 (injeção de prompt); a leitura de que um pacote sugerido por README ou página
    é conteúdo externo é do portal e vem marcada assim no texto.
- texto: a rota GET /pypi/<projeto>/json devolve os metadados do projeto e GET /pypi/<projeto>/<versão>/json
    os de uma versão
  ref: pypi-json-api
  localizacao: seção de endpoints do projeto e do release
  resultado: confirmada
  nota: A página não diz o status para projeto inexistente; o 404 foi observado em consulta direta e o
    verificador trata só o 404 como inexistência.
- texto: o modo de verificação de hash do pip se ativa com --require-hashes ou com --hash em qualquer
    requisito, e exige hash em todos os requisitos, fixados com == (ou URL ou caminho); protege contra
    adulteração remota
  ref: pip-hash-checking
  localizacao: seção 'Hash-checking Mode'
  resultado: confirmada
  nota: 'O comportamento no desencontro de hash não vem da página: foi observado na execução (pip 26.2.1).'
- texto: "project.dependencies é uma lista de especificadores de dependência, project.optional-dependencies é uma tabela de listas e build-system.requires lista as dependências do sistema de build"
  ref: "pypa-pyproject-toml"
  localizacao: "seções 'dependencies', 'optional-dependencies' e 'Declaring build system dependencies: the [build-system] table'"
  resultado: "confirmada"
- texto: "a tabela [dependency-groups] tem grupos definidos pela pessoa, cada um com uma lista de requisitos (texto ou tabela include-group)"
  ref: "pypa-dependency-groups"
  localizacao: "seções 'Dependency Groups' e 'Dependency Group Include'"
  resultado: "confirmada"
- texto: "o Poetry declara dependências em tabelas, com as chaves git, path, url e source para origem que não é o índice padrão"
  ref: "poetry-dependency-specification"
  localizacao: "seções das dependências git, path, url e do repositório alternativo (source)"
  resultado: "confirmada"
  nota: "A página não descreve os grupos nem [[tool.poetry.source]]; os grupos estão na referência seguinte, e o [[tool.poetry.source]] só aparece em exemplo, por isso o texto não o afirma como documentado."
- texto: "os grupos de dependências do Poetry se declaram em [tool.poetry.group.<nome>.dependencies]"
  ref: "poetry-managing-dependencies"
  localizacao: "seção 'Dependency groups'"
  resultado: "confirmada"
  nota: "A página não trata o dev-dependencies como legado; o verificador o lê por precaução, e o texto não afirma o status dele."
- texto: "o uv guarda origens alternativas em [tool.uv.sources] (index, git, url, path, workspace), os índices em [[tool.uv.index]] e o dev-dependencies legado em [tool.uv]"
  ref: "uv-project-dependencies"
  localizacao: "seções [tool.uv.sources], [tool.uv.index] e dev-dependencies"
  resultado: "confirmada"
- texto: "o package.json tem os campos dependencies, devDependencies, optionalDependencies e peerDependencies, e a especificação pode ser intervalo de versão, URL, git, user/repo ou file:"
  ref: "npm-package-json"
  localizacao: "seções de cada campo e 'Dependencies' (formas de especificação)"
  resultado: "confirmada"
- texto: "o npm install tem os aliases add e i, e instala um pacote sob outro nome com <alias>@npm:<nome>"
  ref: "npm-install"
  localizacao: "lista de aliases e seção de alias de pacote"
  resultado: "confirmada"
  nota: "No package.json o alias aparece como \"nome\": \"npm:real@x\"; essa forma foi lida pelo verificador a partir da sintaxe da página, e o teste do portal a cobre."
- texto: "o Cargo declara dependências em [dependencies], [dev-dependencies], [build-dependencies] e por plataforma, com git, path, registry e package (renomear o crate)"
  ref: "cargo-specifying-dependencies"
  localizacao: "seções [dependencies], git, path, registry, 'Renaming dependencies', dev, build e 'Platform specific dependencies'"
  resultado: "confirmada"
- texto: "a seção [patch] do Cargo.toml sobrepõe dependências por outras cópias, com sintaxe parecida com a de [dependencies]"
  ref: "cargo-overriding-dependencies"
  localizacao: "seção 'The [patch] section'"
  resultado: "confirmada"
- texto: "a tabela workspace.dependencies define as dependências herdadas pelos membros do workspace"
  ref: "cargo-workspaces"
  localizacao: "seção 'The dependencies table'"
  resultado: "confirmada"
- texto: "o go.mod declara módulos com require (em linha ou em bloco, // indirect), replace (destino que é caminho local ou módulo com versão), tool, exclude e retract"
  ref: "go-mod-reference"
  localizacao: "seção 'go.mod files', diretivas require, replace, tool, exclude e retract"
  resultado: "confirmada"
- texto: "o pom.xml declara dependencies com groupId, artifactId, version, scope e systemPath, o parent, os plugins de build e os repositories e pluginRepositories com url"
  ref: "maven-pom"
  localizacao: "seções Dependencies, Parent, Build plugins, Repositories e Plugin Repositories"
  resultado: "confirmada"
- texto: "o Gradle declara dependências no bloco dependencies com configurações (implementation, compileOnly, runtimeOnly, testImplementation), na notação 'grupo:nome:versão', e project() e files() para módulo e arquivo local"
  ref: "gradle-declaring-dependencies"
  localizacao: "bloco dependencies {}, configurações, notação em texto, project e files"
  resultado: "confirmada"
  nota: "A página não traz a notação de mapa (group/name), o alias de catálogo, a configuração api, os blocos plugins e repositories; o verificador lê tudo isso, e o texto da prática o descreve como comportamento do verificador, sem afirmar a documentação do Gradle."
- texto: "o arquivo de requisitos do pip tem um requisito por linha, comentário com #, continuação por barra invertida, URL com @, e as opções -r, -c, -e, -i, --extra-index-url, -f e --hash"
  ref: "pip-requirements-file"
  localizacao: "seções de estrutura, comentários, formas de requisito e opções"
  resultado: "confirmada"
- texto: "o arquivo CODEOWNERS fica em .github/, na raiz ou em docs/ no GitHub, e a revisão dos donos do código é exigida pela proteção de branch"
  ref: "github-codeowners"
  localizacao: "seções do local do arquivo e da exigência de revisão pelos code owners"
  resultado: "confirmada"
  nota: "A página não foi lida até o nome exato da opção da regra de proteção; o texto não a nomeia."
- texto: "o arquivo CODEOWNERS fica na raiz, em docs/ ou em .gitlab/ no GitLab, a aprovação por code owners se exige no branch protegido, e o recurso é dos planos Premium e Ultimate"
  ref: "gitlab-codeowners"
  localizacao: "seções de locais do arquivo, aprovação pelo branch protegido e plano"
  resultado: "confirmada"
- texto: "com allow_failure: true a falha do job é um aviso laranja e o pipeline é bem-sucedido"
  ref: "gitlab-allow-failure"
  localizacao: "seção 'allow_failure'"
  resultado: "confirmada"
  nota: "Aberta de novo em 2026-10-08; o pipeline passar não foi exercitado num GitLab real."
