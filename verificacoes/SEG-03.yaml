afirmacoes:
- texto: o estudo analisou 576.000 amostras de código de 16 modelos em duas linguagens e achou ao menos
    5,2% de pacotes alucinados nos modelos comerciais e 21,7% nos de código aberto, com 205.474 nomes
    únicos
  ref: usenix-pacotes-alucinados
  localizacao: resumo do artigo (abstract)
  resultado: confirmada
- texto: os autores descrevem a alucinação de pacote como uma forma nova de ataque de confusão de pacotes,
    ameaça à integridade da cadeia de suprimentos de software
  ref: usenix-pacotes-alucinados
  localizacao: resumo do artigo (abstract)
  resultado: confirmada
- texto: a injeção de prompt indireta ocorre quando o modelo aceita entrada de fontes externas, como sites
    ou arquivos; a mitigação inclui restringir privilégios do modelo ao mínimo e controle humano para
    operações privilegiadas
  ref: owasp-llm-top10
  localizacao: seção 'Indirect Prompt Injections' e lista de prevenção e mitigação
  resultado: confirmada
  nota: A página é a LLM01 (injeção de prompt); a leitura de que um pacote sugerido por README ou página
    é conteúdo externo é do portal e vem marcada assim no texto.
- texto: a rota GET /pypi/<projeto>/json devolve os metadados do projeto e GET /pypi/<projeto>/<versão>/json
    os de uma versão
  ref: pypi-json-api
  localizacao: seção de endpoints do projeto e do release
  resultado: confirmada
  nota: A página não diz o status para projeto inexistente; o 404 foi observado em consulta direta e o
    verificador trata só o 404 como inexistência.
- texto: o modo de verificação de hash do pip se ativa com --require-hashes ou com --hash em qualquer
    requisito, e exige hash em todos os requisitos, fixados com == (ou URL ou caminho); protege contra
    adulteração remota
  ref: pip-hash-checking
  localizacao: seção 'Hash-checking Mode'
  resultado: confirmada
  nota: 'O comportamento no desencontro de hash não vem da página: foi observado na execução (pip 26.2.1).'
