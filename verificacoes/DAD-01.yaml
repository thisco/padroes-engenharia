conteudo: DAD-01
verificado_em: '2026-10-06'
verificador: agente-curadoria
afirmacoes:
- texto: migration já aplicada não é editada; corrige-se com uma migration corretiva incremental
  ref: migrations-reversiveis
  localizacao: SKILL.md, regra 3
  resultado: confirmada
- texto: quem já rodou a versão anterior fica com um estado que o código não descreve
  ref: migrations-reversiveis
  localizacao: SKILL.md, regra 3
  resultado: confirmada
- texto: toda mudança de banco é um script de migration versionado com o código, e cada mudança é tão
    pequena quanto possível
  ref: fowler-evodb
  localizacao: '''All database changes are migrations'' e ''Jen implements a new story'''
  resultado: confirmada
- texto: o Flyway grava o checksum ao executar a migration, e o validate falha quando o checksum local
    difere do aplicado
  ref: flyway-validate
  localizacao: seção 'Description'
  resultado: confirmada
  nota: 'Execução real: Flyway OSS Edition 11.20.3 (imagem flyway/flyway:11) contra PostgreSQL 16.13.
    migrate aplicou 2 migrations (now at version v2). Com a V2 editada, validate saiu com 1: ''ERROR:
    Validate failed: Migrations have failed validation'', ''Migration checksum mismatch for migration
    version 2'', ''-> Applied to database : -1946493639'', ''-> Resolved locally    : -1926160430''. Depois
    da V3 (V2 restaurada): ''Successfully applied 1 migration to schema "public", now at version v3''
    e ''\d cliente'' mostrou ''cpf | character varying(14)''. A documentação não traz o texto da mensagem;
    o texto do Exemplo vem desta execução.'
- texto: uma migration versionada se aplica uma vez, na ordem; migration nova tem o nome V<versão>__<descrição>.sql;
    a documentação recomenda não alterar migration aplicada e criar uma nova
  ref: flyway-versionadas
  localizacao: seções de nomenclatura, aplicação em ordem e integridade
  resultado: confirmada
- texto: alembic revision -m cria a revisão, com upgrade() e downgrade() preenchidos; alembic downgrade
    -1 volta uma revisão
  ref: alembic-tutorial
  localizacao: seções de criação do script e de downgrade relativo
  resultado: confirmada
  nota: 'Execução real: Alembic 1.20.0 em SQLite, revisões r1 e r2: ''Running upgrade  -> r1, cria cliente'',
    ''Running upgrade r1 -> r2, amplia cpf para 14'', ''Running downgrade r2 -> r1, amplia cpf para 14''
    e de novo ''Running upgrade r1 -> r2, amplia cpf para 14'', saída 0.'
- texto: o SQLite quase não tem ALTER; o modo batch recria a tabela nele e emite o ALTER direto nos outros
    bancos
  ref: alembic-batch
  localizacao: seções sobre o limite do ALTER no SQLite e o fluxo 'move and copy'
  resultado: confirmada
  nota: A execução do par upgrade/downgrade em batch foi só em SQLite; o ALTER direto em PostgreSQL é
    o que a documentação afirma, sem execução da curadoria.
- texto: o verificador de PR bloqueia a alteração de migration que já existe na base e pede migration
    corretiva incremental
  ref: sdd-scaffold-verificar-pr
  localizacao: docstring e função analisar()
  resultado: confirmada
- texto: migration é todo arquivo sob migration/, migrations/ ou alembic/; db/changelog/ e db/migrate/
    ficam fora; o verificador só olha o caminho, não o banco
  ref: sdd-scaffold-verificar-pr
  localizacao: constante MIGRATION = (^|/)(migrations?|alembic)/
  resultado: confirmada
  nota: 'Cobertura executada com a expressão copiada do commit fixado: db/migration/V2__cria_cpf.sql True;
    alembic/versions/a1b2_amplia_cpf.py True; app/migrations/0002_cpf.py True; db/changelog/002-cpf.xml
    False; db/migrate/002_cpf.rb False.'
- texto: o verificador emite AVISO, sem bloquear, quando o PR altera código e o plano não traz seção de
    evidências com saída de execução colada (ou não há plano em docs/plans/)
  ref: sdd-scaffold-verificar-pr
  localizacao: função analisar(), bloco toca_codigo; constante EVIDENCIA
  resultado: confirmada
  nota: Mensagens lidas no template/scripts/verificar_pr.py da cópia local do sdd-scaffold.
- texto: a migration de desfazer do Flyway (prefixo U) só existe nas edições pagas (Teams); sem ela o
    rollback é uma migration corretiva testada num banco efêmero
  ref: flyway-undo
  localizacao: 'abertura da página: ''EDITION: TEAMS'''
  resultado: confirmada
  nota: 'A sequência com a V4 corretiva foi executada pela curadoria em PostgreSQL 16 efêmero com flyway/flyway:11:
    "Successfully applied 3 migrations ... now at version v3" e, depois da V4, "Successfully applied 1
    migration ... now at version v4" e cpf character varying(11).'
- texto: 'desde a 1.7.0 o verificar_pr.py confere a base antes do diff; sem a base no clone imprime "ERRO:
    base <base> não encontrada" e sai com 2 (na 1.6.1 o main não conferia)'
  ref: sdd-scaffold-verificar-pr
  localizacao: tags v1.7.0 e v1.7.1, template/scripts/verificar_pr.py, função main()
  resultado: confirmada
  nota: 'Mudou com a versão: na 1.6.1 (a8ebdf3) um clone sem a base imprimia que não havia arquivo
    alterado e saía com 0. O diff a8ebdf3..v1.7.0 do arquivo foi lido por inteiro; a conferência
    da base é a única mudança de comportamento do script que o texto publicado descreve. A 1.7.1
    mantém a conferência e só muda a lista de arquivos alterados (próxima afirmação).'
- texto: as mensagens BLOQUEIA (migration alterada), AVISO de rollback e AVISO de evidência e a expressão
    MIGRATION continuam iguais na 1.7.0 e na 1.7.1
  ref: sdd-scaffold-verificar-pr
  localizacao: tags v1.7.0 e v1.7.1, template/scripts/verificar_pr.py, constantes MIGRATION e EVIDENCIA e função analisar()
  resultado: confirmada
  nota: 'git diff a8ebdf3 v1.7.0 -- template/scripts/verificar_pr.py: o diff só acrescenta a constante
    TESTE, as checagens de spec (requisito R<n>, aprovação, marcador ESCLARECER, critério), o rastreio
    requisito-tarefa-teste, e a conferência da base; as mensagens citadas no texto não mudaram. O
    diff v1.7.0 v1.7.1 do arquivo é uma linha, em main() (--no-renames).'
- texto: o verificar_pr.py hospedado no portal tem o sha256 616cc4c2357a1c0bda831e310722e24001820e1b7aa8cbc6e6200b60a57eb30e,
