- texto: na 1.7.1 o verificar_pr.py lista os arquivos alterados com --no-renames; renomear ou mover a migration bloqueia, porque o caminho antigo segue na lista, e na 1.7.0 isso passava
  ref: sdd-scaffold-verificar-pr
  localizacao: tag v1.7.1, template/scripts/verificar_pr.py, função main() (git diff --name-only --no-renames); CHANGELOG.md [1.7.1], 'Corrigido'
  resultado: confirmada
  nota: 'Executado em 2026-10-06 num projeto gerado pela tag v1.7.1, com remoto bare local e V1 e V2 em origin/main. Renomear a V2 na mesma pasta e editá-la, mover a V2 para db/outro/, apagar e editar: os quatro saem 1 com "BLOQUEIA: db/migration/V2__cria_cpf.sql já existe na base e foi alterado". Com o script da v1.7.0 na mesma branch: o rename com edição deu só o AVISO de rollback e o move para fora de db/migration/ deu "nenhum achado".'
- texto: o job do template roda o script com python3 -I, e o README da 1.7.1 declara que a trava vale contra descuido e não contra má-fé, porque o job roda o script do próprio PR
  ref: sdd-scaffold-readme
  localizacao: README na tag v1.7.1, parágrafo 'Limite da trava de PR' (logo depois de 'Só o último bloqueia')
  resultado: confirmada
  nota: Lido no README do clone local na tag v1.7.1 (git diff v1.7.0 v1.7.1 -- README.md acrescenta o parágrafo); as duas mitigações do README são CODEOWNERS e proteção de branch em scripts/ e .github/, ou rodar o script da base.
