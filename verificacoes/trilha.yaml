conteudo: trilha
verificado_em: '2026-10-20'
verificador: agente-curadoria
afirmacoes:
- texto: O mattpocock/skills está na versão 1.3.1 no commit fixado.
  ref: mattpocock-changelog
  localizacao: cabeçalho da versão 1.3.1, a mais recente do arquivo
  resultado: confirmada
  nota: "Reconferência da tarefa 12 na versão 7.0.0 do obra/superpowers (tarefa C1); fontes lidas no raw do GitHub nos commits fixados em componentes.yml, só com leitura. Os ids de referência com nome de pessoa (mattpocock-*) identificam a fonte, o repositório mattpocock/skills, e não uma pessoa citada pelo portal."
- texto: O obra/superpowers está na versão 7.0.0 no commit fixado.
  ref: superpowers-release-notes
  localizacao: cabeçalho v7.0.0 (2026-10-09), o mais recente do arquivo
  resultado: confirmada
- texto: A skill to-spec publica a spec no tracker de issues do projeto.
  ref: mattpocock-to-spec
  localizacao: Process, passo 3 ("publish it to the project issue tracker")
  resultado: confirmada
- texto: A code-review procura a spec de origem em quatro lugares, nesta ordem, as issues citadas nos commits, um caminho passado pelo usuário, um arquivo em docs/, specs/ ou .scratch/ e uma pergunta ao usuário.
  ref: mattpocock-code-review
  localizacao: Process, passo 2 (Identify the spec source), itens 1 a 4
  resultado: confirmada
- texto: O setup pergunta onde ficam as issues e aceita a opção "Other" com a descrição do fluxo em um parágrafo.
  ref: mattpocock-setup-matt-pocock-skills
  localizacao: Process, Section A (Issue tracker), opção "Other (Jira, Linear, etc.)"
  resultado: confirmada
- texto: O brainstorming do obra/superpowers só grava um desenho quando o trabalho tem o tamanho de um projeto, e o grava em docs/superpowers/specs/.
  ref: superpowers-brainstorming
  localizacao: "Sizing the Work (tabela: só 'A project with a written design' produz documento) e The Written Design, 'Where it goes'"
  resultado: confirmada
- texto: No brainstorming e no writing-plans, a preferência do usuário sobre o local vale mais do que o padrão.
  ref: superpowers-brainstorming
  localizacao: "The Written Design, 'Where it goes' ('Your human partner's preferences override both')"
  resultado: confirmada
- texto: O writing-plans grava o plano em docs/superpowers/plans/ e a preferência do usuário sobre o local vale mais do que o padrão.
  ref: superpowers-writing-plans
  localizacao: cabeçalho, linhas "Save plans to" e "User preferences for plan location override this default"
  resultado: confirmada
- texto: As skills do mattpocock/skills são escritas em inglês, e o modelo de spec do to-spec tem os títulos Problem Statement, User Stories e Out of Scope.
  ref: mattpocock-to-spec
  localizacao: arquivo inteiro em inglês; bloco spec-template
  resultado: confirmada
- texto: As skills do obra/superpowers são escritas em inglês.
  ref: superpowers-brainstorming
  localizacao: arquivo inteiro em inglês
  resultado: confirmada
- texto: O laço de TDD do mattpocock/skills deixa a refatoração de fora, que pertence à etapa de revisão.
  ref: mattpocock-tdd
  localizacao: Rules of the loop ("Refactoring is not part of the loop", "belongs to the review stage")
  resultado: confirmada
- texto: O TDD do obra/superpowers tem a refatoração como terceira fase do ciclo vermelho, verde e refatorar.
  ref: superpowers-test-driven-development
  localizacao: Red-Green-Refactor (diagrama do ciclo e passo "REFACTOR - Clean Up")
  resultado: confirmada
- texto: O TDD do obra/superpowers manda apagar o código escrito antes do teste, sem guardá-lo como referência.
  ref: superpowers-test-driven-development
  localizacao: The Iron Law ("Write code before the test? Delete it", "Don't keep it as reference")
  resultado: confirmada
- texto: O CHANGELOG do mattpocock/skills registra, na 1.3.0, uma skill removida e a convenção CONTEXT.md renomeada para GLOSSARY.md.
  ref: mattpocock-changelog
  localizacao: versão 1.3.0, Minor Changes (resolving-merge-conflicts removida; CONTEXT.md/CONTEXT-MAP.md renomeados para GLOSSARY.md/GLOSSARY-MAP.md)
  resultado: confirmada
- texto: As notas do obra/superpowers registram, na 6.4.1, a reescrita do executing-plans e, na 7.0.0, a do brainstorming.
  ref: superpowers-release-notes
  localizacao: v6.4.1 (2026-09-18), seção Executing Plans; v7.0.0 (2026-10-09), parágrafo de abertura e seção Brainstorming
  resultado: confirmada
- texto: O portal fixa a versão e o commit de cada coleção, visíveis na URL e na data de verificação de cada referência.
  ref: portal-referencias
  localizacao: lista de referências (URL com o commit, versão e data de verificação de cada uma)
  resultado: parcial
  nota: A página mostra a URL no commit fixado, a versão e a data de verificação. A regra de revalidar ao vencer o prazo de revisão é da curadoria do portal (skill curadoria-de-pratica, passo 6) e não está publicada em página; o texto a apresenta como regra do portal, não como fato de fonte externa.
- texto: O SCOPE.md do mattpocock/skills diz que propostas e contribuições de skill nova estão fechadas e que uma ideia só fica aberta se descrever uma falha observada numa sessão real.
  ref: mattpocock-scope
  localizacao: seções The bar (parte 1, Observed failure) e By bucket (New skills)
  resultado: confirmada
