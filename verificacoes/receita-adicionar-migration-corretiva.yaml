revisao_adversarial:
  revisor: conferência em lote (ADR 0005), sessão independente
  data: '2026-10-06'
  achados:
  - afirmacao: 'exemplos/adicionar-migration-corretiva/executar.sh e passo 6 da receita: shasum -a 256 -c'
    problema: '[médio] o resultado do shasum era ignorado e o script seguia para o verificar_pr.py; o hash fixo
      na receita pode ficar velho e o arquivo de hash usava o caminho fixo /tmp/hash-verificar-pr.txt.'
    tratamento: 'Tratado: o script sai com 1 e ''hash não bate'' se o shasum falhar; o bloco da receita só roda
      o verificar_pr.py se o shasum passar e o texto diz que o script não se roda com hash divergente; o arquivo
      de hash passou a ser temporário (mktemp), e o texto diz que o hash é o da versão fixada e que, se o scaffold
      subir, vale o sha256 do index.json.'
  - afirmacao: 'exemplos/adicionar-migration-corretiva/executar.sh: espera pelo banco (until pg_isready)'
    problema: '[médio] o laço não tem limite: se a imagem não sobe, o script não termina.'
    tratamento: 'Tratado: contador com teto de 30 tentativas de 1 s, mensagem e saída 1 ao esgotar; o bloco equivalente
      no texto da prática ou da receita também tem o limite.'
  - afirmacao: 'exemplos/adicionar-migration-corretiva/executar.sh: nome fixo pg-efemero e rede efemera com trap'
    problema: '[baixo] se já existirem, o docker run falha, o laço espera no container alheio e o trap derruba recursos
      que não são do script.'
    tratamento: 'Tratado no texto: aviso de uma linha de que o script para o container pg-efemero ao sair e de que
      o nome não deve ser usado por outro container; o nome não mudou, por decisão do dono.'
  - afirmacao: 'Prompt da receita, passo 4: espera pelo banco'
    problema: '[médio] o passo dizia só ''espere o banco aceitar conexão'', sem limite.'
    tratamento: 'Tratado: o passo pede no máximo 30 tentativas com sleep 1 e parar se esgotar. Nota: prompt alterado
      em 2026-10-06 após a conferência, sem reteste (decisão do dono).'
