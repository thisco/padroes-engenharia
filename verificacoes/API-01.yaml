conteudo: API-01
verificado_em: '2026-10-06'
verificador: agente-curadoria
afirmacoes:
- texto: uma descrição OpenAPI formaliza a superfície de uma API e a semântica dela
  ref: openapi-spec
  localizacao: seção 2 (Introduction), 'An OpenAPI Description (OAD) formally describes the surface of an API and its semantics' (versão 3.2.1)
  resultado: confirmada
- texto: a especificação define o info.version como a versão do documento OpenAPI, distinta da versão da especificação e da versão da API descrita
  ref: openapi-spec
  localizacao: seção 4.2.1 (Info Object, Fixed Fields), campo version
  resultado: confirmada
- texto: o documento OpenAPI é um objeto JSON que pode ser representado em JSON ou em YAML
  ref: openapi-spec
  localizacao: seção 3 (Format)
  resultado: confirmada
- texto: o campo deprecated da operação diz que os consumidores devem evitar usá-la
  ref: openapi-spec
  localizacao: seção 4.10.1 (Operation Object, Fixed Fields), campo deprecated ('Consumers SHOULD refrain from usage of the declared operation')
  resultado: confirmada
- texto: o software que usa o Versionamento Semântico deve declarar uma API pública, no código ou na documentação, desde que precisa e compreensiva
  ref: semver
  localizacao: item 1 da especificação (tradução pt-BR)
  resultado: confirmada
- texto: a versão maior sobe com mudanças incompatíveis na API, e a menor com funcionalidade nova compatível
  ref: semver
  localizacao: resumo e itens 7 e 8 da especificação (tradução pt-BR)
  resultado: confirmada
- texto: a versão menor deve subir quando uma funcionalidade da API pública é definida como descontinuada
  ref: semver
  localizacao: item 7 da especificação (tradução pt-BR)
  resultado: confirmada
- texto: a Fase 2 da skill sdd-lifecycle varre a spec por quebra de contrato de API e, se achar, bloqueia o fluxo, pede uma ADR no formato Nygard e aguarda a aprovação humana explícita
  ref: sdd-lifecycle
  localizacao: SKILL.md, 'Fase 2 — Gate arquitetural (Tier 2) — GATEKEEPER', item 1 ('Mudanças destrutivas')
  resultado: confirmada
- texto: o oasdiff tem o subcomando breaking, que mostra só as mudanças que quebram clientes existentes
  ref: oasdiff
  localizacao: README, descrição da ferramenta e subcomando breaking
  resultado: confirmada
