      que a prática ensina. O texto não cobre isso.'
    tratamento: 'Tratado em T10: o guardrail registra só o veredito (''CPF: 3 mascarados; e-mail: 1 mascarado; vazamento:
      nenhum''), nunca o conteúdo, e o verificador lê esse registro; Exemplo reexecutado com Docker (docker system
      df antes, porta 4001, down -v ao fim).'
