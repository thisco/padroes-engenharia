- texto: 'a classe CustomGuardrail tem o gancho async_pre_call_hook, que roda antes da chamada e pode alterar as
    mensagens; o registro é guardrail: <módulo>.<Classe> com mode no config.yaml'
  ref: litellm-custom-guardrail
  localizacao: seções de estrutura da classe, ganchos, registro no config.yaml e modificação das mensagens em pre_call
