    problema: '[médio] o log do gateway imprime o conteúdo inteiro da mensagem. Reproduzido: com o guardrail ligado,
      "CPF 529 982 247 25", nome, telefone e endereço seguiram ao modelo e foram para o log em claro; só a máscara
