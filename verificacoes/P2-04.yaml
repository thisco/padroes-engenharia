    tratamento: 'Tratado em T10: a regex aceita ponto, hífen ou espaço em qualquer combinação (o Exemplo manda três
      formatos e a contagem fecha em 3 CPFs; o protocolo de 11 dígitos inválido fica intacto); o texto lista os
