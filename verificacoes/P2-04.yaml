  localizacao: seção do parâmetro mock_response
  resultado: confirmada
  nota: A página documenta a biblioteca; o uso no config.yaml do proxy foi confirmado pela execução.
- texto: 'dado pessoal é a informação relacionada a pessoa natural identificada ou identificável (art. 5º, I); tratamento
    inclui a transmissão (art. 5º, X); princípio da necessidade: mínimo necessário, dados pertinentes, proporcionais
    e não excessivos (art. 6º, III)'
  ref: lgpd
  localizacao: art. 5º, I e X; art. 6º, III
  resultado: confirmada
- texto: a leitura de que o CPF no prompt excede o mínimo quando a tarefa não o exige
  ref: lgpd
