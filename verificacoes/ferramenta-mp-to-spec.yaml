conteudo: ferramenta-mp-to-spec
verificado_em: 2026-10-21
verificador: agente-curadoria
afirmacoes:
  - texto: "a skill não entrevista: sintetiza a conversa e o código"
    ref: mattpocock-to-spec
    localizacao: "cabeçalho (description) e primeiro parágrafo: 'Do NOT interview the user'"
    resultado: confirmada
  - texto: "as costuras de teste são combinadas com a pessoa antes, e quanto menos, melhor"
    ref: mattpocock-to-spec
    localizacao: "seção 'Process', passo 2"
    resultado: confirmada
  - texto: "a spec é publicada no rastreador de issues com o rótulo ready-for-agent"
    ref: mattpocock-to-spec
    localizacao: "seção 'Process', passo 3"
    resultado: confirmada
  - texto: "o modelo tem Problem Statement, Solution, User Stories, Implementation Decisions, Testing Decisions, Out of Scope e Further Notes"
    ref: mattpocock-to-spec
    localizacao: "bloco spec-template"
    resultado: confirmada
  - texto: "o modelo não traz caminho de arquivo nem trecho de código, salvo trecho vindo de protótipo, e não tem requisitos numerados com critério"
    ref: mattpocock-to-spec
    localizacao: "bloco spec-template, 'Implementation Decisions': 'Do NOT include specific file paths or code snippets' e 'Exception: if a prototype produced a snippet'; nenhuma seção de requisitos numerados"
    resultado: confirmada
  - texto: "só a pessoa aciona a skill"
    ref: mattpocock-to-spec
    localizacao: "cabeçalho: disable-model-invocation: true"
    resultado: confirmada
  - texto: "a coleção se instala como plugin pelo marketplace do harness ou como arquivos copiados por um instalador, um dos dois por agente, e o setup roda uma vez por repositório"
    ref: mattpocock-readme
    localizacao: "seção 'Installation (30-second setup)': parágrafo de abertura ('Pick one per agent'), passo 1 ('include setup-matt-pocock-skills') e passo 2 ('Run /setup-matt-pocock-skills', 'run it once per repo')"
    resultado: confirmada
  - texto: "o README só documenta a instalação por plugin ou por instalador, não a cópia manual"
    ref: mattpocock-readme
    localizacao: "seção 'Installation (30-second setup)', passo 1: só comandos de plugin e de instalador"
    resultado: confirmada
  - texto: "o portal fixa o mattpocock/skills na 1.3.1, commit 49dd158"
    ref: portal-referencias
    localizacao: "lista de referências: as do mattpocock/skills trazem a URL no commit 49dd158 e a versão 1.3.1"
    resultado: confirmada
  - texto: "o setup pergunta onde ficam as issues e aceita a opção Other com a descrição do fluxo em um parágrafo"
    ref: mattpocock-setup-matt-pocock-skills
    localizacao: "seção 'Process', passo 2, Section A: Issue tracker (opção Other) e passo 4 ('For other issue trackers')"
    resultado: confirmada
revisao_adversarial:
  revisor: "conferência independente em lote (ADR 0005): sessão nova, modelo econômico, 2026-10-21"
  data: '2026-10-21'
  achados:
    - afirmacao: "como_instalar: rode o setup dela uma vez por repositório"
      problema: "o nome do setup e o aviso de incluí-lo ao escolher as skills no instalador não estavam no texto"
      tratamento: "texto com /setup-matt-pocock-skills, o aviso e o hash do commit"
    - afirmacao: "limites: o modelo vem sem caminho de arquivo nem trecho de código"
      problema: "a fonte abre exceção para trecho vindo de protótipo"
      tratamento: "texto e afirmação com a exceção"
