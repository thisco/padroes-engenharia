conteudo: P1-12
verificado_em: '2026-11-06'
verificador: agente-curadoria
afirmacoes:
- texto: o Goldfish do EGM é um revisor que recebe só o documento e os arquivos que ele cita, sem a conversa anterior, para expor suposições não ditas e pontos cegos
  ref: egm-readme
  localizacao: "parágrafo de abertura ('Goldfish reviewers examine the draft and referenced source material without the earlier conversation, helping expose unstated assumptions and blind spots') e tabela da seção 'How it works', linha Goldfish"
  resultado: confirmada
- texto: a revisão não substitui os testes nem o julgamento humano, e quem aprova o desenho é a pessoa
  ref: egm-readme
  localizacao: "seção 'How it works', parágrafo depois da tabela ('A review does not replace tests or human judgment') e linha You da tabela ('approve the design'); parágrafo de abertura ('You ... approve the specification before implementing')"
  resultado: confirmada
- texto: no teste de compreensão o revisor parafraseia o documento, e o autor recebe a paráfrase inteira, não só os achados
  ref: egm-review-skill
  localizacao: "'Subflow: Comprehension Test', itens 1 ('the author must see the paraphrase') e 2 (relatório começa pelas duas seções de paráfrase)"
  resultado: confirmada
- texto: a egm-review para quando o harness não cria subagente, porque revisar no mesmo contexto não é revisão Goldfish, e grava os relatórios em arquivos, não no chat
  ref: egm-review-skill
  localizacao: "seção 'Delegation', último parágrafo; 'Execution Constraints (CRITICAL)', item 1 (Artifact-First Delivery)"
  resultado: confirmada
- texto: numa spec sem seção de plano de implementação, a egm-review não acha a divisão do documento e oferece só os estágios 5 a 8
  ref: egm-review-skill
  localizacao: "'Step 3: Semantic Split Discovery', item 3, caso 'No Implementation Plan Found' ('Offer to execute Stages 5–8')"
  resultado: confirmada
  nota: "O cabeçalho procurado é '## Detailed Implementation Plan' ou um sinônimo ('## Implementation Plan', '## Work Breakdown', '## Implementation Steps'). No preset 'Feature spec only' a divisão nem é procurada."
- texto: no modo sem pausas, o relatório consolidado é o consolidated_review_report.md; nos demais, há um relatório por estágio
  ref: egm-review-skill
  localizacao: "'Subflow: Uninterrupted Full Flow', itens 1 e 3; subfluxos de cada estágio"
  resultado: confirmada
- texto: a egm-resolve roda na sessão que escreveu o documento, classifica cada achado, só edita depois da escolha da pessoa e traz primeiro os achados ESCALATE, que dependem do que só ela sabe
  ref: egm-resolve-skill
  localizacao: "'Prerequisites & Context Strategy'; Step 2 (categorias); Step 4 (primeiro parágrafo e 'You MUST immediately yield active execution by calling zero tools')"
  resultado: confirmada
- texto: com o desenho escrito, o brainstorming despacha um subagente novo que devolve só as perguntas que um construtor ainda precisaria responder; as que só a pessoa responde voltam a ela numa única rodada, antes da entrega
  ref: superpowers-brainstorming
  localizacao: "seção 'The Written Design', item 'Builder check' (três pilhas, 'Bring the theirs pile in one message', 'That's the only round of questions the check produces') e builder-check-prompt.md ao lado da skill"
  resultado: confirmada
  nota: "Lido no raw do commit fixado bb92a77 em 2026-11-05 (SKILL.md e builder-check-prompt.md)."
- texto: sem ferramenta de subagente, o brainstorming lê o documento ele mesmo, no papel do construtor
  ref: superpowers-brainstorming
  localizacao: "seção 'The Written Design', item 'Builder check', última frase: 'Without a subagent tool, read the document as that builder yourself'"
  resultado: confirmada
- texto: a Fase 2 da sdd-lifecycle varre a spec por mudança destrutiva antes de existir plano, e a Fase 3 para a execução e pergunta se a pessoa aprova a spec, com a aprovação gravada no cabeçalho por quem aprova
  ref: sdd-lifecycle
  localizacao: "SKILL.md no commit a789fc3 (v3.1.0), 'Fase 2 — Gate arquitetural' (item 1, 'ambas sobre a spec (antes de existir plano ou código)') e 'Fase 3 — Checkpoint humano da spec'"
  resultado: confirmada
  nota: "A 3.0.0 (5f6e9ad) foi lida no raw em 2026-11-05. Relido em 2026-11-06 na cópia 3.1.0 em skills/sdd-lifecycle/SKILL.md (commit a789fc3, SHA-256 conferido contra o PROCEDENCIA.md), que é o commit fixado da referência: as Fases 2 e 3 não mudaram, e a 3.1.0 só acrescenta a tabela Aceleradores opcionais."
revisao_adversarial:
  revisor: revisor-independente
  data: '2026-11-06'
  achados:
  - afirmacao: 'Como verificar: ''o relatório da revisão fica ao lado da spec'' e ''se há relatório de
      revisão na mesma pasta'''
    problema: '[médio] executabilidade: a egm-review grava os relatórios na pasta de trabalho ou na pasta
      de artefatos do harness (Execution Constraints, item 1; Subflow Uninterrupted Full Flow, item 1),
      não na pasta da spec. Como aplicar não manda copiar nem mover o relatório, e quem segue o caminho
      1 não chega à evidência que Como verificar pede sem inventar esse passo.'
    tratamento: 'pendente: acrescentar ao caminho 1 o passo de copiar o consolidated_review_report.md
      (ou os relatórios de estágio) para a pasta da spec, ou apontar a linha ''EGM artifact directory:''
      para ela nos harnesses que a aceitam, e dizer isso em Como verificar.'
  - afirmacao: 'Como aplicar, caminho 2: ''Com o desenho escrito, a skill despacha um subagente novo que
      devolve só as perguntas que um construtor ainda precisaria responder'''
    problema: '[médio] executabilidade: a checagem do construtor é um passo interno do brainstorming do
      superpowers, que só escreve desenho para trabalho do tamanho de projeto (seção ''The Written Design'',
      ''For a project''). Para uma spec escrita fora dessa skill (por exemplo na Fase 1 da sdd-lifecycle),
      o texto não diz como rodar só a checagem, e o leitor precisa inventar (por exemplo, despachar à
      mão um subagente com o builder-check-prompt.md).'
    tratamento: 'pendente: dizer que o caminho 2 vale quando a spec nasce no brainstorming do superpowers,
      ou descrever como rodar só a checagem sobre uma spec existente, com referência para o builder-check-prompt.md.'
  - afirmacao: 'Como aplicar, caminho 2: ''devolve só as perguntas que um construtor ainda precisaria
      responder'' [ref:superpowers-brainstorming]'
    problema: '[baixo] o SKILL.md (a URL da referência) diz que o subagente é novo e recebe o builder-check-prompt.md,
      e fala em separar ''what the builder asks''; o ''só as perguntas'' (''Report only the questions
      you''d still need answered'') está no builder-check-prompt.md, arquivo vizinho no commit bb92a77
      que não é referência do portal. A fonte confirma, mas a referência citada só sustenta em parte.'
    tratamento: 'pendente: criar referência para skills/brainstorming/builder-check-prompt.md no commit
      bb92a77 e citá-la nessa oração.'
  - afirmacao: 'Como aplicar, caminho 2: ''registre que a leitura ficou por fazer'''
    problema: '[baixo] executabilidade: o texto não diz onde nem como registrar; Como verificar só prevê
      a linha ''Lido por:'' ou o relatório ao lado da spec.'
    tratamento: 'pendente: dizer onde registrar, por exemplo ''Lido por: ninguém (sem ferramenta de subagente)''
      no cabeçalho da spec.'
  - afirmacao: 'O que fazer: ''A decisão do portal está na ADR 0015'''
    problema: '[médio] a ADR 0015 está com ''Status: proposta'' e com ''Aprovado por:'' e ''Aprovado em:''
      vazios desde o commit 866258a (docs/adr/0015-revisar-spec-por-quem-nao-a-escreveu.md:3-9); enquanto
      o dono não a aprova, ela é proposta, não decisão do portal.'
    tratamento: 'pendente: o dono aprova a ADR 0015, ou o texto passa a dizer ''A proposta do portal está
      na ADR 0015'' até a aprovação.'
