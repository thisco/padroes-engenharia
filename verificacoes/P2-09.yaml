afirmacoes:
- texto: o padrão Asynchronous Request-Reply serve ao trabalho de back-end que não cabe na espera de uma resposta
    síncrona; a maior parte das APIs responde em cerca de 100 ms, e o trabalho de segundos ou minutos não pode
    esperar para responder
  ref: azure-async-request-reply
  localizacao: "abertura e 'Context and problem' ('In most cases, APIs for a client application respond in about 100 milliseconds (ms) or less'; 'you can't wait for the work to finish before you send a response')"
  resultado: confirmada
  nota: "conferida em 2026-11-03 e de novo em 2026-11-04 (página com ms.date 2026-03-30)"
- texto: o cliente que não distingue resposta perdida de pedido não recebido repete o POST que o servidor já aceitou
  ref: azure-async-request-reply
  localizacao: "'Problems and considerations', item do Idempotency-Key ('protects against network failures that cause the client to retry a POST that the server already accepted'; 'the client can't distinguish between a lost response and a request that was never received')"
  resultado: confirmada
  nota: "afirmação nova em 2026-11-04 (o texto passou a citar a fonte nesse trecho); conferida hoje"
- texto: validar antes e responder com erro como 400 se inválido; 202 com Location (status) e Retry-After (espera
    sugerida); trabalho entregue a uma fila; status 200 enquanto pendente e 303 See Other ao terminar; erro gravado
    no recurso; Idempotency-Key devolve o status existente; DELETE para cancelar
  ref: azure-async-request-reply
  localizacao: "'Solution' (passos e nota sobre HTTP 400; diagrama com 202, 200 e 303) e 'Problems and considerations' (tabela de cabeçalhos Location e Retry-After, 303 em vez de 302, erro persistido no recurso do Location, retenção, DELETE, Idempotency-Key); 'Example › AsyncProcessingWorkAcceptor' ('a Retry-After header that suggests a polling interval')"
  resultado: confirmada
  nota: "conferida em 2026-11-03 e de novo em 2026-11-04; a tabela descreve Retry-After como estimativa de conclusão e o exemplo como intervalo de consulta sugerido, o que sustenta 'espera sugerida para a próxima consulta'"
- texto: o 202 diz que o pedido foi aceito para processamento e não terminou, e a resposta deve descrever o estado
    e apontar um monitor de status
  ref: rfc-9110
  localizacao: "seção 15.3.3 '202 Accepted' ('accepted for processing, but the processing has not been completed'; 'ought to describe the request's current status and point to (or embed) a status monitor'), texto .txt do rfc-editor.org"
  resultado: confirmada
  nota: "conferida em 2026-11-03 e de novo em 2026-11-04"
- texto: mensagem não apagada antes do fim da visibilidade volta a ficar visível e outro consumidor a processa;
    padrão de 30 segundos; ajustar ao tempo máximo de processamento; estender com ChangeMessageVisibility; teto de
    12 horas, acima do qual quebrar a tarefa em passos menores; fila de mensagens mortas para o que falha sempre
  ref: aws-sqs-visibility-timeout
  localizacao: "'Setting and adjusting the visibility timeout' (30 segundos; 'becomes visible again in the queue and can be retrieved by another consumer'), 'Handling failures' e 'Best practices' (match the maximum time, heartbeat, 12-hour limit, 'breaking the task into smaller steps', DLQ 'preventing them from repeatedly circulating in the main queue')"
  resultado: confirmada
  nota: "conferida em 2026-11-03 e de novo em 2026-11-04"
- texto: na API de lote da Anthropic, até 100.000 pedidos ou 256 MB, a maioria em menos de uma hora, expira em 24
    horas, 50% do preço padrão, estado por processing_status
  ref: anthropic-message-batches
  localizacao: "'Batch limitations' ('100,000 Message requests or 256 MB'; 'most batches completing within 1 hour'; 'Batches expire if processing does not complete within 24 hours'), 'Pricing' ('All usage is charged at 50 percent of the standard API prices') e 'Tracking your batch' (processing_status de in_progress a ended)"
  resultado: confirmada
  nota: "conferida em 2026-11-03 e de novo em 2026-11-04"
