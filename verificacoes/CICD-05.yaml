  evidencia: 'passo 1: branch feat/2026-11-04-destroy-pelo-ci; passo 2: destruir.sh com set -eu, a comparação e o plano salvo; passo 3: job destruir-homologacao no estágio limpeza (criado), regra da branch padrão com when: manual, manual_confirmation, environment homologacao com action: stop, o job testes intacto; passo 4: sh -n ok, "sh destruir.sh homologacao errado" saída 1 com "nada foi destruído" e sem tofu no PATH, YAML carregado; passo 5: commit 660b7bb só com os dois arquivos, sem trailer; recurso indicado para prevent_destroy: local_file.banco (já protegido).'
  data: '2026-11-04'
revisao_adversarial:
  revisor: revisão independente em lote, 2026-11-04 (antes dela, autorrevisão do curador no mesmo dia, cujos achados seguem no fim da lista)
  data: '2026-11-04'
  achados:
  - afirmacao: 'CICD-05, O que fazer 1, e github-destruir.yml: "o primeiro passo do job confere a ref"'
    problema: '[Important] falsa garantia: o workflow_dispatch contra outra branch roda o arquivo daquela branch, e quem a escreve pode apagar o test "$REF" e a comparação. O mesmo, em menor grau, para a regra $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH do GitLab.'
    tratamento: 'Tratado: O que fazer, Como aplicar 3 e 4, Por ferramenta e Como verificar atribuem a proteção ao servidor (branches de deploy e revisores do ambiente no GitHub, github-environments-deploy; ambiente protegido e branch protegida no GitLab, gitlab-jobs-manuais e gitlab-branches-protegidas; a confiança presa à main ou ao ambiente da CICD-04) e chamam a checagem no arquivo de defesa em profundidade; os dois moldes dizem isso em comentário.'
  - afirmacao: 'referencias/gitlab-manual-confirmation.yaml, notas: "um clique numa caixa de diálogo"'
    problema: '[Minor] frase retirada do corpo por falta de fonte continuava na nota da referência.'
    tratamento: 'Tratado: a nota diz que a página fala em mensagem de confirmação própria e não descreve a forma da confirmação.'
  - afirmacao: 'CICD-05, O que fazer: workflow_dispatch "só aparece se o arquivo estiver na branch padrão"'
    problema: '[ref] a fonte diz que o evento só dispara se o arquivo existir na branch padrão, e que pela API ou CLI o disparo aponta qualquer branch ou tag.'
    tratamento: 'Tratado: o texto diz "só dispara" e acrescenta o disparo pela API; o job confere a ref no primeiro passo.'
  - afirmacao: 'CICD-05, Exemplo GitLab: regra com a variável do alvo informada ao rodar o job'
    problema: '[executabilidade] a variável informada ao rodar o job manual não existe quando as rules são avaliadas, na criação do pipeline.'
    tratamento: 'Tratado: um job por ambiente, com o alvo fixo no job; só a confirmação vem da variável informada ao rodar.'
  - afirmacao: 'CICD-05, prevent_destroy'
    problema: '[limite] o erro do OpenTofu sugere excluir o recurso da rodada (-exclude), o que contorna a proteção.'
    tratamento: 'Declarado em Como verificar: o script do Exemplo não aceita a opção.'
  - afirmacao: 'CICD-05, Exemplo'
    problema: '[executabilidade] os pipelines não rodaram num GitLab nem num GitHub.'
    tratamento: 'Declarado em Como verificar; o script e o OpenTofu rodaram de verdade em executar.sh.'
  - afirmacao: 'CICD-05, O que fazer: o manual_confirmation "é um clique"'
    problema: '[ref] a fonte fala em mensagem de confirmação própria e não descreve a forma da confirmação.'
    tratamento: 'Tratado: o texto diz só que acrescenta uma confirmação com mensagem própria; a comparação do nome digitado fica no script.'
