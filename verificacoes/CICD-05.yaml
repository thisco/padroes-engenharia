conteudo: CICD-05
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: o tofu destroy destrói todos os objetos remotos que a configuração gerencia
  ref: opentofu-destroy
  localizacao: "abertura ('The tofu destroy command is a convenient way to destroy all remote objects managed by a particular OpenTofu configuration') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: a documentação lembra que em produção, em geral, não se quer destruir objeto de longa duração
  ref: opentofu-destroy
  localizacao: "abertura ('While you will typically not want to destroy long-lived objects in a production environment') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: tofu plan -destroy grava o plano de destruição, mostrando as mudanças propostas sem executá-las
  ref: opentofu-destroy
  localizacao: "trecho da prévia ('tofu plan -destroy' roda o plan em modo destroy, 'showing you the proposed destroy changes without executing them'); o -out vem do tofu plan e o tofu destroy é atalho de tofu apply -destroy (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o tofu apply de um plano salvo executa sem pedir outra confirmação
  ref: opentofu-apply
  localizacao: "modo com plano salvo ('OpenTofu takes the actions in the saved plan without prompting you for confirmation') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: com prevent_destroy, o OpenTofu rejeita com erro o plano que destruiria o objeto
  ref: opentofu-prevent-destroy
  localizacao: "'Lifecycle Customizations', prevent_destroy ('will cause OpenTofu to reject with an error any plan that would destroy' o objeto; exemplo de objeto caro: instância de banco) (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o prevent_destroy só protege enquanto está na configuração e não impede a destruição quando o bloco do recurso sai dela
  ref: opentofu-prevent-destroy
  localizacao: "mesmo trecho ('as long as the argument remains present in the configuration'; 'cannot prevent the remote object from being destroyed when the resource block is removed from configuration') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o job manual só roda quando alguém o inicia
  ref: gitlab-jobs-manuais
  localizacao: "trecho de job manual ('You can require that a job doesn't run unless a user starts it. This type of job is called a manual job') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: ao rodar o job manual, informam-se variáveis próprias do job
  ref: gitlab-jobs-manuais
  localizacao: "trecho 'When running manual jobs you can supply additional job specific CI/CD variables' (abrir o job pelo nome, não pelo botão Run) (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: com ambiente protegido, só quem está na lista roda o job manual, nos planos Premium e Ultimate
  ref: gitlab-jobs-manuais
  localizacao: "seção de proteger job manual ('Use protected environments to define a list of users authorized to run a manual job'; 'Only users in this list or GitLab administrators can run this manual job'; seção marcada Premium e Ultimate) (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o manual_confirmation acrescenta ao job manual uma confirmação com mensagem própria
  ref: gitlab-manual-confirmation
  localizacao: "seção 'manual_confirmation' ('Use manual_confirmation with when: manual to define a custom confirmation message for manual jobs'; introduzido no GitLab 17.1; vale também para job de environment:action: stop desde o 18.3) (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o manual_confirmation pede GitLab 17.1 ou mais novo, e 18.3 no job que para ambiente
  ref: gitlab-manual-confirmation
  localizacao: "History da seção ('Introduced in GitLab 17.1'; 'Support for environment stop jobs introduced in GitLab 18.3') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: environment com action stop marca o job como o que para o ambiente
  ref: gitlab-environment-action
  localizacao: "seção 'environment:action', valor stop ('Indicates that the job stops an environment') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: no job manual, GITLAB_USER_LOGIN é quem iniciou o job
  ref: gitlab-variaveis-predefinidas
  localizacao: "linha GITLAB_USER_LOGIN ('In manual jobs, the value is the username of the user who started the job') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: CI_COMMIT_SHA é o commit do pipeline
  ref: gitlab-variaveis-predefinidas
  localizacao: "linha CI_COMMIT_SHA ('The commit revision the project is built for') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: workflow_dispatch é o disparo manual de um workflow
  ref: github-workflow-dispatch
  localizacao: "seção 'workflow_dispatch' ('To enable a workflow to be triggered manually, you need to configure the workflow_dispatch event') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o workflow_dispatch só dispara se o arquivo do workflow estiver na branch padrão
  ref: github-workflow-dispatch
  localizacao: "seção 'workflow_dispatch' ('This event will only trigger a workflow run if the workflow file exists on the default branch') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: pela API ou pela CLI, o disparo pode apontar qualquer branch ou tag, e a execução roda o último commit dessa ref
  ref: github-workflow-dispatch
  localizacao: "seção 'workflow_dispatch' ('you can dispatch it against any branch or tag via the GitHub API or GitHub CLI'; tabela do evento: GITHUB_SHA 'Last commit on the GITHUB_REF branch or tag', GITHUB_REF 'Branch or tag that received dispatch') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o ambiente do GitHub restringe as branches que podem implantar nele (Selected branches and tags), em todo repositório público e, nos planos Pro e Team, também no privado
  ref: github-environments-deploy
  localizacao: "'Deployment branches and tags' ('Use deployment branches and tags to restrict which branches and tags can deploy to the environment'; opção 'Selected branches and tags'; 'available for all public repositories. For users on GitHub Pro or GitHub Team plans, ... also available for private repositories') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: a branch protegida do GitLab define quem faz push e merge nela
  ref: gitlab-branches-protegidas
  localizacao: "tabela de permissões ('Allowed to merge: Controls who can merge changes through merge requests'; 'Allowed to push and merge: Controls who can push directly to existing protected branches') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: a entrada obrigatória é preenchida à mão no formulário do navegador e lida no contexto inputs
  ref: github-workflow-dispatch
  localizacao: "seção 'workflow_dispatch' ('you must enter values for the required inputs manually before the workflow will run'; 'you can access the input values in the inputs context') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: a entrada do workflow_dispatch pode ser string ou choice e pode ser obrigatória
  ref: github-workflow-syntax
  localizacao: "seções 'on.workflow_dispatch.inputs.<input_id>.type' ('This must be one of: boolean, choice, number, environment or string') e '.required' ('A boolean specifying whether the input must be supplied') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: github.triggering_actor é quem iniciou a execução e github.sha é o commit
  ref: github-contextos
  localizacao: "tabela do contexto github ('The username of the user that initiated the workflow run'; 'The commit SHA that triggered the workflow') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: com revisores obrigatórios no ambiente, o job espera uma aprovação, e quem dispara pode ser impedido de aprovar o próprio pedido; nos planos Free, Pro e Team, só em repositório público
  ref: github-environments-deploy
  localizacao: "trechos de revisores obrigatórios ('require a specific person or team to approve workflow jobs that reference the environment'), de impedir a autoaprovação ('users who initiate a deployment cannot approve the deployment job') e a nota de planos (aberta na web em 2026-11-04)"
  resultado: confirmada
