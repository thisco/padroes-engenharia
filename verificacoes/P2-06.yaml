    e budget_duration; a página descreve a recusa com 401 e ExceededTokenBudget; o orçamento exige banco e sem ele
    não é aplicado
  ref: litellm-budgets
  localizacao: seções de orçamento por chave, erro de orçamento excedido, /key/info e nota do banco
  resultado: confirmada
  nota: Na v1.104.0 a execução devolveu 422 e budget_exceeded; o texto registra os dois.
- texto: o gasto é acompanhado por chave, usuário e time
  ref: litellm-virtual-keys
  localizacao: seção 'Spend Tracking'
  resultado: confirmada
- texto: custo por token declarado em model_info (input_cost_per_token e output_cost_per_token)
  ref: litellm-custom-pricing
  localizacao: seção de custo por token no model_info
  resultado: confirmada
- texto: o alerta de orçamento usa o Slack (SLACK_WEBHOOK_URL), budget_alerts em alert_types e alerting slack; há
    soft_budget na chave
  ref: litellm-alerting
  localizacao: tipos de alerta, seção de soft budget e ativação
  resultado: confirmada
  nota: 'O alerta não foi executado: exige webhook do Slack.'
- texto: o proxy roda com Docker; sem banco o orçamento não é aplicado e o proxy segue atendendo
  ref: litellm-proxy-docker
  localizacao: seções de Docker e nota do banco
  resultado: confirmada
- texto: um AI gateway gerencia o uso de tokens e as cotas entre várias aplicações
  ref: azure-apim-ai-gateway
  localizacao: seção 'Why use an AI gateway?'
  resultado: confirmada
