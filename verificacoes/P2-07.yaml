afirmacoes:
- texto: o guia de GenAIOps divide o trabalho com modelo em laço interno (dados, experimentação e avaliação)
    e externo (deploy, inferência, monitoramento e feedback)
  ref: azure-genaiops-mlops
  localizacao: "seção 'Extend MLOps for generative AI technical patterns' (listas Inner loop: DataOps, Experimentation, Evaluation; Outer loop: Deployment, Inferencing and monitoring, Feedback loop)"
  resultado: confirmada
- texto: o gateway, junto com o versionamento do modelo, reduz o risco do deploy e permite voltar à versão
    anterior quando há problema
  ref: azure-genaiops-mlops
  localizacao: "seção 'Deployment', subseção 'RAG and prompting' ('The use of a gateway, along with model versioning, enables you to minimize risk when you deploy changes and to roll back to previous versions when problems occur')"
  resultado: confirmada
- texto: a chave virtual acompanha o gasto e controla o acesso a modelos; a lista models do /key/generate
    restringe os modelos, o alias vai em key_alias e /key/block bloqueia a chave
  ref: litellm-virtual-keys
  localizacao: "abertura ('Track Spend, and control model access via virtual keys'), exemplos de /key/generate com models, seção do padrão de key_alias e seção 'Disable Keys' (/key/block); página aberta em 2026-11-03"
  resultado: confirmada
- texto: CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da MR
  ref: gitlab-variaveis-predefinidas
  localizacao: 'linha CI_MERGE_REQUEST_DIFF_BASE_SHA ("The base SHA of the merge request diff."); aberta em 2026-11-03'
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' ('To disable shallow clone ... set to 0'); aberta em 2026-11-03"
  resultado: confirmada
- texto: com allow_failure true, o job que falha fica com aviso laranja e o pipeline continua bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' ('an orange warning ... indicates that a job failed. However, the pipeline is successful'); aberta em 2026-11-03"
  resultado: confirmada
- texto: github.base_ref é a branch de destino do pull request
  ref: github-actions-contextos
  localizacao: "contexto github, linha github.base_ref"
  resultado: confirmada
- texto: fetch-depth 0 traz o histórico de todas as branches e tags
  ref: github-actions-checkout
  localizacao: "README, entrada fetch-depth"
  resultado: confirmada
- texto: continue-on-error true no passo impede que o job falhe quando o passo falha
  ref: github-actions-sintaxe
  localizacao: "seção 'jobs.<job_id>.steps[*].continue-on-error' ('Prevents a job from failing when a step fails')"
  resultado: confirmada
