revisao_adversarial:
  revisor: conferência em lote (ADR 0005), sessão independente
  data: '2026-10-07'
  achados:
  - afirmacao: 'exemplos/LGPD-01/verificar-classificacao.py: extração de colunas e Como verificar (''reprova o ADD COLUMN
      sem linha no registro'')'
    problema: '[alto] coluna de nome key, index, check, unique, primary, foreign ou constraint era descartada como constraint,
      e só a primeira cláusula de ALTER TABLE ... ADD COLUMN a, ADD COLUMN b era vista; com key, "index" e cpf_pai fora
      do dados.md o verificador saía 0 com ''3 campos, todos classificados''.'
    tratamento: 'Tratado: constraint e índice passam a ser reconhecidos pela sintaxe (PRIMARY KEY (, CONSTRAINT nome, UNIQUE
      (, CHECK (, FOREIGN KEY (, INDEX/KEY nome (), nunca pelo nome da coluna, com ou sem aspas; cada cláusula ADD [COLUMN]
      é percorrida. O caso do conferente sai 1 e lista key, index e cpf_pai; os dois estados do Exemplo seguem iguais (1
      antes, 0 depois); o Como verificar passou a dizer isso.'
  - afirmacao: 'Exemplo: estado antes'
    problema: '[médio] o ''antes'' dependia de um projeto-modelo que não existe em exemplos/LGPD-01/.'
    tratamento: 'Tratado em 2026-10-07: exemplos/LGPD-01/dados-antes.md; verificador rodado nos dois estados (saída 1 e
      0).'
