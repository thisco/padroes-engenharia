afirmacoes:
- texto: a implementação de lógica começa por um teste que falha, escrito antes do código de produção, e ele falha pela ausência da implementação e não por erro de setup
  ref: sdd-scaffold-steering-qualidade
  localizacao: seção 'TDD e prove-it', primeiro item (página aberta no commit fixado da tag v1.7.1)
  resultado: confirmada
- texto: nenhuma tarefa ou PR fecha sem a saída real dos comandos de validação colada no plano, e não se afirma que algo passa sem o output
  ref: sdd-scaffold-steering-qualidade
  localizacao: seção 'Evidência antes de conclusão'
  resultado: confirmada
- texto: em spec com requisitos R<n>, o teste cita o requisito em comentário (# cobre) ou no nome da função, o verificador de PR avisa quando um R<n> não aparece em teste alterado, e a citação não é cobertura
  ref: sdd-scaffold-steering-qualidade
  localizacao: seção 'Rastreio do requisito no teste', itens e 'Limite'
  resultado: confirmada
- texto: a documentação sobre avaliação de aplicações com LLM começa por definir o critério de sucesso e depois desenhar a avaliação que o mede
  ref: anthropic-develop-tests
  localizacao: abertura da página ('starts with clearly defining your success criteria and then designing evaluations')
  resultado: confirmada
- texto: o pytest sai com código 1 quando algum teste falha e com 0 quando todos são coletados e passam
  ref: pytest-exit-codes
  localizacao: lista de exit codes, códigos 0 e 1
  resultado: confirmada
- texto: o resumo short test summary info lista, por padrão (fE), as falhas e os erros
  ref: pytest-saida
  localizacao: seção sobre a opção -r e o short test summary info
  resultado: confirmada
- texto: o pytest descobre arquivos test_*.py ou *_test.py, e argumentos de linha de comando podem nomear arquivos
  ref: pytest-boas-praticas
  localizacao: seção de test discovery e argumentos de linha de comando
  resultado: confirmada
- texto: "o rótulo do marco, 'teste falhou antes', resume o que a prática exige; a trilha lista até seis marcos por etapa e hoje não inclui esta prática na etapa Codar"
  ref: portal-trilha
  localizacao: "corpo da prática, seção 'O que fazer'; página da trilha, etapa Codar, 'Para sair desta etapa' (seis marcos e o link 'e mais')"
  resultado: confirmada
