  nota: Página aberta de novo em 2026-10-06; a restrição de modelos por chave é a da seção citada na P2-01
    e foi exercitada na execução (403 fora da lista).
- texto: o seed-demo.sh cria dois times e duas chaves virtuais; o modelo simulado responde sem provedor;
    os modelos de provedor pedem chave de provedor no .env; UI em /ui com login admin e LITELLM_MASTER_KEY
  ref: gateway-poc-readme
  localizacao: README.md, 'Como subir'; poc/README.md, 'Subir o ambiente' e 'Catálogo de modelos (3 camadas)'
  resultado: confirmada
- texto: o compose do starter fixa a porta 4000 e os nomes de contêiner poc-gateway, poc-db e poc-ollama;
    o seed-demo.sh chama sempre localhost:4000; o config.yaml tem a lista guardrails, um dos itens logging_only;
    as chaves do seed têm orçamento do time
  ref: gateway-poc-compose
  localizacao: poc/docker-compose.yml; poc/gateway/config.yaml, bloco guardrails; poc/seed-demo.sh (criação
    dos times com max_budget e das chaves sem max_budget)
  resultado: confirmada
- texto: os contêineres do Presidio ficam atrás do profile guardrails e pedem mais memória; o README recomenda
    8 GiB e descreve o OOM do gateway
  ref: gateway-poc-readme
  localizacao: poc/README.md, 'Profiles de avaliação' e 'Memória do Docker'
  resultado: confirmada
- texto: derrubar o ambiente do starter apaga os volumes com docker compose down -v
  ref: gateway-poc-readme
  localizacao: poc/README.md, 'Encerrar'
  resultado: confirmada
- texto: o gateway é compatível com o formato da API da OpenAI e um SDK da OpenAI funciona apontando para
    ele; o orçamento só é aplicado com banco
  ref: litellm-proxy-docker
  localizacao: seções 'Call the gateway from your app' e 'Budgets are not enforced without a database'
  resultado: confirmada
- texto: a chave tem max_budget e budget_duration; o proxy só aplica o teto com banco; o código HTTP da
    recusa muda com a versão
  ref: litellm-budgets
  localizacao: seções 'Add budgets to keys', 'Add budget duration to keys' e 'Budgets require a database'
  resultado: confirmada
  nota: A página mostra a recusa como Authentication Error ExceededTokenBudget; na execução com o LiteLLM
    1.100.0 foi 429 budget_exceeded, e na v1.104.0 da P2-06 foi 422.
- texto: o guardrail de PII é uma classe CustomGuardrail cujo gancho async_pre_call_hook roda antes da
    chamada e pode alterar as mensagens
  ref: litellm-custom-guardrail
  localizacao: 'seções ''1. Write a CustomGuardrail Class'', ''2. Pass your custom guardrail class in
    LiteLLM config.yaml'' e ''Advanced: Individual Event Hooks'''
  resultado: confirmada
- texto: o guardrail é registrado no config.yaml com mode pre_call e default_on true
  ref: litellm-guardrails
  localizacao: seções '1. Define guardrails on your LiteLLM config.yaml', 'Supported values for mode (Event
    Hooks)' e 'Default On Guardrails'
  resultado: confirmada
