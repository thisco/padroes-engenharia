revisao_adversarial:
  revisor: conferente independente, modelo econômico, ADR 0005
  data: '2026-10-06'
  achados:
  - afirmacao: '''A skill pede uma sessão ou agente independente, com contexto novo'' e ''o que varia é quem a faz e com que modelo'' (P1-09.md:33 e 47-48)'
    problema: '[médio] o SKILL.md do sdd-lifecycle (linhas 212-213) pede para o Tier 2 ''um modelo de raciocínio potente''; o texto omite isso e conclui, com base na ADR 0005, que o modelo varia. A ADR 0005 trata da curadoria do portal e diz que só prevalece sobre a skill nas fatias em que o dono a aplicar; não vale como regra para quem adota o scaffold.'
    tratamento: 'Tratado em 2026-10-06: o texto cita que a skill pede, no Tier 2, sessão independente com um modelo de raciocínio potente, e apresenta a ADR 0005 só como contexto da curadoria do próprio portal, que não vale como regra para quem adota o scaffold.'
  - afirmacao: 'Exemplo: spec proporcional do P1-08 ''já aprovada''; evidência src/pedidos.py:6 (P1-09.md:89)'
    problema: '[médio] o Exemplo não é autocontido: não traz src/pedidos.py nem os testes, e a spec do P1-08 está em rascunho sem campos de aprovação. A conferência montou arquivos fictícios para ver ''nenhum achado'' (4 arquivo(s)); as evidências de arquivo:linha do plano não são reproduzíveis.'
    tratamento: 'Tratado em 2026-10-06: o Exemplo agora traz src/pedidos.py, o teste, o cabeçalho de aprovação da spec (nome fictício) e o modo de montar a branch; o verificador foi reexecutado num projeto novo do scaffold, com 4 arquivos no diff (AVISO de R2 ausente; depois, nenhum achado).'
  - afirmacao: 'Como aplicar passo 2: ''ele também roda os testes'' (P1-09.md:68)'
    problema: '[médio] trazido do plano (2): o preparo não traz pytest e o prompt assume python3 -m pytest (testado: ''No module named pytest''). O Como aplicar não diz como instalar as dependências antes.'
    tratamento: 'Tratado em 2026-10-06: Como aplicar ganhou o passo 1, que instala as dependências do projeto e o pytest num ambiente virtual antes da revisão.'
  - afirmacao: estudo com cinco revisores atribuiu achados a cláusula (P1-09.md:53-56) [ref:infoq-when-pays-off]
    problema: '[baixo] a fonte sustenta (81% com baseline, 0% sem, p=0,043, n=5, ''directional''), mas o mesmo estudo diz que o baseline não melhorou o recall (0,525 vs 0,518) e dobrou o tempo (48,4 vs 26,7 min); o texto não menciona o custo.'
    tratamento: 'Tratado em 2026-10-06: acrescentada a frase sobre recall igual (0,525 contra 0,518) e tempo maior (48,4 contra 26,7 min); números reconferidos na fonte em 2026-10-06.'
