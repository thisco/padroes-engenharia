revisao_adversarial:
  revisor: conferente independente, modelo econômico, ADR 0005
  data: '2026-10-06'
  achados:
  - afirmacao: 'mecanismo: verificar_constituicao.py@1.7.0, força avisa (praticas/construir-com-ia/P1-03.md:8-9)'
    problema: '[médio] o script não mede tamanho (sem o número 30000 no código; o texto de Como verificar já admite). O limite de 30000 bytes mora no job governanca da receita, e o job reprova o pipeline, não só avisa. O plano lista o mecanismo como ''job governanca'', o frontmatter diz outra coisa.'
    tratamento: 'Tratado em 2026-10-06: o job governanca não é um mecanismo que o portal registre (só script hospedado ou arquivo de scripts/, portal/ ou .gitlab-ci.yml do próprio repositório), e o verificar_constituicao.py não mede tamanho. A prática passou a força orienta com mecanismo null, e Como verificar explica que o verificador candidato é o job governanca, que reprova o pipeline (e só impede o merge com Pipelines must succeed).'
  - afirmacao: 'Exemplo: 200 passos de procedimento levam o AGENTS.md de 5421 a 36653 bytes (P1-03.md:81)'
    problema: '[médio] não reproduz sem inventar: com a linha mostrada (''Procedimento detalhado do passo N: leia a spec, confira o plano, rode a suíte...'') 200 linhas dão 23053 bytes e o job passa. A conferência precisou de linhas de ~150 bytes (49 linhas, 30973 bytes) para ver o FAIL no gitlab-ci-local 4.76.0, que então reproduziu ''grande demais'' como registrado.'
    tratamento: 'Tratado em 2026-10-06: o Exemplo foi refeito com saída real. O texto dá o comando que gera as 200 linhas (cerca de 190 bytes cada) e os números medidos: AGENTS.md de 5387 para 44419 bytes, FAIL no gitlab-ci-local 4.76.0; depois de mover para docs/steering/procedimentos.md, 5482 bytes e PASS. As duas execuções de arquivo abaixo foram refeitas.'
