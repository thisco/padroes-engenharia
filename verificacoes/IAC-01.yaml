conteudo: IAC-01
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: o modelo de steering diz que o ambiente de dev roda no Docker Compose e que, com o código dentro das imagens e sem live-reload, toda alteração exige rebuild antes de recriar os serviços
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Ambiente de dev local (ordem de rebuild)', primeiro parágrafo
  resultado: confirmada
- texto: o modelo pede registrar a ordem exata de rebuild em quatro passos (migrations, rebuild das imagens, recriar com up -d, verificar a saúde)
  ref: sdd-scaffold-infra-devops
  localizacao: comentário 'preencher' da mesma seção
  resultado: confirmada
  nota: Os quatro passos estão num comentário de preenchimento do modelo; o texto do portal diz que nenhum código do scaffold os impõe.
- texto: o Compose, por padrão, espera só o contêiner estar em execução; healthcheck mais depends_on com condition service_healthy esperam o pronto
  ref: docker-compose-startup-order
  localizacao: seções 'Control startup order' (comportamento padrão), 'depends_on condition service_healthy' e exemplo com pg_isready
  resultado: confirmada
- texto: sem a espera, o dependente pode subir antes de a dependência estar operacional e falhar
  ref: docker-compose-startup-order
  localizacao: seção de comportamento padrão
  resultado: confirmada
- texto: --wait espera os serviços em execução ou saudáveis, --wait-timeout limita a espera em segundos
  ref: docker-compose-up
  localizacao: opções --wait e --wait-timeout
  resultado: confirmada
- texto: no compose do gateway-poc, gateway depende de db com service_healthy, db tem healthcheck pg_isready, há profiles guardrails, vectors e agents e o vector-connector tem build a partir de um repositório Git
  ref: gateway-poc-compose
  localizacao: poc/docker-compose.yml, serviços gateway, db, presidio-*, db-vectors, vector-connector e agente-eco (leitura do arquivo na tag v0.1.0)
  resultado: confirmada
- texto: um comentário do arquivo registra que a porta 8001 do host conflitava com outro projeto local e o serviço usa a 8002
  ref: gateway-poc-compose
  localizacao: comentário do serviço vector-connector, bloco ports
  resultado: confirmada
