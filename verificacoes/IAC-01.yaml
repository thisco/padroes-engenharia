conteudo: IAC-01
verificado_em: '2026-11-03'
verificador: agente-curadoria
afirmacoes:
- texto: o modelo de steering diz que o ambiente de dev roda no Docker Compose e que, com o código dentro das imagens e sem live-reload, toda alteração exige rebuild antes de recriar os serviços
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Ambiente de dev local (ordem de rebuild)', primeiro parágrafo
  resultado: confirmada
- texto: o modelo pede registrar a ordem exata de rebuild em quatro passos (migrations, rebuild das imagens, recriar com up -d, verificar a saúde)
  ref: sdd-scaffold-infra-devops
  localizacao: comentário 'preencher' da mesma seção
  resultado: confirmada
  nota: Os quatro passos estão num comentário de preenchimento do modelo; o texto do portal diz que nenhum código do scaffold os impõe.
- texto: o Compose, por padrão, espera só o contêiner estar em execução; healthcheck mais depends_on com condition service_healthy esperam o pronto
  ref: docker-compose-startup-order
  localizacao: seções 'Control startup order' (comportamento padrão), 'depends_on condition service_healthy' e exemplo com pg_isready
  resultado: confirmada
- texto: sem a espera, o dependente pode subir antes de a dependência estar operacional e falhar
  ref: docker-compose-startup-order
  localizacao: seção de comportamento padrão
  resultado: confirmada
- texto: --wait espera os serviços em execução ou saudáveis, --wait-timeout limita a espera em segundos
  ref: docker-compose-up
  localizacao: opções --wait e --wait-timeout
  resultado: confirmada
- texto: no compose do gateway-poc, gateway depende de db com service_healthy, db tem healthcheck pg_isready, há profiles guardrails, vectors e agents e o vector-connector tem build a partir de um repositório
    Git
  ref: gateway-poc-compose
  localizacao: poc/docker-compose.yml, serviços gateway, db, presidio-*, db-vectors, vector-connector e agente-eco (leitura do arquivo na tag v0.1.0)
  resultado: confirmada
- texto: um comentário do arquivo registra que a porta 8001 do host conflitava com outro projeto local e o serviço usa a 8002
  ref: gateway-poc-compose
  localizacao: comentário do serviço vector-connector, bloco ports
  resultado: confirmada
- texto: o Dockerfile pode declarar HEALTHCHECK, que a imagem carrega; HEALTHCHECK NONE desliga o herdado da imagem base; com mais de uma instrução só a última vale
  ref: docker-dockerfile-healthcheck
  localizacao: seção HEALTHCHECK da referência do Dockerfile
  resultado: confirmada
- texto: o modelo de steering de infra e DevOps do scaffold é o docs/steering/infra-devops.md, onde a ordem de rebuild é registrada
  ref: sdd-scaffold-infra-devops
  localizacao: "caminho template/docs/steering/infra-devops.md e seção 'Ambiente de dev local (ordem de rebuild)' (lidos em 2026-11-03 no clone da tag v1.7.1, commit cd121cd, o mesmo fixado na URL da referência)"
  resultado: confirmada
- texto: $CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da MR
  ref: gitlab-variaveis-predefinidas
  localizacao: "tabela de variáveis de merge request (aberta na web em 2026-11-03; 'The base SHA of the merge request diff')"
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' (aberta na web em 2026-11-03; 'To disable shallow clone and make GitLab CI/CD fetch all branches and tags each time, keep the value empty or set to 0'). A parte 'o verificador precisa do commit da base' é do portal, sem referência."
  resultado: confirmada
- texto: um job com allow_failure true que falha mostra um aviso laranja e o pipeline continua bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' (aberta na web em 2026-11-03; 'an orange warning ... indicates that a job failed. However, the pipeline is successful and the associated commit is marked as passed with no warnings'). Não exercitado num GitLab real."
  resultado: confirmada
