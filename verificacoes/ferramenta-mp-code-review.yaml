afirmacoes:
  - texto: "a revisão é do diff entre um ponto fixo e o HEAD, em dois eixos, padrões e spec, cada um num subagente paralelo"
    ref: mattpocock-code-review
    localizacao: "abertura e passo 4 ('Spawn both sub-agents in parallel')"
    resultado: confirmada
  - texto: "o ponto fixo é obrigatório e conferido antes dos subagentes"
    ref: mattpocock-code-review
    localizacao: "passo 1 ('Pin the fixed point')"
    resultado: confirmada
  - texto: "a spec é procurada nas issues citadas nos commits, num caminho dado, em docs/, specs/ ou .scratch/, e por fim perguntada"
    ref: mattpocock-code-review
    localizacao: "passo 2 ('Identify the spec source'), itens 1 a 4"
    resultado: confirmada
  - texto: "o eixo de padrões carrega uma linha de base fixa de maus cheiros, sempre como juízo, e o padrão documentado vence"
    ref: mattpocock-code-review
    localizacao: "passo 3 ('Identify the standards sources'), regras 'The repo overrides' e 'Always a judgement call'"
    resultado: confirmada
  - texto: "os dois relatórios são apresentados sem fundir nem reordenar"
    ref: mattpocock-code-review
    localizacao: "passo 5 ('Aggregate') e seção 'Why two axes'"
    resultado: confirmada
  - texto: "a coleção se instala como plugin pelo marketplace do harness ou como arquivos copiados por um instalador, um dos dois por agente, e o setup roda uma vez por repositório"
    ref: mattpocock-readme
    localizacao: "seção 'Installation (30-second setup)': parágrafo de abertura ('Pick one per agent'), passo 1 e passo 2 ('run it once per repo')"
    resultado: confirmada
  - texto: "o portal fixa o mattpocock/skills na 1.3.1, commit 49dd158"
    ref: portal-referencias
    localizacao: "lista de referências: as do mattpocock/skills trazem a URL no commit 49dd158 e a versão 1.3.1"
    resultado: confirmada
  - texto: "o setup pergunta onde ficam as issues e aceita a opção Other com a descrição do fluxo em um parágrafo"
    ref: mattpocock-setup-matt-pocock-skills
    localizacao: "seção 'Process', passo 2, Section A: Issue tracker (opção Other) e passo 4 ('For other issue trackers')"
    resultado: confirmada
