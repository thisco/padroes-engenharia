conteudo: receita-declarar-slo-alerta-e-runbook
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: o SLI é uma medida quantitativa, bem definida, de um aspecto do nível de serviço entregue, e
    o SLO é um valor-alvo, ou uma faixa de valores, para esse nível, medido por um SLI
  ref: sre-book-slo
  localizacao: seções 'Indicators' e 'Objectives'
  resultado: confirmada
  nota: Afirmação já registrada em OBS-02 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
- texto: é melhor admitir um orçamento de erro, a taxa à qual os SLOs podem ser descumpridos, e acompanhá-lo
    diária ou semanalmente
  ref: sre-book-slo
  localizacao: seção 'Objectives' (erro orçado)
  resultado: confirmada
  nota: O erro orçado de 0,5% para um objetivo de 99,5% é a conta do portal (100 menos o objetivo), e
    não uma afirmação da fonte. Afirmação já registrada em OBS-02 (fonte aberta em 2026-10-06); reaproveitada
    nesta receita, sem reabrir a fonte.
- texto: escolher e publicar SLOs para os usuários define a expectativa de desempenho do serviço
  ref: sre-book-slo
  localizacao: seção 'SLOs Set Expectations'
  resultado: confirmada
  nota: Afirmação já registrada em OBS-02 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
- texto: o livro orienta a monitorar o sintoma (o que está quebrado) e não a causa
  ref: sre-book-monitoring
  localizacao: seção 'Symptoms Versus Causes'
  resultado: confirmada
  nota: Afirmação já registrada em OBS-02 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
- texto: toda página precisa ser acionável, e cada vez que o pager toca a pessoa precisa poder reagir
    com urgência; o alerta deve detectar condição urgente e acionável que afeta usuários, e a pessoa deve
    poder agir em resposta
  ref: sre-book-monitoring
  localizacao: seção 'Tying These Principles Together'
  resultado: confirmada
  nota: Afirmação já registrada em OBS-02 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
- texto: o modelo de dados de log do OpenTelemetry tem Timestamp (hora do evento na origem), SeverityText
    (nível como a origem o escreveu), TraceId e SpanId, Body, Attributes, Resource (origem do log) e EventName
    (tipo do evento)
  ref: opentelemetry-logs-data-model
  localizacao: campos do registro de log (Timestamp, TraceId, SpanId, SeverityText, Body, Attributes,
    Resource, EventName)
  resultado: confirmada
  nota: Afirmação já registrada em OBS-01 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
- texto: o TraceId do registro de log existe para a correlação entre o log e o trace
  ref: opentelemetry-logs-data-model
  localizacao: seção de correlação com traces (TraceId, SpanId, TraceFlags)
  resultado: confirmada
  nota: Afirmação já registrada em OBS-01 (fonte aberta em 2026-10-06); reaproveitada nesta receita, sem
    reabrir a fonte.
