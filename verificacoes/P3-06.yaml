conteudo: P3-06
verificado_em: '2026-10-08'
verificador: agente-curadoria
afirmacoes:
- texto: o servidor MCP oferece recursos (contexto e dados), prompts (mensagens com modelo para a pessoa) e ferramentas
    (funções que o modelo executa)
  ref: mcp-spec
  localizacao: seção 'Key Details', 'Features' (versão 2026-07-28)
  resultado: confirmada
- texto: as ferramentas representam execução arbitrária de código, e as descrições do comportamento delas, como
    as anotações, devem ser tidas como não confiáveis, a menos que venham de um servidor confiável
  ref: mcp-spec
  localizacao: seção 'Security and Trust & Safety', 'Tool Safety'
  resultado: confirmada
- texto: o host precisa obter o consentimento explícito da pessoa antes de invocar qualquer ferramenta
  ref: mcp-spec
  localizacao: seção 'Security and Trust & Safety', 'Tool Safety'
  resultado: confirmada
- texto: o protocolo não impõe os princípios de segurança por si só; quem implementa deve montar fluxos de consentimento
    e autorização
  ref: mcp-spec
  localizacao: seção 'Security and Trust & Safety', 'Implementation Guidelines' ('MCP itself cannot enforce these
    security principles at the protocol level')
  resultado: confirmada
- texto: a lista de conectores (MCPs) permitidos traça a fronteira dos dados, ao definir a quais sistemas o agente
    chega
  ref: anthropic-ciso-agentic-ai
  localizacao: 'seção ''Case study: Claude Cowork'' (''Connector allowlists draw your data boundary'')'
  resultado: confirmada
- texto: o Claude Code guarda os servidores MCP do escopo de projeto num .mcp.json na raiz do projeto, com o objeto mcpServers
  ref: claude-code-mcp
  localizacao: seção do escopo de projeto ('Project-scoped servers ... in a .mcp.json file at your project's root directory'; exemplo com mcpServers)
  resultado: confirmada
- texto: o campo type aceita stdio, http e sse, e streamable-http vale como alias de http
  ref: claude-code-mcp
  localizacao: lista de valores de type, com a nota sobre o alias streamable-http
  resultado: confirmada
- texto: o Gemini CLI lê o objeto mcpServers do settings.json (.gemini/settings.json no projeto), com command, url, httpUrl, args, env, headers e cwd por servidor
  ref: gemini-cli-mcp
  localizacao: seções de configuração do servidor (chave mcpServers) e de caminhos dos arquivos (~/.gemini/settings.json e .gemini/settings.json)
  resultado: confirmada
- texto: o trust do Gemini CLI é um booleano que dispensa as confirmações do servidor
  ref: gemini-cli-mcp
  localizacao: lista de propriedades por servidor ('trust')
  resultado: confirmada
- texto: o Codex configura o servidor MCP na tabela [mcp_servers.<nome>] do config.toml, com command, args, env, url e http_headers, e aceita um .codex/config.toml por projeto
  ref: codex-mcp
  localizacao: seção de configuração do config.toml ('[mcp_servers.<server-name>]') e de configuração por projeto (.codex/config.toml, projetos confiáveis)
  resultado: confirmada
- texto: o Kiro lê o .kiro/settings/mcp.json do workspace, com o objeto mcpServers e command, args, env ou url por servidor
  ref: kiro-mcp
  localizacao: seções de localização dos arquivos e de estrutura (chave raiz mcpServers)
  resultado: confirmada
- texto: o autoApprove do Kiro lista as ferramentas usadas sem pedir confirmação
  ref: kiro-mcp
  localizacao: seção de propriedades de configuração ('autoApprove')
  resultado: confirmada
- texto: o VS Code guarda os servidores do workspace no .vscode/mcp.json, num objeto servers no topo (e não mcpServers)
  ref: vscode-mcp
  localizacao: seção do arquivo de configuração do workspace ('This format defines servers in a top-level servers object')
  resultado: confirmada
