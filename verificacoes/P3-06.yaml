revisao_adversarial:
  revisor: conferente independente, modelo econômico (ADR 0005)
  data: '2026-10-06'
  achados:
  - afirmacao: 'Como aplicar 3 e Prompt: --allowlist central/mcp-allowlist.yml; "uma cópia da allowlist central"
      (P3-06.md:117-125)'
    problema: '[médio] a allowlist usada no CI é uma cópia dentro do mesmo repositório do projeto; quem edita o
      mcp.json edita a cópia e se autoaprova. O texto diz que a lista mora num repositório da engenharia e cita
      "política gerida pela organização", mas não diz que a cópia local é autoaprovável nem pede CODEOWNERS ou obtenção
      por versão fixada fora do alcance do projeto (a P3-04 diz).'
    tratamento: 'Tratado em T10: o Exemplo mostra o job do projeto (exemplos/P3-06/gitlab-ci.yml) clonando a allowlist
      do repositório central (a pasta central/ representa outro repositório, dito no texto) numa tag fixada com
      o commit conferido; o texto diz que a cópia local é autoaprovável e põe o arquivo do job sob CODEOWNERS. Executado
      localmente com um repositório file:// com a tag v1.0.0: clone e conferência passam e o verificador sai 0;
      commit trocado reprova no test. Job não executado num GitLab.'
  - afirmacao: Verificador "todos na allowlist e iguais ao aprovado" (exemplos/P3-06/verificar-allowlist.py)
    problema: '[médio] escapes semânticos reproduzidos em t9-p3-06: env, cwd e headers extras no servidor passam
      (só command, args e url são comparados); config com chave "servers" ou vazia sai 0 com "0 servidores ... todos
      na allowlist" (falha aberta); python3 -m servidor_docs resolve o módulo a partir do diretório do projeto,
      que controla o código; YAML malformado cai em traceback. O texto afirma que ele não prova segurança, mas não
      cita esses casos.'
    tratamento: 'Tratado em T10: o verificador compara também type, env, cwd e headers, reprova campo não previsto,
      config sem mcpServers ou vazia e arquivo ausente ou inválido (saída 1, sem traceback); o python3 -m do projeto
      saiu do Exemplo e virou limite no texto. Reexecutado: antes, depois, config vazia, env/headers declarados,
      JSON quebrado e arquivo inexistente.'
  - afirmacao: 'Exemplo "antes": "npx", ["-y", "servidor-docs-comunitario"] (P3-06.md, Antes e depois)'
    problema: '[médio] npx -y executa pacote de terceiro sem confirmação; o texto o mostra como o servidor reprovado,
      mas não avisa que entrada de allowlist com npx -y e sem versão fixada aprova o que o registro servir no dia
      (o limite "versão nova do mesmo pacote passa" cobre só em parte).'
    tratamento: 'Tratado em T10: a allowlist usa npx -y @exemplo/servidor-docs@1.4.2; o verificador reprova pacote
      de npx, uvx ou pipx sem versão fixada (config e lista); o texto nomeia o risco do pacote de terceiro e deixa
      o hash como limite.'
  - afirmacao: 'Prompt: "ao projeto {nome do projeto}" (P3-06.md:119) (trazido do plano)'
    problema: '[baixo] o preparo não tem pasta com o nome do projeto (o agente trabalhou na raiz); o prompt cita
      "projeto-teste-17" no teste.'
    tratamento: 'Tratado em T10: o prompt diz ''neste repositório'' com um único shell ou refazendo as variáveis,
      e o preparo descreve a pasta central/. Prompt alterado: aguarda novo teste em sessão nova.'
  - afirmacao: Fonte mcp-spec (https://modelcontextprotocol.io/specification/latest)
    problema: '[baixo] confirmada: ferramentas representam execução arbitrária de código, anotações não confiáveis
      salvo servidor confiável, consentimento explícito antes de invocar ferramenta, o protocolo não impõe os princípios.
      A URL é "latest" e a página cita a revisão 2026-07-28, então o conteúdo muda.'
    tratamento: 'Tratado em T10: a referência mcp-spec aponta para /specification/2026-07-28, reaberta com os mesmos
      trechos.'
  - afirmacao: Execução registrada (ae59e5f)
    problema: '[baixo] conferida: commit só com mcp.json (2 inserções, 5 remoções); antes (3 linhas) e depois reproduzidos
      em t9-p3-06.'
    tratamento: Nenhum.
  - afirmacao: 'Como aplicar 1: "publique os critérios de revisão" e revisado_contra (P3-06.md)'
    problema: '[executabilidade] os critérios de revisão publicados não existem nem têm modelo; revisado_contra: criterios-mcp-v1 é inventado.'
    tratamento: 'Tratado na rodada de correção 1 da T5: o passo 1 diz que o portal não publica o documento, que o do Exemplo é fictício, o que ele diz no mínimo, e que revisado_contra é o nome e a tag do documento.'
  - afirmacao: 'Como aplicar 2: "um arquivo só, no formato genérico com mcpServers"'
    problema: '[executabilidade e fonte] impossível com vários harnesses: cada ferramenta lê o seu arquivo, e o do VS Code usa servers.'
    tratamento: 'Tratado: o passo 2 diz qual arquivo cada ferramenta lê, com referência aberta nesta rodada, e que a allowlist central é a única fonte da verdade.'
  - afirmacao: 'Como aplicar 3: python3 scripts/verificar-allowlist.py'
    problema: '[executabilidade] o script publicado está em exemplos/P3-06/, não em scripts/.'
    tratamento: 'Tratado: o passo 3 diz onde o script está e manda copiá-lo para scripts/.'
  - afirmacao: 'Como aplicar 4: a pasta central/'
    problema: '[executabilidade] não diz como central/ chega à máquina de quem roda o agente; sem ela todo servidor dá "sem allowlist". Ligar o gatilho é impossível hoje.'
    tratamento: 'Tratado: o passo 4 diz clone ou submódulo do repositório central no commit fixado, o .gitignore, o efeito da pasta ausente, e repete que o gatilho de harness não liga hoje (F2 e F4). Passos 5 e 6 são executáveis.'
  - afirmacao: 'Formatos de configuração de Gemini, Codex, Kiro, VS Code e Claude Code (Como verificar)'
    problema: '[fonte] afirmados sem [ref:]: os formatos externos não tinham fonte aberta na rodada.'
    tratamento: 'Tratado: referências claude-code-mcp, gemini-cli-mcp, codex-mcp, kiro-mcp e vscode-mcp, abertas em 2026-10-08, com as afirmações registradas acima. serverUrl saiu do texto, porque nenhuma fonte citada o menciona; o verificador continua lendo o campo.'
  - afirmacao: '"mcp.json ... objeto mcpServers" (Como verificar)'
    problema: '[fonte] falso para o VS Code, cujo .vscode/mcp.json usa servers; o verificador não lia essa chave (brecha de pede-aprovacao).'
    tratamento: 'Tratado: o texto e o verificador leem servers em qualquer mcp.json.'
  - afirmacao: '"mudar uma chave que não é de servidor não pede nada" (Como verificar)'
    problema: '[fonte] falso para JSONC: .gemini/settings.json com comentário caía em JSON inválido, saída 2.'
    tratamento: 'Tratado: o verificador aceita comentário e vírgula final; testes com o tema trocado e com servidor novo.'
  - afirmacao: 'Revisão de segurança automática do commit 2980b94 (4 achados) e revisão forte da T5'
    problema: 'identidade do servidor sem args de comando que não é lançador, type sem normalização, servers do VS Code, allowlist editável pelo agente, mcp add pelo shell, pasta vendor acima do projeto e arquivo ilegível em disco.'
    tratamento: 'Tratado na rodada 1: identidade completa (command, args, URLs, type normalizado), servers, JSONC, gatilho em central/**, gatilho de shell para mcp add, terceiros só depois de relativizar, arquivo em disco ilegível como vazio.'
