conteudo: API-02
verificado_em: '2026-10-21'
verificador: agente-curadoria
afirmacoes:
- texto: o Schema Object da especificação usa palavras-chave de JSON Schema, como required
  ref: openapi-spec
  localizacao: seção 4.24 (Schema Object), 4.24.1 (JSON Schema Keywords) (versão 3.2.1)
  resultado: confirmada
- texto: o oasdiff tem uma GitHub Action e uma imagem Docker para pipelines, e a opção --fail-on configura o comportamento de saída conforme os achados
  ref: oasdiff
  localizacao: README, opção --fail-on e integração com CI (GitHub Action, Docker)
  resultado: confirmada
- texto: o job roda só em pipeline de merge request, pela regra $CI_PIPELINE_SOURCE == merge_request_event
  ref: gitlab-mr-pipelines
  localizacao: seções 'When they run' e de configuração (afirmação já registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: CI_MERGE_REQUEST_TARGET_BRANCH_NAME traz a branch de destino da MR e só existe em pipelines de merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: seção de variáveis de pipelines de merge request (já registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso e a variável do .gitlab-ci.yml sobrescreve a configuração do projeto
  ref: gitlab-git-depth
  localizacao: seção 'Limit the number of changes fetched during clone' (já registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: o merge check chama-se Pipelines must succeed
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção sobre exigir pipeline bem-sucedido (já registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: o gitlab-ci-local executa pipelines como shell ou Docker
  ref: gitlab-ci-local-readme
  localizacao: README, instalação e executores (já registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: "o rótulo do marco, 'contrato conferido no CI', resume o que a prática exige e aparece na etapa Revisar da trilha"
  ref: portal-trilha
  localizacao: "página da trilha, etapa Revisar, 'Para sair desta etapa'; corpo da prática, seção 'O que fazer'"
  resultado: confirmada
execucoes:
- tipo: arquivo
  arquivo: exemplos/API-02/gitlab-ci.yml
  comando: npx --yes gitlab-ci-local@4.76.0 --variable CI_PIPELINE_SOURCE=merge_request_event --variable CI_MERGE_REQUEST_TARGET_BRANCH_NAME=main --ignore-predefined-vars CI_PIPELINE_SOURCE contrato
  ambiente: cópia de projeto-teste-17 com remoto --bare local (origin), main publicada com o contrato v1 e a branch da MR com a mudança; gitlab-ci-local 4.76.0, Docker (docker system df antes - imagens 92 (30.9 GB), contêineres 35, volumes 26, cache de build 11.9 GB), imagem python:3.11, PyYAML 6.0.3 por pip; macOS. O job não foi executado num GitLab.
