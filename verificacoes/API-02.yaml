  evidencia: 'quatro estados na mesma branch. (1) remoção do telefone com versão 1.1.0: "API-01: 2 mudança(s) incompatível(is) sem versão major nova (1.0.0 -> 1.1.0)", job FAIL (saída 1). (2) mudança compatível 1.1.0: "API-01: 3 mudança(s), todas compatíveis", "Ran 2 tests ... OK", job PASS. (3) versão 2.0.0 sem ADR commitada: "mas sem ADR", FAIL. (4) versão 2.0.0 com docs/adr/0001-remove-telefone.md commitada: "mudança incompatível com major nova ... e ADR docs/adr/0001-remove-telefone.md", "OK", PASS. O gitlab-ci-local avisa que o remote origin não casa com um endereço do GitLab, o que é esperado com o remoto local.'
