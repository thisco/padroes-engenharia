  achados:
  - afirmacao: "Os templates de segurança do GitLab reprovam a MR com achado"
    problema: "Os dois templates vêm com allow_failure: true; com eles, o achado deixa o job laranja e a MR entra."
    tratamento: "O texto diz que os templates não reprovam, cita o template e a política de aprovação do Ultimate, e o Exemplo usa jobs próprios com o código de saída ligado."
  - afirmacao: "O relatório de SAST aparece na MR só no Ultimate"
    problema: "A página do SAST não diz isso com essas palavras; diz que o Free tem o relatório JSON e que a gestão de vulnerabilidades é do Ultimate."
    tratamento: "O texto passou a afirmar a apresentação na MR só para Container Scanning e, para SAST, só o que a página sustenta."
  - afirmacao: "Prompt, passo 1, com a base no primeiro commit"
    problema: "Num repositório de um commit, a base igual ao HEAD não dá diff e o verificador não aponta a lacuna antiga."
    tratamento: "O passo 1 usa a base de zeros, que avalia o HEAD inteiro."
  - afirmacao: "O depois com python:3.13-alpine passa no Trivy"
    problema: "Com o pip na imagem final, o Trivy acusou 5 HIGH em bibliotecas embutidas no pip (2026-11-03)."
    tratamento: "O depois tira o pip da imagem final, e o Exemplo registra o caso."
