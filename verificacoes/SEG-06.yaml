conteudo: SEG-06
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: "a OWASP põe entre as falhas de cadeia de suprimento não varrer vulnerabilidades com regularidade e rodar software vulnerável, sem suporte ou desatualizado, inclusive o sistema operacional"
  ref: owasp-top10-2025-a03
  localizacao: "seção 'Description' ('you do not scan for vulnerabilities regularly'; 'the software is vulnerable, unsupported, or out of date. This includes the OS')"
  resultado: confirmada
- texto: "o Trivy varre os arquivos dentro da imagem atrás de vulnerabilidade, misconfiguração, segredo e licença, com vulnerabilidade e segredo ligados por padrão"
  ref: trivy-imagem-de-container
  localizacao: "abertura da página ('Trivy scans the files inside container images for'; vulnerabilidade e segredo ligados por padrão, controlados por --scanners)"
  resultado: confirmada
- texto: "o Trivy procura a imagem no Docker Engine local, depois no containerd, no Podman e no registro"
  ref: trivy-imagem-de-container
  localizacao: "seções 'Docker Engine' e 'Container Registry' e a ordem padrão de busca (alterável com --image-src)"
  resultado: confirmada
- texto: "por padrão o Trivy sai com 0 mesmo quando acha problema; --exit-code 1 com --severity faz o job falhar só a partir da severidade escolhida"
  ref: trivy-exit-code
  localizacao: "seção 'Exit Code' ('By default, Trivy exits with code 0 even when security issues are detected'; exemplo --exit-code 1 --severity CRITICAL, 'useful for CI/CD')"
  resultado: confirmada
- texto: "com --fail-on, o Grype sai com 2 quando acha vulnerabilidade na severidade dada ou acima"
  ref: grype-limite-de-falha
  localizacao: "seção 'Set failure thresholds' ('Grype exits with code 2 if it found vulnerabilities at or above the specified severity')"
  resultado: confirmada
- texto: "o Semgrep sai com 0 quando acha problema, a menos que rode com --error, que faz achado virar saída 1; --metrics off desliga o envio de métricas"
  ref: semgrep-cli
  localizacao: "ajuda do semgrep scan (--error: 'Exit 1 if there are findings'; --metrics: 'If off, metrics are disabled altogether and not sent') e seção de códigos de saída"
  resultado: confirmada
- texto: "o job container_scanning do template de Container Scanning vem com allow_failure: true"
  ref: gitlab-container-scanning-template
  localizacao: "definição do job container_scanning (stage: test; allow_failure: true), branch master lida em 2026-11-04"
  resultado: confirmada
- texto: "os analisadores do template de SAST vêm com allow_failure: true"
  ref: gitlab-sast-template
  localizacao: "job oculto .sast-analyzer (extends: sast; allow_failure: true), estendido por semgrep-sast (extends: .sast-analyzer)"
  resultado: confirmada
- texto: "o job com allow_failure: true que falha deixa só um aviso laranja, com o pipeline bem-sucedido"
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' ('an orange warning ... indicates that a job failed'; 'the pipeline is successful and the associated commit is marked as passed with no warnings')"
  resultado: confirmada
- texto: "a política de aprovação de MR do GitLab é do tier Ultimate, exige aprovação a partir do resultado dos scanners e também quando o scanner exigido termina sem relatório"
  ref: gitlab-politicas-de-aprovacao
  localizacao: "abertura ('Tier: Ultimate'; 'Detect results from security and license scanners to enforce approval rules') e a seção de fallback_behavior (job do scanner que termina sem sucesso e sem relatório exige aprovação)"
  resultado: confirmada
- texto: "o merge check Pipelines must succeed exige um pipeline completo e bem-sucedido antes do merge"
  ref: gitlab-pipeline-obrigatorio
  localizacao: "seção sobre exigir pipeline bem-sucedido ('require a complete and successful pipeline before merge'; Settings > Merge requests > Merge checks)"
  resultado: confirmada
- texto: "no GitHub, Require status checks before merging exige que os checks marcados estejam com status successful, skipped ou neutral"
  ref: github-branch-protegida
  localizacao: "seção 'Require status checks before merging' ('Required status checks must have a successful, skipped, or neutral status')"
  resultado: confirmada
- texto: "o job da MR roda com a regra $CI_PIPELINE_SOURCE == \"merge_request_event\""
  ref: gitlab-mr-pipelines
  localizacao: "seção de configuração (if: $CI_PIPELINE_SOURCE == \"merge_request_event\"; roda a cada mudança na branch de origem da MR)"
  resultado: confirmada
- texto: "no GitHub Actions, o workflow constrói a imagem e a trivy-action a varre com image-ref, exit-code '1' e severity"
  ref: trivy-action
  localizacao: "README, exemplo 'Scan CI Pipeline' e tabela de entradas (exit-code, severity, image-ref)"
  resultado: confirmada
- texto: "o template Jobs/Container-Scanning.gitlab-ci.yml usa o Trivy e lê a imagem de CS_IMAGE; o relatório JSON sai como artefato no Free, e o resultado na MR e na aba Security é do Ultimate"
  ref: gitlab-container-scanning
  localizacao: "abertura ('GitLab integrates with the Trivy security scanner'), configuração (template, job container_scanning, variável CS_IMAGE) e tabela de recursos por tier"
  resultado: confirmada
- texto: "o template Jobs/SAST.gitlab-ci.yml tem analisador padrão baseado no Semgrep, no job semgrep-sast, exige o stage test, sai com relatório JSON no Free e a gestão de vulnerabilidades é do Ultimate"
  ref: gitlab-sast
  localizacao: "configuração (include do template; 'must include the test stage'), tabela por tier e seção do analisador ('Uses Semgrep analyzer with GitLab-managed rules'; job semgrep-sast)"
  resultado: confirmada
- texto: "o CodeQL é o motor de análise de código do GitHub, ligado pelo default setup ou por um workflow com a github/codeql-action"
  ref: github-codeql
  localizacao: "abertura e seção sobre as formas de configurar (default setup, advanced setup com a github/codeql-action, CLI em outro CI)"
  resultado: confirmada
