  achados:
  - afirmacao: "Um orçamento de performance é um conjunto de limites impostos às métricas que afetam a performance"
    problema: "[ref] a fonte trata de site no navegador."
    tratamento: "Registrada como parcial, com nota; o texto não atribui à fonte a aplicação a serviço de back-end."
  - afirmacao: "isento: com motivo vale na mesma MR"
    problema: "[desenho] a LGPD-02 lê a isenção do lado da base, para a MR não se isentar sozinha."
    tratamento: "Mantido e dito no Como verificar: o orçamento nasce junto do serviço, e a isenção fica no diff revisado. Pendência do dono."
  - afirmacao: "Job orcamento-de-performance"
    problema: "[executabilidade] não rodou num runner do GitLab, e a forma sem TLS não é a recomendada."
    tratamento: "O texto diz as duas coisas; o script do job rodou em docker:27 com docker:27-dind locais."
  - afirmacao: "A página do web.dev manda estabelecer uma linha de base antes de fixar o orçamento"
    problema: "[ref] a seção 'Establish a baseline' recomenda testar e oferece números padrão; não manda medir o componente antes."
    tratamento: "Texto reescrito: a fonte reserva a etapa e recomenda testar; medir o componente como está é leitura do portal, dita como tal."
  - afirmacao: "A força avisa não impede o merge"
    problema: "[vocabulário] 'impede' fora do vocabulário de força."
    tratamento: "Trocado por 'deixa o merge seguir'."
