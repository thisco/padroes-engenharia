conteudo: QLD-04
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: um orçamento de performance é um conjunto de limites impostos às métricas que afetam a performance
  ref: webdev-orcamento-performance
  localizacao: "seção 'Definition' ('A performance budget is a set of limits imposed on metrics that affect site performance'), aberta em 2026-11-04"
  resultado: parcial
  nota: "A página fala de desempenho de site; aplicar o conceito a serviço de back-end é leitura do portal, e o texto não diz que a fonte trata de serviço."
- texto: a página reserva uma etapa para estabelecer a linha de base, em que recomenda testar o que funciona e oferece números padrão para quem não tem tempo de pesquisar
  ref: webdev-orcamento-performance
  localizacao: "seção 'Establish a baseline' ('try it—research and then test your findings'; números padrão de Time to Interactive e de recursos do caminho crítico), aberta em 2026-11-04"
  resultado: confirmada
  nota: "A fonte não manda medir o próprio componente antes de fixar o orçamento; o texto atribui essa leitura ao portal ('aqui, a linha de base é a medida do componente')."
- texto: para o que passa do limite, a página dá as saídas de otimizar o recurso, retirá-lo ou não acrescentar o novo
  ref: webdev-orcamento-performance
  localizacao: "seção 'Add performance budgets to your build process', aberta em 2026-11-04"
  resultado: confirmada
- texto: o modelo do Compose trata os serviços como os componentes da aplicação
  ref: compose-modelo-aplicacao
  localizacao: "seção 'The Compose application model' (serviços são 'the computing components of an application')"
  resultado: confirmada
- texto: a média de latência esconde a cauda de pedidos lentos, e o percentil mostra a forma da distribuição
  ref: sre-book-slo
  localizacao: "seção 'Aggregation' (aberta na web em 2026-11-04: 'A simple average can obscure these tail latencies')"
  resultado: confirmada
- texto: "os limiares do k6 usam a forma http_req_duration: ['p(95)<200'], e o k6 sai com código diferente de zero quando um limiar falha"
  ref: k6-thresholds
  localizacao: "seção 'Thresholds example for HTTP errors and response duration'"
  resultado: confirmada
- texto: o docker stats mostra a memória do contêiner como uso e limite
  ref: docker-stats
  localizacao: "seção 'Description', coluna MEM USAGE / LIMIT; opção --no-stream"
  resultado: confirmada
- texto: a plataforma não deixa o contêiner passar o limite de deploy.resources.limits
  ref: compose-deploy-resources
  localizacao: "atributo 'resources' ('limits: The platform must prevent the container from allocating more resources')"
  resultado: confirmada
- texto: docker compose up --wait espera os serviços ficarem em execução ou saudáveis
  ref: docker-compose-up
  localizacao: "opção --wait ('Wait for services to be running|healthy. Implies detached mode.'), aberta em 2026-11-04"
  resultado: confirmada
- texto: o Docker-in-Docker no GitLab exige privileged = true, o que desliga os mecanismos de segurança do contêiner; a documentação recomenda TLS quando possível, e a forma sem TLS usa DOCKER_HOST tcp://docker:2375 e DOCKER_TLS_CERTDIR vazio
  ref: gitlab-docker-in-docker
  localizacao: "seções 'Docker-in-Docker with TLS enabled in the Docker executor (recommended)' e 'with TLS disabled'; aviso sobre --docker-privileged"
  resultado: confirmada
- texto: a regra $CI_PIPELINE_SOURCE == "merge_request_event" roda o job em pipeline de merge request
  ref: gitlab-mr-pipelines
  localizacao: "seção de configuração (aberta em 2026-11-04: '- if: $CI_PIPELINE_SOURCE == \"merge_request_event\"')"
  resultado: confirmada
- texto: CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: "tabela de variáveis (aberta em 2026-11-04: 'The base SHA of the merge request diff')"
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' (aberta em 2026-11-04)"
  resultado: confirmada
- texto: com allow_failure true, a falha do job fica como aviso laranja e o pipeline segue bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' (aberta em 2026-11-04: 'an orange warning'; o pipeline é bem-sucedido)"
  resultado: confirmada
