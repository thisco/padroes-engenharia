  resultado: passou
  evidencia: 'branch chore/2026-10-07-adota-scaffold com 5 commits (84d59a4, 1d97392, 246a361, 50bb637, 94b7220), sem coautoria;
    diagnóstico com 3 colisões (.gitignore, pyproject.toml, requirements.txt); rsync sem modificar arquivo existente; constituição
