    união de .gitignore e requirements.txt; preenchimento dos marcadores; simulação do hook com JSON na entrada; verificar_constituicao.py;
    verificar_drift_arquitetura.py; shasum -a 256 -c; ruff check .; npx gitlab-ci-local@4.76.0 com CI_PIPELINE_SOURCE=merge_request_event;
    verificar_pr.py --base origin/main antes e depois do plano
  ambiente: macOS, Python 3.14.8, Docker local, gitlab-ci-local 4.76.0, sdd-scaffold v1.7.1 (clone da tag); repositório de
