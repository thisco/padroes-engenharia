revisao_adversarial:
  revisor: conferência em lote (ADR 0005), sessão independente
  data: '2026-10-07'
  achados:
  - afirmacao: 'passo 2: rm -rf infra e prompt do passo 2'
    problema: '[médio] o diagnóstico não inclui infra e o texto não manda conferir git ls-files infra; com infra/ própria
      o rsync mistura e o rm -rf apaga os arquivos não rastreados dela.'
    tratamento: 'Tratado em 2026-10-07: o texto confere git ls-files infra antes do rm -rf e, se a pasta já era do repositório,
      lista só o que o scaffold trouxe (comm -13). Nota: prompt alterado em 2026-10-07 após a conferência, sem reteste (decisão
      do dono).'
  - afirmacao: 'passo 4: o guia não diz que a MR pode editar o .gitlab-ci.yml e desligar os gates'
    problema: '[médio] CODEOWNERS e proteção de branch só em scripts/; a MR altera o CI que a avalia.'
    tratamento: 'Tratado em 2026-10-07: parágrafo no passo 4 e item em ''O que fica com você'': Pipelines must succeed,
      main protegida e CODEOWNERS em .gitlab-ci.yml e scripts/ (refs gitlab-pipeline-obrigatorio, gitlab-mr-pipelines e
      sdd-scaffold-readme).'
  - afirmacao: 'prompt do guia: download de scaffold e exemplos sem hash'
    problema: '[médio] os prompts baixam com curl -fsSL arquivos de {URL do portal}/exemplos/* sem conferir hash e sem declarar
      o limite.'
    tratamento: 'Tratado em 2026-10-07: o texto declara que os arquivos baixados de `{URL do portal}/exemplos/*` não têm
      hash publicado (só os mecanismos de `/.well-known/mecanismos/` têm) e manda ler o conteúdo antes de rodá-lo fora de
      um portal confiável. Seção ''Limites'' do guia.'
  - afirmacao: 'passo 3 e prompt: o deny do hook contornado por shell'
    problema: '[baixo] o texto diz que a edição é sua, o prompt manda aplicá-la depois do sim e a execução a aplicou por
      shell.'
    tratamento: Pendência pós-v1, anotada no plano da B.5 (T10); sem reteste de prompt (decisão do dono).
