  resultado: passou
  evidencia: 'colisões: .gitignore, pyproject.toml e requirements.txt (59 arquivos no scaffold); rsync deixou 17 entradas
    novas e nenhum arquivo meu modificado; hook devolve ask para AGENTS.md e, depois da mudança, para .gitlab-ci.yml; pipeline
