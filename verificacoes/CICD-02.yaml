# afirmações externas anteriores a 2026-10-08 não mudaram (conferidas em 2026-10-07); novas: CI_MERGE_REQUEST_DIFF_BASE_SHA, GIT_DEPTH (reescrita) e allow_failure
conteudo: CICD-02
verificado_em: '2026-10-21'
verificador: agente-curadoria
afirmacoes:
- texto: a capacidade trabalhar em lotes pequenos é quebrar o trabalho em unidades curtas e independentes, o que reduz o tempo para ter retorno sobre as mudanças e facilita achar e corrigir problemas
  ref: dora-small-batches
  localizacao: página da capacidade, definição e benefícios (aberta na web em 2026-10-07; frase "It reduces the time it takes to get feedback on changes, making it easier to triage and remediate problems")
  resultado: confirmada
- texto: a página recomenda integrar mudanças pequenas e liberáveis ao trunk pelo menos uma vez por dia
  ref: dora-small-batches
  localizacao: seção de implementação ("checking multiple small releasable changes into trunk at least once per day")
  resultado: confirmada
- texto: a IA gera blocos grandes de código com rapidez, mas mudança grande é difícil de revisar, testar e integrar com segurança; lotes pequenos amplificam o impacto positivo da adoção de IA sobre o desempenho do produto
  ref: dora-small-batches
  localizacao: seção sobre IA ("While AI excels at generating large blocks of code quickly, large changes are difficult to review, test, and integrate safely"; "working in small batches amplifies the positive impact of AI adoption on product performance")
  resultado: confirmada
- texto: o DORA trata o lote pequeno em horas e dias de trabalho
  ref: dora-small-batches
  localizacao: definição (funcionalidades concluídas em horas a poucos dias; no máximo uma semana)
  resultado: parcial
  nota: a página fala em horas a alguns dias e no máximo uma semana para uma funcionalidade; o texto diz só "horas e dias de trabalho" e que o teto de MR é uma aproximação do portal.
- texto: com o aumento da adoção de IA houve queda estimada de 1,5% na vazão de entrega e de 7,2% na estabilidade da entrega, e o relatório diz que melhorar o processo de desenvolvimento não melhora a entrega automaticamente sem o básico, como lotes pequenos e testes robustos
  ref: dora-2024
  localizacao: parágrafo sobre o impacto da adoção de IA no desempenho de entrega (aberto na web em 2026-10-07)
  resultado: confirmada
- texto: a regra CI_PIPELINE_SOURCE == merge_request_event roda o job só em pipeline de MR, que roda a cada push de commit novo na branch da MR
  ref: gitlab-mr-pipelines
  localizacao: seção sobre quando rodam (cenários de criação da MR e push na branch de origem) e a regra de condição (aberta na web em 2026-10-07)
  resultado: confirmada
- texto: o merge check Pipelines must succeed é o que faz o pipeline vermelho impedir o merge
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção do merge check (aberta na web em 2026-10-07)
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' (aberta na web em 2026-10-08; frase 'To disable shallow clone and make GitLab CI/CD fetch all branches and tags each time, keep the value empty or set to 0'). A parte 'o diff precisa do commit da base no clone' é do portal, sem referência."
  resultado: confirmada
- texto: um job com allow_failure true que falha mostra um aviso laranja e o pipeline continua bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' (aberta na web em 2026-10-08; 'an orange warning indicates that a job failed. However, the pipeline is successful and the associated commit is marked as passed with no warnings'). Que a MR possa entrar é consequência e não foi exercitada num GitLab real."
  resultado: confirmada
- texto: o gitlab-ci-local executa pipelines como shell ou Docker
  ref: gitlab-ci-local-readme
  localizacao: README, instalação e executores (registrada em receita-ligar-ci-gitlab-travas, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: 'tabela de variáveis de pipelines de merge request (aberta na web em 2026-10-08, de novo na rodada de correção; linha "CI_MERGE_REQUEST_DIFF_BASE_SHA", "The base SHA of the merge request diff")'
  resultado: confirmada
- texto: "o rótulo do marco, 'MR pequena e verde', resume o que a prática exige e aparece na etapa Codar da trilha"
  ref: portal-trilha
  localizacao: "página da trilha, etapa Codar, 'Para sair desta etapa'; corpo da prática, seção 'O que fazer'"
  resultado: confirmada
