revisao_adversarial:
  revisor: autorrevisão da sessão de curadoria; a revisão em sessão independente fica com o controlador da Onda 1
  data: '2026-11-04'
  achados:
  - afirmacao: "O nome que chega ao Prometheus é http_server_request_duration_seconds_bucket"
    problema: "[ref] o README do exporter não dá o nome traduzido."
    tratamento: "O texto diz que o nome foi lido na execução do Exemplo, e a nota da referência registra a versão."
  - afirmacao: "Como aplicar, passo 5: job limiar-de-alerta"
    problema: "[executabilidade] o job não rodou num GitLab."
    tratamento: "O Como verificar diz isso; o comando do job (promtool test rules) foi executado com a mesma imagem."
  - afirmacao: "Sem o perfil, o exportador fica em none (rodada de correção 1 do controlador)"
    problema: "[fato] quem liga o exportador é OTEL_EXPORTADOR, e não o perfil."
    tratamento: "Texto diz que as duas chaves andam juntas e o que acontece em cada combinação; passo 2 e a frase do Exemplo ajustados."
  - afirmacao: "Job limiar-de-alerta em toda MR que mexe na pasta (rodada de correção 1)"
    problema: "[coerência] o job não tinha rules:changes."
    tratamento: "rules com merge_request_event e changes: observabilidade/**/*, citando gitlab-mr-pipelines e gitlab-rules-changes."
