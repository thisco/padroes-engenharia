conteudo: OBS-03
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: a instrumentação sem código em Python instala opentelemetry-distro e o exportador OTLP, roda opentelemetry-bootstrap -a install e sobe a aplicação por opentelemetry-instrument, configurada por variáveis OTEL_*
  ref: otel-python-zero-code
  localizacao: "seções 'Setup' e 'Configuring the agent'"
  resultado: confirmada
- texto: OTEL_SERVICE_NAME define o atributo service.name, e sem ele o valor é unknown_service
  ref: otel-sdk-env-geral
  localizacao: "entrada OTEL_SERVICE_NAME ('Sets the value of the service.name resource attribute'; padrão unknown_service)"
  resultado: confirmada
- texto: OTEL_EXPORTER_OTLP_ENDPOINT é o destino, com porta padrão 4318 em HTTP e 4317 em gRPC
  ref: otel-exporter-otlp-env
  localizacao: "seção 'Endpoint Configuration' (padrões http://localhost:4317 em gRPC e http://localhost:4318 em HTTP)"
  resultado: confirmada
- texto: http.server.request.duration é um histograma em segundos, estável, com http.request.method, http.response.status_code e http.route como atributos
  ref: otel-semconv-http-metricas
  localizacao: "seção 'HTTP server', 'Metric: http.server.request.duration' (Histogram, s, Stable; method obrigatório, status_code e route condicionais)"
  resultado: confirmada
- texto: a instrumentação que ainda emite a convenção antiga passa à estável com OTEL_SEMCONV_STABILITY_OPT_IN=http
  ref: otel-semconv-http-migracao
  localizacao: "valor 'http': emite as convenções estáveis e para de emitir as antigas"
  resultado: confirmada
- texto: no padrão agente, o Collector roda ao lado da aplicação ou no mesmo host, como sidecar
  ref: otel-collector-agente
  localizacao: "definição do padrão ('runs alongside the application or on the same host', sidecar ou DaemonSet)"
  resultado: confirmada
- texto: o Collector tem receivers, processors e exporters, e um componente só vale quando entra num pipeline da seção service
  ref: otel-collector-configuracao
  localizacao: "seções dos componentes e 'Configuring a receiver does not enable it' (vale para processors, exporters e connectors)"
  resultado: confirmada
- texto: no compose, o serviço sem profiles sobe sempre, e o perfil liga um grupo de serviços com --profile ou COMPOSE_PROFILES
  ref: compose-profiles
  localizacao: "'Assigning profiles to services' e 'Start specific profiles'"
  resultado: confirmada
- texto: a variável OTEL_EXPORTADOR liga o exportador, que sem ela fica em none, o valor que não configura exportador nenhum
  ref: otel-sdk-env-spec
  localizacao: "seção 'Exporter Selection' ('none': 'No automatically configured exporter for traces' e '... for metrics'), aberta em 2026-11-04"
  resultado: confirmada
  nota: "A fonte sustenta o significado de none; que OTEL_EXPORTADOR é a variável do compose do Exemplo que escolhe o valor, e o que acontece em cada combinação com o perfil, é leitura do compose do portal (a combinação variável sem perfil não foi executada)."
- texto: a regra $CI_PIPELINE_SOURCE == "merge_request_event" roda o job em pipeline de merge request
  ref: gitlab-mr-pipelines
  localizacao: "seção 'Configure individual jobs': '- if: $CI_PIPELINE_SOURCE == \"merge_request_event\"' (aberta em 2026-11-04)"
  resultado: confirmada
- texto: rules:changes roda o job só quando a MR muda os arquivos listados, comparando com o branch de destino
  ref: gitlab-rules-changes
  localizacao: "seção 'rules:changes': 'Use rules:changes to specify when to add a job to a pipeline by checking for changes to specific files'; em pipeline de merge request, compara com o branch de destino da MR (aberta em 2026-11-04)"
  resultado: confirmada
- texto: a regra de alerta do Prometheus tem expressão, um for que segura o alerta em pending antes de disparar, rótulos e anotações; o Prometheus avalia e o Alertmanager notifica
  ref: prometheus-regras-de-alerta
  localizacao: "'Defining alerting rules' e 'Sending alert notifications'"
  resultado: confirmada
- texto: promtool test rules testa o arquivo de regras com séries sintéticas e o alerta esperado em cada instante
  ref: prometheus-teste-de-regras
  localizacao: "comando 'promtool test rules test.yml'; input_series e alert_rule_test com eval_time, alertname e exp_alerts"
  resultado: confirmada
- texto: a média esconde a cauda lenta, e o percentil mostra a forma da distribuição
  ref: sre-book-slo
  localizacao: "seção 'Aggregation' (aberta na web em 2026-11-03: 'Using percentiles for indicators allows you to consider the shape of the distribution'; a média 'obscures an important detail', a cauda longa)"
  resultado: confirmada
- texto: o exporter prometheus do collector expõe /metrics para o Prometheus raspar e tem estabilidade beta para métricas
  ref: otel-prometheus-exporter
  localizacao: "README: 'Exports data in the Prometheus format, which allows it to be scraped'; endpoint servido em /metrics; métricas em beta"
  resultado: confirmada
