conteudo: receita-ligar-ci-gitlab-travas
verificado_em: '2026-10-06'
verificador: agente-curadoria
afirmacoes:
- texto: os jobs rodam só em pipeline de merge request pela regra $CI_PIPELINE_SOURCE == merge_request_event;
    a configuração precisa dessa regra
  ref: gitlab-mr-pipelines
  localizacao: seções 'When they run' e de configuração
  resultado: confirmada
- texto: CI_MERGE_REQUEST_TARGET_BRANCH_NAME traz a branch de destino da MR e só existe em pipelines de
    merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: seção de variáveis de pipelines de merge request
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso e traz todo o histórico; a variável no .gitlab-ci.yml sobrescreve
    a configuração do projeto
  ref: gitlab-git-depth
  localizacao: seção 'Limit the number of changes fetched during clone'
  resultado: confirmada
- texto: 'entrypoint: [""] troca o entrypoint da imagem'
  ref: gitlab-docker-entrypoint
  localizacao: seção 'Override the entrypoint of an image'
  resultado: confirmada
- texto: o merge check chama-se Pipelines must succeed, em Settings > Merge requests > Merge checks
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção sobre exigir pipeline bem-sucedido
  resultado: confirmada
- texto: pipelines duplicados nascem de job que roda em push e em MR; a saída é workflow ou rules específicas
  ref: gitlab-job-rules
  localizacao: seção 'Avoid duplicate pipelines'
  resultado: confirmada
- texto: o gitleaks detecta por regex e entropia; o subcomando git substitui o detect desde a 8.19.0;
    --redact, --verbose e .gitleaksignore; imagem ghcr.io/gitleaks/gitleaks
  ref: gitleaks-readme
  localizacao: 'README: subcomandos, flags, regras, imagens'
  resultado: confirmada
- texto: o gitlab-ci-local roda pipelines como shell ou docker; --list, --variable e --file; só arquivos
    rastreados entram nos jobs isolados
  ref: gitlab-ci-local-readme
  localizacao: 'README: instalação, executores, opções e limitações'
  resultado: confirmada
- texto: verificar_pr.py bloqueia migration já existente na base que foi alterada e só avisa rollback,
    threat-model e evidência; avisa código sem plano
  ref: sdd-scaffold-verificar-pr
  localizacao: docstring (severidades), regex MIGRATION e função analisar()
  resultado: confirmada
- texto: verificar_constituicao.py reprova a constituição editada no projeto
  ref: sdd-scaffold-readme
