    problema: '[ref] nenhuma referência sustentava; o corpo não dizia que não foi exercitado num GitLab real.'
    tratamento: 'Tratado: nova referência gitlab-allow-failure (página aberta em 2026-10-08: o pipeline é bem-sucedido com o job em aviso laranja); o corpo diz que o allow_failure não foi exercitado num GitLab real.'
  - afirmacao: 'P2-01.md, passo 5: CI_MERGE_REQUEST_DIFF_BASE_SHA'
    problema: '[ref] a fonte sustenta, mas a referência não fora atualizada e a afirmação foi copiada sem reabrir.'
    tratamento: 'Tratado: página aberta em 2026-10-08; localizacao e verificado_em da referência atualizados.'
