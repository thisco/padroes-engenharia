revisao_adversarial:
  revisor: sessao-independente
  data: '2026-10-04'
  achados:
  - afirmacao: pedir um modelo fora da lista da chave é recusado [ref:litellm-virtual-keys]
    problema: a fonte só diz que a chave controla o acesso a modelos; a recusa vem da execução da curadoria
    tratamento: o texto atribui a recusa à execução e a fonte ao controle de acesso
  - afirmacao: a saída 403 real, com versões
    problema: versão e mensagem sem âncora externa
    tratamento: aceito como evidência de execução; as versões estão no texto e no registro
  - afirmacao: mock_response no config.yaml do proxy
    problema: a fonte só mostra a biblioteca
    tratamento: o texto e a nota da referência dizem que o uso no proxy foi confirmado pela execução
  - afirmacao: imagem do gateway [ref:litellm-proxy-docker]
    problema: a página usa a tag latest e outro registro; a tag fixa não tem fonte
    tratamento: o texto diz que o exemplo fixa a v1.104.0
  - afirmacao: a proibição gera adoção paralela, sem telemetria e sem como desligar
    problema: a fonte diz 'generally' e fala de pedidos de IA agêntica; é post de blog do fornecedor
    tratamento: texto com 'em geral' e atribuição ao guia do CISO da Anthropic
  - afirmacao: toda ação acontece sob alguma identidade
    problema: a fonte trata de agentes; a aplicação não é necessariamente um agente
    tratamento: texto restringe a agentes e diz que a chave por aplicação leva o princípio ao gateway
  - afirmacao: ao desativar, peça a revogação da chave
    problema: nada dizia como
    tratamento: o passo diz que o time do gateway bloqueia ou apaga a chave
  - afirmacao: 'litellm.yml: administração com a master key'
    problema: a fonte diz que as requisições autenticam com a master key no caminho sem banco
    tratamento: 'aceito: texto descreve a master key para a administração, e o resto vem das chaves virtuais'
  - afirmacao: 'não executável sem inventar: comandos, master key, espera do gateway, exportar variáveis,
      pip install openai, chamada do modelo restrito'
    problema: o texto não trazia a sequência de comandos nem a espera de prontidão
    tratamento: bloco bash de 10 linhas no Exemplo, com a espera pelo health check, a master key aleatória
      e as duas chamadas do cliente
  - afirmacao: 'não executável sem inventar: não há time do gateway num repositório vazio'
    problema: só o gateway de teste existe
    tratamento: o passo 1 fala do time do gateway e o Exemplo traz o gateway de teste
