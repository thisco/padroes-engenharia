    problema: '[executabilidade] passo 1 (gateway de teste sem dizer onde estão os arquivos), passo 2 (sem .env.example num repositório vazio), passos 3 e 4 (exigem aplicação e catálogo), passo 5 (pacote inexistente localmente, gatilho de harness sem como registrar, stage gates, {URL do portal} sem valor), passo 6 (depende do time do gateway), Exemplo (Docker e pip install).'
