# afirmações externas anteriores a 2026-10-08 (LiteLLM, Azure, Anthropic) não mudaram nesta rodada; as de GitLab foram abertas na web em 2026-10-08, menos Pipelines must succeed (da CICD-02)
conteudo: P2-01
