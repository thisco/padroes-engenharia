verificador: agente-curadoria
afirmacoes:
- texto: 'a chave virtual é a identidade da aplicação no gateway: o gasto é acompanhado por chave, usuário
    e time, e a chave restringe os modelos (modelo fora da lista é recusado); as chaves pedem um banco
    em DATABASE_URL'
  ref: litellm-virtual-keys
  localizacao: seções 'Key Generation', 'Spend Tracking' e 'Model Access Control'
  resultado: confirmada
- texto: o gateway é compatível com o formato da API da OpenAI e qualquer SDK da OpenAI funciona apontando
    para ele; roda com Docker e um config.yaml montado; a administração usa a master key; sem banco o
    orçamento não é aplicado
  ref: litellm-proxy-docker
  localizacao: seções de Docker, autenticação, compatibilidade e nota do banco
  resultado: confirmada
- texto: o mock_response da biblioteca responde sem chamar o provedor
  ref: litellm-mock-response
  localizacao: seção do parâmetro mock_response
  resultado: confirmada
- texto: um AI gateway autentica e autoriza o acesso, monitora e registra as interações e gerencia o uso
    de tokens e as cotas entre várias aplicações
  ref: azure-apim-ai-gateway
  localizacao: seção 'Why use an AI gateway?'
  resultado: confirmada
- texto: proibir sem oferecer caminho gera adoção paralela sem telemetria e sem como desligar; toda ação
    acontece sob alguma identidade e a segurança precisa saber de quem
  ref: anthropic-ciso-agentic-ai
  localizacao: seções sobre adoção paralela e identidade do agente (publicado em 2026-07-17)
  resultado: confirmada
- texto: CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: 'tabela de variáveis de pipelines de merge request (aberta na web em 2026-10-08; linha "CI_MERGE_REQUEST_DIFF_BASE_SHA", "The base SHA of the merge request diff")'
  resultado: confirmada
- texto: o merge check Pipelines must succeed é o que faz o pipeline vermelho impedir o merge
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção do merge check (confirmada na curadoria da CICD-02 em 2026-10-07; não reaberta nesta rodada, e o texto só a usa para a marca do projeto)
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' (aberta na web em 2026-10-08; 'To disable shallow clone and make GitLab CI/CD fetch all branches and tags each time, keep the value empty or set to 0'). A parte 'o git diff com --base precisa do commit da base no clone' é do portal, sem referência."
  resultado: confirmada
- texto: um job com allow_failure true que falha mostra um aviso laranja e o pipeline continua bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' (aberta na web em 2026-10-08; 'an orange warning indicates that a job failed. However, the pipeline is successful and the associated commit is marked as passed with no warnings'). Que a MR possa entrar é consequência e não foi exercitada num GitLab real."
  resultado: confirmada
