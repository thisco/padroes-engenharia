      tratamento: "o texto diz onde a references/ fica, traz o hash do commit e cita a sugestão do README"
    - afirmacao: "cuidado: nunca logar segredo nem dado pessoal"
      problema: "a fonte proíbe PII completa, não todo dado pessoal"
      tratamento: "texto passa a dizer 'dado pessoal completo'"
    - afirmacao: "limites: não existe na versão de junho que o caso usou"
      problema: "o caso instalou a coleção também em maio (742dca5), e a árvore só foi lida em 5e262b2"
