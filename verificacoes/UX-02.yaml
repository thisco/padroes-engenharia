afirmacoes:
- texto: página nova exige protótipo validado por uma pessoa antes da implementação, e revisar protótipo custa minutos enquanto revisar a página implementada custa uma rodada inteira
  ref: estados-de-interface
  localizacao: seção 'Protótipo antes do código'
  resultado: confirmada
- texto: o protótipo é o artefato de aprovação de design
  ref: estados-de-interface
  localizacao: seção 'Protótipo antes do código'
  resultado: confirmada
- texto: o diretório dos protótipos e o design system são parâmetros do steering do projeto, e sem ele se pergunta em vez de inventar
  ref: estados-de-interface
  localizacao: seção 'Parâmetros deste projeto'
  resultado: confirmada
- texto: a regra dos quatro estados vale para cada tela
  ref: estados-de-interface
  localizacao: seção 'A regra'
  resultado: confirmada
- texto: o estado vazio é a primeira tela que muita gente vê, convida a agir, e a tela que só diz 'nenhum resultado' desperdiça o momento de ensinar o sistema
  ref: estados-de-interface
  localizacao: seção 'Estado vazio não é estado de erro'
  resultado: confirmada
- texto: os estados vazio, erro e carregando costumam ser escritos depois, sob pressão, e por isso ficam ruins; vazio tratado como erro faz a pessoa nova achar que quebrou
  ref: estados-de-interface
  localizacao: abertura e tabela 'Erros comuns'
  resultado: confirmada
- texto: o estado vazio serve para dar pistas de aprendizado e caminhos diretos para as tarefas principais
  ref: nngroup-empty-states
  localizacao: diretrizes 'Provide Learning Cues' e 'Provide Direct Pathways for Key Tasks'
  resultado: confirmada
