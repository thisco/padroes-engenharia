  localizacao: seção 'Validação local rígida', itens 1 a 4 e comentário de preenchimento dos comandos
  resultado: confirmada
  nota: O pedido de registrar os comandos exatos está no comentário HTML de preenchimento do template, visível no arquivo cru e conferido no clone local da tag v1.7.1.
- texto: o gitlab-ci-local executa pipelines como shell ou Docker
  ref: gitlab-ci-local-readme
  localizacao: README, instalação e executores (já registrada em API-02, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: sem o merge check Pipelines must succeed, o pipeline vermelho não impede o merge
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção sobre exigir pipeline bem-sucedido (já registrada em API-02, referência aberta em 2026-10-04)
  resultado: confirmada
- texto: ruff check sai com 1 se há violações
  ref: ruff-linter
  localizacao: seção de exit codes ('1 if violations were found')
  resultado: confirmada
- texto: ruff format --check sai com 1 se algum arquivo seria reformatado
  ref: ruff-formatter
  localizacao: seção sobre --check e exit codes
  resultado: confirmada
- texto: o pytest sai com 1 se um teste falha e com 5 se nenhum teste foi coletado
  ref: pytest-exit-codes
  localizacao: lista de exit codes, códigos 1 e 5
  resultado: confirmada
- texto: a opção --cov-fail-under falha a execução se a cobertura total ficar abaixo do mínimo
  ref: pytest-cov-config
  localizacao: opção --cov-fail-under ('Fail if the total coverage is less than MIN')
  resultado: confirmada
