conteudo: ferramenta-sp-brainstorming
verificado_em: 2026-11-06
verificador: agente-curadoria
afirmacoes:
  - texto: "a skill faz uma pergunta por mensagem e devolve o entendimento em trechos curtos"
    ref: superpowers-brainstorming
    localizacao: "seções 'Your First Message' (uma pergunta aberta) e 'The Conversation' (cada mensagem termina com uma pergunta); 'Play It Back' (trechos de 200 a 300 palavras)"
    resultado: confirmada
  - texto: "a skill classifica o trabalho em tarefa rápida, mudança pequena ou projeto com desenho escrito"
    ref: superpowers-brainstorming
    localizacao: "seção 'Size the Work', tabela de três tamanhos"
    resultado: confirmada
  - texto: "nada é construído antes da aprovação da pessoa, salvo quando ela dispensa as perguntas ou pede um spike descartável"
    ref: superpowers-brainstorming
    localizacao: "bloco HARD-GATE: 'Nothing gets built until your human partner approves the full description' e 'Two exceptions' (opt-out das perguntas e spike)"
    resultado: confirmada
  - texto: "o desenho escrito é para um construtor planejar sem voltar à pessoa"
    ref: superpowers-brainstorming
    localizacao: "seção 'The Written Design', primeiro parágrafo"
    resultado: confirmada
  - texto: "o desenho vai para docs/superpowers/specs/ num repositório de software; fora dele a skill pergunta, e a preferência da pessoa vale sobre os dois"
    ref: superpowers-brainstorming
    localizacao: "seção 'The Written Design', item 'Where it goes': 'Otherwise, ask. Your human partner's preferences override both'"
    resultado: confirmada
  - texto: "um subagente confere o desenho antes da entrega"
    ref: superpowers-brainstorming
    localizacao: "seção 'The Written Design', item 'Builder check'"
    resultado: confirmada
  - texto: "aprovado o desenho de um projeto, o único passo seguinte aceito é a writing-plans"
    ref: superpowers-brainstorming
    localizacao: "bloco HARD-GATE, último parágrafo: 'invoke superpowers:writing-plans and no other skill'"
    resultado: confirmada
  - texto: "revisar-spec: um subagente novo lê o desenho escrito como o construtor que vai planejá-lo, e a skill só entrega o documento depois da volta dele"
    ref: superpowers-brainstorming
    localizacao: "seção 'The Written Design', item 'Builder check' (\"Don't hand over the document until the check is back\") e builder-check-prompt.md ao lado dela no mesmo commit (bb92a77)"
    resultado: confirmada
  - texto: "o subagente recebe só o caminho do desenho e devolve só perguntas, ordenadas por importância"
    ref: superpowers-brainstorming
    localizacao: "builder-check-prompt.md (bb92a77): 'Read [DOCUMENT_PATH]', 'Report only the questions', 'Rank them by importance'"
    resultado: confirmada
  - texto: "as perguntas que só a pessoa responde vêm numa única mensagem, e é a única rodada de perguntas que a checagem produz; sem ferramenta de subagente, a skill manda ler o documento como o construtor"
    ref: superpowers-brainstorming
    localizacao: "seção 'The Written Design', item 'Builder check', parágrafos finais (\"That's the only round of questions the check produces\"; \"Without a subagent tool, read the document as that builder yourself\")"
    resultado: confirmada
  - texto: "a skill cita arquivos ao lado dela (builder-check-prompt.md e visual-companion.md)"
    ref: superpowers-brainstorming
    localizacao: "itens 'Builder check' e 'Visual Companion' (último parágrafo)"
    resultado: confirmada
  - texto: "a instalação do plugin superpowers é por harness, e quem usa mais de um instala em cada um"
    ref: superpowers-readme
    localizacao: "README, seção Installation, parágrafo de abertura e subseções por harness"
    resultado: confirmada
  - texto: "o README só documenta a instalação por plugin, não a cópia manual"
    ref: superpowers-readme
    localizacao: "README, seção Installation: só comandos de instalação de plugin, por harness"
    resultado: confirmada
  - texto: "o caso de origem usou o superpowers na série 6.x"
    ref: origem-do-modelo-instalacoes
    localizacao: "tabela de instalações, linha obra/superpowers (2026-05-07, série 6.x no período)"
    resultado: confirmada
  - texto: "o portal fixa o superpowers na 7.0.0, no commit bb92a77"
    ref: portal-referencias
    localizacao: "lista de referências: as do superpowers trazem a URL no commit bb92a77 e a versão 7.0.0"
    resultado: confirmada
  - texto: "o brainstorming foi reescrito na 7.0.0"
    ref: superpowers-release-notes
    localizacao: "v7.0.0 (2026-10-09), parágrafo de abertura e seção Brainstorming"
    resultado: confirmada
  - texto: 'na checagem do construtor, o subagente novo recebe o prompt de builder-check-prompt.md, com o domínio e o caminho do desenho preenchidos, e devolve só perguntas, ordenadas por importância'
    ref: superpowers-builder-check-prompt
    localizacao: 'parágrafo de abertura (''Dispatch a fresh general-purpose subagent with this prompt once the written design exists. Fill in the domain and the document path.'') e bloco do prompt (''Report only the questions'', ''Rank them by importance'')'
    resultado: confirmada
    nota: 'Lido no raw do commit fixado bb92a77 em 2026-11-06. Sustenta também o cuidado do caminho revisar-spec.'
revisao_adversarial:
  revisor: revisor-independente
  data: '2026-11-06'
  achados:
  - afirmacao: 'caminho revisar-spec, cuidado: ''o subagente recebe só o caminho do desenho, sem a conversa,
      e devolve só perguntas, ordenadas por importância'''
    problema: '[baixo] o SKILL.md (a URL da referência superpowers-brainstorming) diz só que o subagente
      é novo e recebe o builder-check-prompt.md; ''só perguntas'' e ''ordenadas por importância'' (''Report
      only the questions'', ''Rank them by importance'') e o preenchimento do caminho do documento estão
      no builder-check-prompt.md, arquivo vizinho no commit bb92a77 que não é referência do portal. A
      fonte confirma, mas a referência da ferramenta não.'
    tratamento: 'corrigido: criada a referência superpowers-builder-check-prompt (skills/brainstorming/builder-check-prompt.md no commit bb92a77), listada em referencias e citada numa frase nova do limites sobre o que o subagente recebe e devolve, que sustenta o cuidado do caminho revisar-spec; afirmação registrada em 2026-11-06.'
