afirmacoes:
  - texto: "nenhuma correção antes da investigação da causa raiz"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'The Iron Law': 'NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST'"
    resultado: confirmada
  - texto: "a primeira fase lê o erro, reproduz, confere o que mudou e junta evidência"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'Phase 1: Root Cause Investigation', itens 1 a 4"
    resultado: confirmada
  - texto: "as quatro fases valem para qualquer problema técnico, inclusive desempenho e build"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'When to Use': test failures, bugs, performance problems, build failures"
    resultado: confirmada
  - texto: "uma hipótese por vez, testada com a menor mudança possível"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'Phase 3: Hypothesis and Testing', itens 1 e 2"
    resultado: confirmada
  - texto: "a correção vem com um teste que falha antes, pela test-driven-development"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'Phase 4: Implementation', item 1 ('Use the superpowers:test-driven-development skill')"
    resultado: confirmada
  - texto: "a conclusão passa pela verification-before-completion"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'Phase 4', item 3 ('Use the superpowers:verification-before-completion skill before claiming success')"
    resultado: confirmada
  - texto: "depois de três correções que falharam a skill manda questionar a arquitetura com a pessoa"
    ref: superpowers-systematic-debugging
    localizacao: "seção 'Phase 4', itens 4 e 5: 'If ≥ 3: STOP and question the architecture' e 'Discuss with your human partner'"
    resultado: confirmada
