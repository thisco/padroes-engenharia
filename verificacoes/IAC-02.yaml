conteudo: IAC-02
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: o modelo de steering pede registrar a proibição de operações manuais fora do CI/CD por perda de rastreabilidade
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Normas de deploy', comentário 'preencher'
  resultado: confirmada
  nota: É um comentário de preenchimento do modelo, citado como orientação.
- texto: o modelo de steering lembra que auto-upgrades da nuvem geram falso-diff no IaC
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Normas de deploy', comentário 'preencher'
  resultado: confirmada
- texto: tofu plan cria um plano de execução que mostra o que a ferramenta pretende mudar
  ref: opentofu-plan
  localizacao: abertura da página
  resultado: confirmada
- texto: com -out o plano é gravado num arquivo que depois pode ser passado ao tofu apply, para automação
  ref: opentofu-plan
  localizacao: opção -out e seção 'Saved Plans'
  resultado: confirmada
- texto: tofu show -json sobre um plano salvo devolve o plano em JSON
  ref: opentofu-show
  localizacao: seção sobre -json com arquivo de plano
  resultado: confirmada
- texto: resource_changes traz as ações previstas em change.actions; ["delete","create"] é substituição
  ref: opentofu-json-format
  localizacao: 'seção ''Plan Representation'': resource_changes e change.actions'
  resultado: confirmada
- texto: a documentação recomenda versionar o .terraform.lock.hcl para discutir mudanças de dependência em revisão de código
  ref: opentofu-dependency-lock
  localizacao: nome do arquivo e recomendação de versionamento
  resultado: confirmada
- texto: "o rótulo do marco, 'plano de infra no PR', resume o que a prática exige e aparece na etapa Revisar da trilha"
  ref: portal-trilha
  localizacao: "página da trilha, etapa Revisar, 'Para sair desta etapa'; corpo da prática, seção 'O que fazer'"
  resultado: confirmada
- texto: $CI_MERGE_REQUEST_DESCRIPTION é a descrição da MR, e com mais de 2700 caracteres só os primeiros 2700 entram na variável
  ref: gitlab-variaveis-predefinidas
  localizacao: "tabela de variáveis, linha CI_MERGE_REQUEST_DESCRIPTION (aberta na web em 2026-11-03; 'The description of the merge request. If the description is more than 2700 characters long, only the first 2700 characters are stored in the variable.')"
  resultado: confirmada
- texto: $CI_MERGE_REQUEST_DIFF_BASE_SHA é o SHA base do diff da MR
  ref: gitlab-variaveis-predefinidas
  localizacao: "tabela de variáveis (aberta na web em 2026-11-03; 'The base SHA of the merge request diff')"
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso
  ref: gitlab-git-depth
  localizacao: "seção 'Limit the number of changes fetched during clone' (aberta na web em 2026-11-03; 'To disable shallow clone ... keep the value empty or set to 0'). 'O verificador precisa do commit da base' é do portal."
  resultado: confirmada
- texto: um job com allow_failure true que falha mostra um aviso laranja e o pipeline continua bem-sucedido
  ref: gitlab-allow-failure
  localizacao: "seção 'allow_failure' (aberta na web em 2026-11-03). Não exercitado num GitLab real."
  resultado: confirmada
- texto: sem mudança necessária, o tofu plan relata que nenhuma ação precisa ser feita
  ref: opentofu-plan
  localizacao: "abertura da página (aberta na web em 2026-11-03; 'will report that no actions need to be taken'); a página não mostra o texto literal"
  resultado: confirmada
  nota: "O texto literal 'No changes. Your infrastructure matches the configuration.' foi observado executando o OpenTofu v1.13.2 num módulo só com um output, depois do apply; antes do apply, o plano mostrou 'Changes to Outputs:' e nenhuma linha 'Plan:'. Por isso o corpo diz 'observado no OpenTofu v1.13.2' e não cita a referência para o texto."
- texto: com recurso esquecido por um bloco removed, a linha de resumo do plano termina em ', N to forget.' depois de 'N to destroy'
  ref: opentofu-resumo-do-plano
  localizacao: "função renderHuman, formatos '%d to add, %d to change, %d to destroy, %d to forget.' e a variante com 'to import' (aberto na web em 2026-11-04, tag v1.13.2)"
  resultado: confirmada
  nota: "Observado também executando o OpenTofu v1.13.2 com um local_file aplicado e depois trocado por removed { lifecycle { destroy = false } }: 'Plan: 0 to add, 0 to change, 0 to destroy, 1 to forget.'"
