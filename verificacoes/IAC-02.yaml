afirmacoes:
- texto: o modelo de steering pede registrar a proibição de operações manuais fora do CI/CD por perda de rastreabilidade
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Normas de deploy', comentário 'preencher'
  resultado: confirmada
  nota: É um comentário de preenchimento do modelo, citado como orientação.
- texto: o modelo de steering lembra que auto-upgrades da nuvem geram falso-diff no IaC
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Normas de deploy', comentário 'preencher'
  resultado: confirmada
- texto: tofu plan cria um plano de execução que mostra o que a ferramenta pretende mudar
  ref: opentofu-plan
  localizacao: abertura da página
  resultado: confirmada
- texto: com -out o plano é gravado num arquivo que depois pode ser passado ao tofu apply, para automação
  ref: opentofu-plan
  localizacao: opção -out e seção 'Saved Plans'
  resultado: confirmada
- texto: tofu show -json sobre um plano salvo devolve o plano em JSON
  ref: opentofu-show
  localizacao: seção sobre -json com arquivo de plano
  resultado: confirmada
- texto: resource_changes traz as ações previstas em change.actions; ["delete","create"] é substituição
  ref: opentofu-json-format
  localizacao: 'seção ''Plan Representation'': resource_changes e change.actions'
  resultado: confirmada
- texto: a documentação recomenda versionar o .terraform.lock.hcl para discutir mudanças de dependência em revisão de código
  ref: opentofu-dependency-lock
  localizacao: nome do arquivo e recomendação de versionamento
  resultado: confirmada
- texto: "o rótulo do marco, 'plano de infra no PR', resume o que a prática exige e aparece na etapa Revisar da trilha"
  ref: portal-trilha
  localizacao: "página da trilha, etapa Revisar, 'Para sair desta etapa'; corpo da prática, seção 'O que fazer'"
  resultado: confirmada
