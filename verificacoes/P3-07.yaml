conteudo: P3-07
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: desligar o agente é uma barreira tosca mas crítica contra dano acidental ou intencional; o usuário
    pode parar uma categoria de ação (revogando uma credencial) ou o agente inteiro; o agente não pode impedir
    nem adulterar o desligamento; o desligamento alcança os subagentes; preparar antes o procedimento de saída
    para o agente parado no meio de uma sequência
  ref: openai-governing-agentic
  localizacao: "seção 4.7 'Interruptibility and Maintaining Control', parágrafos 1 a 3 ('while crude, is a critical backstop'; 'halting a specific category of actions (revoking access to, e.g., financial credentials)'; 'pre-construct a fallback procedure'; 'should not be able to halt or tamper with the user's attempt to shut them down'; 'extend recursively to any other sub-agents')"
  resultado: confirmada
  nota: "o texto da fonte é de recomendação ('could be required', 'could be'); a prática diz 'sugere' e 'recomenda'"
- texto: quanto mais se vê das ações e das entradas de ferramenta, mais fácil notar o erro e intervir, durante
    ou depois; o registro das ações é mais leve que pedir aprovação; a justificativa retroativa pedida ao agente
    tende a ser confabulada
  ref: openai-governing-agentic
  localizacao: "seção 4.4 'Legibility of Agent Activity' (parágrafo 1; 'inputs it receives from tool-use API calls'; 'ledger of actions ... lighter-touch method than requiring human approval'; 'likely to produce confabulated reasoning')"
  resultado: confirmada
- texto: guardar a sessão do agente para monitorar cria risco de privacidade; o disparo automático do
    desligamento quando um indicador de risco cruza um limiar, como o circuit breaker da bolsa
  ref: openai-governing-agentic
  localizacao: "seção 4.5 'Automatic Monitoring', parágrafo 2 ('If sensitive agent session data needs to be retained ... privacy risks'); seção 4.7, parágrafo 4 ('automatically trigger such shutdowns if risk indicators cross a certain threshold ... stock market circuit breakers')"
  resultado: confirmada
  nota: "na fonte, o disparo automático aparece no contexto do operador do sistema ou da infraestrutura; a prática o cita como ideia, e a decisão de quais limiares desligam fica com o time"
- texto: no LiteLLM, POST /key/block desativa a chave e POST /key/unblock a reativa; o gasto em USD da chave
    sai em /key/info
  ref: litellm-virtual-keys
  localizacao: "seções 'Enable/Disable Virtual Keys' (/key/block, resposta 'blocked': true; /key/unblock) e 'Spend Tracking' (gasto em USD, /key/info devolve spend)"
  resultado: confirmada
- texto: span invoke_agent com nome invoke_agent {gen_ai.agent.name}; INTERNAL para agente no mesmo processo,
    com gen_ai.agent.name, gen_ai.conversation.id, gen_ai.usage.input_tokens, gen_ai.usage.output_tokens e
    error.type em erro; o span de cliente acrescenta gen_ai.agent.id e gen_ai.agent.version; status Development
  ref: otel-genai-agent-spans
  localizacao: "topo ('Status: Development'); 'Invoke agent internal span' ('executed within the instrumented process'; 'Span kind SHOULD be INTERNAL'; tabela de atributos) e 'Invoke agent client span' (tabela com gen_ai.agent.id e gen_ai.agent.version); markdown bruto do branch main lido em 2026-11-04"
  resultado: confirmada
- texto: cada ferramenta é um span execute_tool {gen_ai.tool.name}, com gen_ai.tool.name; status Development
  ref: otel-genai-spans
  localizacao: "topo ('Status: Development') e seção 'Execute tool span' (gen_ai.operation.name execute_tool; nome execute_tool {gen_ai.tool.name}; gen_ai.tool.name Required)"
  resultado: confirmada
- texto: latência, tokens, custo por tarefa e taxa de erro acompanhados num banco fixo de tarefas; o
    monitoramento em produção pega a mudança de distribuição e a falha real não prevista; pass^k é a
    probabilidade de as k tentativas darem certo
  ref: anthropic-agent-evals
  localizacao: "trecho sobre métricas ('latency, token usage, cost per task, and error rates can be tracked on a static bank of tasks'), trecho sobre monitoramento ('Production monitoring kicks in post-launch to detect distribution drift and unanticipated real-world failures') e definição de pass^k"
  resultado: confirmada
