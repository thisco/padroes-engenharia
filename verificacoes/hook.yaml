conteudo: hook
verificado_em: '2026-10-04'
verificador: agente-curadoria
afirmacoes:
- texto: No Claude Code, hooks são comandos, endpoints HTTP, chamadas de ferramenta MCP, prompts ou subagentes
    que disparam em pontos do ciclo, como PreToolUse e PostToolUse; no PreToolUse, o código de saída 2
    bloqueia a chamada, e no PostToolUse a ferramenta já rodou e o código 2 só mostra o erro ao modelo.
  ref: claude-code-hooks
  localizacao: conceitos, ciclo de vida, códigos de saída e PreToolUse
  resultado: confirmada
- texto: O CLAUDE.md, por sua vez, é contexto e não configuração imposta; para bloquear uma ação a documentação
    manda usar um hook PreToolUse.
  ref: claude-code-memory
  localizacao: seções 'CLAUDE.md vs auto memory' e 'AGENTS.md'
  resultado: confirmada
- texto: O scaffold instala um hook que protege a governança.
  ref: sdd-scaffold-readme
  localizacao: seções 'O que você recebe', 'Quick start', 'Um corpo de skill, três pontos de montagem'
    e 'O que impede e o que orienta'
  resultado: confirmada
- texto: 'reconferência de 2026-10-05 na tag v1.7.0: continuam no arquivo as afirmações já registradas sobre sdd-scaffold-readme neste conteúdo'
  ref: sdd-scaffold-readme
  localizacao: README na tag v1.7.0 (commit 06a382b938af66230ce6299c1638b0ad055804f0), seções citadas neste registro
  resultado: confirmada
  nota: 'Seções conferidas na tag: ''O que você recebe'', ''Quick start'', ''O que impede e o que orienta'', ''A camada 0, e por que ela é inline'', ''Por que os ponteiros são de quatro linhas'' e ''Pós-geração''. Só a seção dos pontos de montagem mudou de título e de conteúdo (''quatro pontos'', com .agents/skills).'
