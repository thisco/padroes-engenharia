conteudo: P2-08
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: numa solução generativa o prompt é parte central do que se governa, e um bom ambiente de experimentação
    guarda as mudanças de prompt junto com as saídas
  ref: azure-genaiops-mlops
  localizacao: "seção 'Generative AI technical patterns' ('a key aspect of the solution is the prompt provided to the generative model') e subseção 'Experimentation › RAG and prompt engineering' ('A good experimentation framework enables you to store inputs, such as changes to hyperparameters or prompts, along with outputs')"
  resultado: confirmada
- texto: na API da Anthropic todo ID de modelo é um snapshot fixo, e cada modelo tem uma data mínima de aposentadoria
  ref: anthropic-models-overview
  localizacao: "notas da tabela 'Compare models': 'Every Claude model ID is a pinned snapshot' e linha 'Retirement' ('Not sooner than ...')"
  resultado: confirmada
- texto: com structured outputs a resposta segue o schema na maior parte dos casos, com as exceções da recusa
    (stop_reason refusal), do corte por max_tokens e da caixa de valor de enum, que pode vir diferente sem
    erro; sem structured outputs, o modelo pode gerar JSON malformado ou deixar faltar campo obrigatório mesmo
    com o prompt bem escrito; o parâmetro é output_config.format
  ref: anthropic-structured-outputs
  localizacao: "'Why use structured outputs' ('Without structured outputs, Claude can generate malformed JSON responses'; lista 'Even with careful prompting, you might encounter' com 'Missing required fields'), 'Invalid outputs' ('guarantee schema compliance in most cases'; refusal; max_tokens; 'Enum value casing') e 'How it works' (output_config.format)"
  resultado: confirmada
  nota: "reescrita em 2026-11-04: a versão de 2026-11-03 dizia 'sem JSON malformado nem campo obrigatório faltando', sem as exceções"
- texto: no Langfuse cada versão ganha um ID, o rótulo production marca a versão servida por padrão, voltar atrás
    é mover o rótulo, e o rótulo se move pela interface ou pelo SDK (update_prompt com new_labels); o rótulo
    protegido, que só admin e owner mudam, existe no Enterprise, no Pro com o add-on Teams e no self-hosted com a
    Enterprise Edition, e não existe no Hobby nem no Core
  ref: langfuse-prompt-version-control
  localizacao: "seções de versões ('automatically assigned a version ID'), rótulos ('Langfuse will serve the version with the production label'), rollback ('setting the production label to that previous version'), atualização de rótulos pelo SDK (update_prompt, new_labels) e 'Protected prompt labels' (tabela de disponibilidade por plano; 'viewer and member roles cannot modify or delete the label')"
  resultado: confirmada
  nota: "reescrita em 2026-11-04: a versão de 2026-11-03 dizia 'só nos planos Enterprise'. O portão de promoção do passo 5 (quem move, eval verde, conferência) é desenho do portal, sem fonte"
