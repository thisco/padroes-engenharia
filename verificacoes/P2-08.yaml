afirmacoes:
- texto: numa solução generativa o prompt é parte central do que se governa, e um bom ambiente de experimentação
    guarda as mudanças de prompt junto com as saídas
  ref: azure-genaiops-mlops
  localizacao: "seção 'Generative AI technical patterns' ('a key aspect of the solution is the prompt provided to the generative model') e subseção 'Experimentation › RAG and prompt engineering' ('A good experimentation framework enables you to store inputs, such as changes to hyperparameters or prompts, along with outputs')"
  resultado: confirmada
- texto: na API da Anthropic todo ID de modelo é um snapshot fixo, e cada modelo tem uma data mínima de aposentadoria
  ref: anthropic-models-overview
  localizacao: "notas da tabela 'Compare models': 'Every Claude model ID is a pinned snapshot' e linha 'Retirement' ('Not sooner than ...')"
  resultado: confirmada
- texto: com structured outputs a resposta segue o schema dado, sem JSON malformado nem campo obrigatório faltando;
    sem eles, o modelo pode gerar JSON malformado ou faltar campo mesmo com o prompt bem escrito; o parâmetro
    é output_config.format
  ref: anthropic-structured-outputs
  localizacao: "abertura, 'Why use structured outputs' ('Without structured outputs, Claude can generate malformed JSON responses ... Even with careful prompting') e a seção de JSON outputs (output_config.format)"
  resultado: confirmada
- texto: no Langfuse cada versão ganha um ID, o rótulo production marca a versão servida por padrão, voltar atrás
    é mover o rótulo, e rótulos protegidos existem só nos planos Enterprise
  ref: langfuse-prompt-version-control
  localizacao: "seções de versões, rótulos ('Langfuse will serve the version with the production label'), rollback e rótulos protegidos (Enterprise e Self Hosted Enterprise)"
  resultado: confirmada
