    tratamento: "texto de O que fazer e Como aplicar diz 'na maior parte dos casos' e lista as exceções; o Exemplo e o prompt tratam refusal e max_tokens como falha e normalizam a caixa do enum antes de validar"
  - afirmacao: "rótulos protegidos existem só nos planos Enterprise"
    problema: "a página do Langfuse dá Enterprise, Pro com o add-on Teams e self-hosted com Enterprise Edition; Hobby e Core não"
    tratamento: "texto e registro corrigidos com a tabela de planos e os papéis que mudam o rótulo"
  - afirmacao: "o contexto governável tem dono, histórico, versão e o mesmo eval antes de valer em produção"
    problema: "o mecanismo citado é mover o rótulo production, sem MR nem CI; a promessa não tinha desenho operacional, e a divisão em três camadas parecia fato citado"
    tratamento: "passo 5 de Como aplicar descreve o portão (só o job de promoção move production, só com a suíte da P2-05 verde, aprovação gravada e job agendado que compara a versão production com as aprovações); Como verificar ganhou a conferência; o texto diz que as três camadas e o portão são desenho do portal"
  - afirmacao: "execução do prompt registrada como passou"
    problema: "a execução foi manual pelo curador, não em sessão nova de agente"
    tratamento: "o campo harness diz que a execução foi manual e que a sessão nova de agente está pendente com o dono"
