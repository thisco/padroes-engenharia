  resultado: passou
  evidencia: 'passo 1 listou app.py:3 (model=), :4 (max_tokens), :5 (temperature) e :6 (mensagem de sistema); passo 2 criou ia/prompts/classificar.md e ia/config/classificar.yml (versao 1, modelo modelo-a-api do catálogo, parametros); passo 3: o código lê a configuração e registra config_versao e modelo; grep do texto do prompt e do modelo em app.py vazio (saída 1); passo 4: schema SAIDA no código, output_config.format, refusal e max_tokens como falha, enum normalizado com lower() e jsonschema.validate, sem instrução de formato no prompt; passo 5: pytest "3 passed" (inclui a resposta "Pedido" com caixa diferente); commit "refactor: prompt e configuração de modelo versionados (P2-08)".'
