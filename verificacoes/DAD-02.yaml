afirmacoes:
- texto: a estrutura passa a aceitar a versão antiga e a nova ao mesmo tempo (expand); os clientes migram
    para a nova (migrate); a antiga é removida (contract); a maioria das refatorações de banco segue esse
    padrão
  ref: fowler-parallel-change
  localizacao: as três fases e o parágrafo sobre evolutionary database design
  resultado: confirmada
- texto: o período de transição deixa o acesso antigo e o novo coexistirem, e os sistemas dependentes
    migram de forma independente antes de a estrutura antiga sair
  ref: fowler-evodb
  localizacao: seção 'Transition Phase' (o exemplo do renomear tabela com view de compatibilidade)
  resultado: confirmada
- texto: 'o padrão seguro é expandir e contrair: adicionar o novo, migrar os dados, ler do novo e só então
    remover o antigo, em entrega posterior; remover coluna, renomear tabela e alterar tipo incompatível
    são destrutivos e exigem ADR'
  ref: migrations-reversiveis
  localizacao: SKILL.md, seção 'Mudança destrutiva'
  resultado: confirmada
  nota: A skill cita renomear tabela; a DAD-02 aplica o mesmo raciocínio à coluna, e isso é do texto da
    prática, não da skill.
- texto: o rollback é declarado no plano antes da execução e o par upgrade/downgrade é testado em banco
    efêmero; mudança de schema é a mais cara de desfazer porque o estado já mudou quando o problema aparece
  ref: migrations-reversiveis
  localizacao: SKILL.md, seções 'Regras' (4), 'Estratégia de rollback no plano' e a abertura
  resultado: confirmada
- texto: o validate falha quando o checksum local difere do aplicado, quando migration aplicada sumiu
    do disco ou quando há migration resolvida e ainda não aplicada
  ref: flyway-validate
  localizacao: seção 'Description'
  resultado: confirmada
  nota: 'Execução real em 2026-10-06: com a V3 no disco e ainda não aplicada, validate saiu com 1 e ''Detected
    resolved migration not applied to database: 3.'' (no exemplo da receita).'
- texto: migration versionada tem o nome V<versão>__<descrição>.sql e se aplica uma vez, na ordem
  ref: flyway-versionadas
  localizacao: seções de nomenclatura e aplicação em ordem
  resultado: confirmada
- texto: a migration de desfazer do Flyway só existe nas edições pagas; sem ela, a volta é uma migration
    nova
  ref: flyway-undo
  localizacao: 'abertura da página: ''EDITION: TEAMS'''
  resultado: confirmada
  nota: 'A volta por migration nova foi executada: a V4 de reversao/ recriou nome_completo, copiou o dado
    de nome, e validate passou com 4 migrations.'
- texto: o Alembic cria a revisão com upgrade() e downgrade() preenchidos; o downgrade é opcional no tutorial,
    e a skill o pede
  ref: alembic-tutorial
  localizacao: seções de criação do script e de downgrade
  resultado: confirmada
  nota: Mesma afirmação já registrada em DAD-01; reaberta a fonte em 2026-10-06.
