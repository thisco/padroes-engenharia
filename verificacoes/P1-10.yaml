- texto: o desvio entre spec e código é apontado, numa síntese de terceiros, como o principal problema prático do SDD
  ref: field-study-xu
  localizacao: 'seção ''Recurring failure modes (consensus across critical sources)'': ''Spec drift is the #1 practical problem'''
  resultado: confirmada
  nota: Lido por resumo do WebFetch; fonte de credibilidade média-baixa, citada só como indício.
- texto: 'o artigo descreve a reconciliação como passo humano: uma pessoa resolve cada desvio, corrigindo o código ou atualizando o desenho'
  ref: infoq-when-pays-off
  localizacao: seção 'Treating the Specification as a Governance Baseline', pontos de controle 4 e 5 ('A human resolves each drift; fix the code or update the design')
  resultado: confirmada
  nota: Lido por resumo do WebFetch; paráfrase.
- texto: a Fase 8 da skill muda o Status da spec para arquivada (junto do changelog, antes do merge); a Fase 1 redige a spec como delta
  ref: sdd-lifecycle
  localizacao: SKILL.md na tag v3.0.0, Fase 8, passo 1; Fase 1
