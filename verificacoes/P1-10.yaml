revisao_adversarial:
  revisor: conferente independente, modelo econômico, ADR 0005
  data: '2026-10-06'
  achados:
  - afirmacao: 'Como aplicar passo 3 e prompt passo 4: rodar o script e sair ''sem aviso'' antes do commit do passo 5 (P1-10.md:65 e 123)'
    problema: '[médio] trazido do plano (1), reproduzido: o script compara ''git diff base...HEAD'', só vê o commitado. Com o adendo ainda não commitado o aviso continua; com o plano não commitado sai ''Requisitos afetados: 0 spec(s) citada(s), nenhum achado'', um verde falso. A ordem escrita não leva à saída pedida sem inventar o commit.'
    tratamento: 'Tratado em 2026-10-06: o passo 3 manda commitar o plano e a spec com o adendo antes de rodar o script, que compara o commitado, e avisa que, sem o commit do plano, a saída ''0 spec(s) citada(s)'' é um verde que não confere nada. Reexecutado num projeto novo: plano não commitado dá ''0 spec(s)''; commitado sem adendo, AVISO; adendo não commitado, AVISO; tudo commitado, nenhum achado. O passo 4 do prompt (sem aviso antes do commit) não muda, porque foi testado; Como verificar avisa que a saída sem aviso vem após o commit. Pendência: reordenar os passos do prompt e retestá-lo.'
  - afirmacao: 'prompt manda commitar (docs(specs): ...) (P1-10.md)'
    problema: '[baixo] trazido do plano (2): o commit do teste saiu com trailer Co-Authored-By do harness; projetos que proíbem trailer precisam pedir a mensagem sem ele.'
    tratamento: 'Tratado em 2026-10-06 no texto: Como aplicar ganhou o passo 4, que manda pedir a mensagem sem trailer de coautoria quando o projeto o proíbe. O bloco de prompt não mudou; incluir isso no prompt fica como pendência.'
