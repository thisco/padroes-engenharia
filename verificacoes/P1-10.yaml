afirmacoes:
- texto: a spec arquivada é histórico, e não fonte de verdade viva
  ref: sdd-scaffold-sdd-processo
  localizacao: seção 'Specs como deltas arquiváveis' (aberto na web no commit da tag v1.7.0)
  resultado: confirmada
  nota: Que a spec arquivada segue sendo lida por quem entra no projeto vem das consequências da ADR 0003 do portal, não da fonte.
- texto: o desvio entre spec e código é apontado, numa síntese de terceiros, como o principal problema prático do SDD
  ref: field-study-xu
  localizacao: 'seção ''Recurring failure modes (consensus across critical sources)'': ''Spec drift is the #1 practical problem'''
  resultado: confirmada
  nota: Lido por resumo do WebFetch; fonte de credibilidade média-baixa, citada só como indício.
- texto: 'o artigo descreve a reconciliação como passo humano: uma pessoa resolve cada desvio, corrigindo o código ou atualizando o desenho'
  ref: infoq-when-pays-off
  localizacao: seção 'Treating the Specification as a Governance Baseline', pontos de controle 4 e 5 ('A human resolves each drift; fix the code or update the design')
  resultado: confirmada
  nota: Lido por resumo do WebFetch; paráfrase.
- texto: a Fase 8 da skill muda o Status da spec para arquivada (junto do changelog, antes do merge); a Fase 1 redige a spec como delta
  ref: sdd-lifecycle
  localizacao: SKILL.md na tag v3.0.0, Fase 8, passo 1; Fase 1
  resultado: confirmada
- texto: o campo Requisitos afetados no Tier 1 (M5) e o aviso de destilação ficam para a Release 2 (1.8.0) e não existem na 1.7.0
  ref: sdd-scaffold-spec-verificavel
  localizacao: seção 'Não-objetivos', item 'Fica para a Release 2 (1.8.0)'
  resultado: confirmada
  nota: 'Também conferido no clone local: git grep ''Requisitos afetados'' na tag v1.7.0 só acha a menção nessa spec; o MODELO-plano.md da tag não tem a seção.'
- texto: "o rótulo do marco, 'sem drift spec e código', resume o que a prática exige; a trilha lista até seis marcos por etapa e hoje não inclui esta prática na etapa Revisar"
  ref: portal-trilha
  localizacao: "corpo da prática, seção 'O que fazer'; página da trilha, etapa Revisar, 'Para sair desta etapa' (seis marcos e o link 'e mais')"
  resultado: confirmada
- texto: 'a skill egm-drift-report lê cada design doc de uma pasta, procura o código que o documento cita e lista só as divergências, num arquivo AAAA-MM-DD_DRIFT_REPORT.md; a varredura é da pasta inteira contra o código atual, e não do diff da branch'
  ref: egm-drift-report-skill
  localizacao: 'aberto na web no commit 113a3af (raw do GitHub), passos 1 a 4 e Guidance'
  resultado: confirmada
  nota: "Que ela não corrige nada e não escreve adendo à spec é leitura do corpo (só escreve o relatório); a frase 'o diff da branch' é inferência do portal: a skill não menciona diff."
- texto: 'a origem diz que quem escolhe entre atualizar o documento ou o código é a pessoa, e recomenda rodar a skill uma vez por semana, ou numa rotação de manutenção'
  ref: egm-getting-started
  localizacao: "aberto na web no commit 113a3af (raw do GitHub), seção 'Drift Detection'"
  resultado: confirmada
