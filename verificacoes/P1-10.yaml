      (''incorporating this as a weekly ritual is useful''). A rotação não é alternativa à cadência semanal,
      como o ''ou'' sugere.'
    tratamento: 'pendente: escrever ''recomenda rodá-la uma vez por semana, como ritual semanal da rotação
      de manutenção quando o time tem uma''.'
