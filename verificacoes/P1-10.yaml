- texto: o campo Requisitos afetados no Tier 1 (M5) e o aviso de destilação ficam para a Release 2 (1.8.0) e não existem na 1.7.0
  ref: sdd-scaffold-spec-verificavel
  localizacao: seção 'Não-objetivos', item 'Fica para a Release 2 (1.8.0)'
