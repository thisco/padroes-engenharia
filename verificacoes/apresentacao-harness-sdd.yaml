revisao_adversarial:
  revisor: 'conferente independente, modelo econômico (ADR 0005); escopo: conteúdo do deck (R5 e R6); o motor é conferido à parte; veredito: sem achado crítico; R5 e R6 atendidos, com ressalvas médias e baixas'
  data: '2026-10-06'
  achados:
  - afirmacao: 'entradas "SÓ NO DECK" (linhas 202 em diante) com ref apontando fonte sem relação, como claude-code-hooks para o DeepSeek dsh'
    problema: '[médio] a ref sugere sustentação que não existe; só o campo localizacao e a nota dizem "sem sustentação no portal". São 16 entradas com o prefixo "SÓ NO DECK" e 20 com resultado parcial, e não 46.'
    tratamento: 'trocar ref por null (ou por uma ref de origem) nas entradas sem sustentação, e padronizar o prefixo nas 20 parciais'
  - afirmacao: 'index.html:19, autoria do slide 1 trocada por "Quem fez a pesquisa de internos"'
    problema: '[baixo] texto-curinga no lugar do nome; lê estranho na capa'
    tratamento: 'trocar por papel claro (por exemplo "Equipe de arquitetura") ou omitir a linha'
  - afirmacao: 'index.html:369 e roteiro.md:81, "o hook passou a usar caminho absoluto" na revisão de segurança do 1.7.1'
    problema: '[baixo] o caminho absoluto no comando do hook (CLAUDE_PROJECT_DIR) é do 1.7.1, mas o slide acabou de contar que o hook já comparava caminho absoluto; a frase pode ser lida como a mesma correção da 1.6.1'
    tratamento: 'escrever "o comando do hook passou a usar CLAUDE_PROJECT_DIR, e falha fechado"'
  - afirmacao: 'slide 14 (index.html:369), parágrafo novo com style inline'
    problema: '[baixo] o rodapé fica rente à linha divisória em 1280x720 (capturas em .playwright-mcp/t3-slide14.png); não estoura, mas sem folga'
    tratamento: 'aceitar, ou encurtar o parágrafo para duas linhas'
  - afirmacao: 'comparativo-harnesses.html:186, "lê AGENTS.md só sem CLAUDE.md (desde a 2.1.277)" na coluna do Claude Code 2.1.267'
    problema: '[baixo] a coluna é rotulada com a versão inspecionada (2.1.267), anterior à que o texto cita; a tabela de leitura nativa (linha 117) marca AGENTS.md como "não" para o Claude Code sem a qualificação'
    tratamento: 'acrescentar "(2.1.277+)" no rótulo ou na célula; o registro já anota o descompasso'
  - afirmacao: 'comparativo-harnesses.html:194, Codex lê SKILL.md em .agents/skills/'
    problema: '[baixo] coerente com a receita e com ferramentas/codex.yml, mas omite o teste do portal (Codex 0.160.0 listou as skills só com .codex/skills, ferramentas/codex.yml:16); o deck passa a impressão de que só .agents funciona'
    tratamento: 'nenhum obrigatório; opcional citar que .codex/skills também funcionou na observação do portal'
