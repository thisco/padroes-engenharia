revisao_adversarial:
  revisor: conferente independente, modelo econômico, ADR 0005
  data: '2026-10-06'
  achados:
  - afirmacao: referência google-gemini-3-developer-guide sustenta as duas afirmações do Gemini 3 (P1-07.md:36 e seguintes)
    problema: '[médio] a página aberta em 2026-10-06 traz ''Deprecation notice: This page is deprecated and will be removed'' e aponta para o guia do Gemini 3.5 Flash. A seção ''Migration from Gemini 2.5'' confere com o texto (thinking_level high; remover temperature), mas a fonte está em fim de vida.'
    tratamento: 'Tratado em 2026-10-06: a fonte foi trocada pela página vigente, ''What''s new in Gemini 3.5 Flash'' (referência google-gemini-3-5-flash-guia, aberta em 2026-10-06; a referência antiga, depreciada, foi removida). As duas afirmações foram reconferidas nela: migração do Gemini 2.5 (thinking_level medium ou high com prompts mais simples) e remoção de temperature, top_p e top_k.'
  - afirmacao: 'Exemplo: Versão ''gemini-3'' e aplicada ''thinking_level: high'' (exemplos/P1-07/modelo.md:4-9)'
    problema: '[médio] trazido do plano (1): ''gemini-3'' não é id de modelo (o guia usa gemini-3.1-pro-preview e gemini-3-flash-preview). Além disso, o guia diz que sem thinking_level o Gemini 3 já usa high, então ''aplicar'' high é redundante e o exemplo de ''Aplicadas'' não muda comportamento.'
    tratamento: 'Tratado em 2026-10-06: o Exemplo e o texto usam o id real gemini-3.5-flash, e não ''gemini-3''. O thinking_level high deixou de ser redundante: o padrão do 3.5 Flash é medium, e o item aplicado diz isso. O bloco de prompt não mudou. O script foi reexecutado com o novo modelo.md (ERRO sem o arquivo, OK com ele, ERRO com o campo do guia vazio).'
  - afirmacao: 'prompt passo 5: ''não altere nenhum outro arquivo'' (P1-07.md:116)'
    problema: '[baixo] trazido do plano (2): soa contraditório com o passo 2, que manda alterar arquivos do projeto.'
    tratamento: 'Pendência (registrada, não corrigida): o passo 5 do prompt contradiz o passo 2, e o texto do bloco de prompt não pode mudar porque foi testado; reescrever o passo e refazer o teste do prompt fica para a próxima passagem desta prática.'
  - afirmacao: 'Como aplicar passo 4 e prompt: scripts/verificar-modelo.sh'
    problema: '[baixo] o texto não manda salvar o script do Exemplo em scripts/; sem isso o leitor inventa o lugar (o script em si roda: ERRO com 1 sem o registro, OK com 0 com o modelo.md do Exemplo).'
    tratamento: 'Tratado em 2026-10-06: o passo 4 de Como aplicar manda salvar o script do Exemplo em scripts/verificar-modelo.sh; o mesmo foi feito para medir-spec.py (P1-08), checar-requisitos-afetados.py (P1-10) e conferir-arquivamento.py (P1-11).'
