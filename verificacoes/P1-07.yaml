conteudo: P1-07
verificado_em: '2026-10-06'
verificador: agente-curadoria
afirmacoes:
- texto: o guia do Gemini 3.5 Flash sugere, para quem migra do Gemini 2.5 e usava prompt elaborado como cadeia de pensamento para forçar o raciocínio, tentar thinking_level medium ou high com prompts mais simples; o esforço padrão do modelo é medium
  ref: google-gemini-3-5-flash-guia
  localizacao: seção 'Migration checklist', item 'Migrate from Gemini 2.5' ('Simplify prompts'), e seção 'Behavioral changes' (esforço padrão medium) (aberta em 2026-10-06; página atualizada em 2026-09-23 UTC)
  resultado: confirmada
- texto: o guia do Gemini 3.5 Flash recomenda remover temperature, top_p e top_k da configuração, porque o raciocínio do Gemini 3 é otimizado para os valores padrão, e definir uma instrução de sistema com regras explícitas quando se quer determinismo
  ref: google-gemini-3-5-flash-guia
  localizacao: seção 'Sampling parameters (no longer recommended)' e item 'Remove temperature, top_p, top_k' da 'Migration checklist' (aberta em 2026-10-06)
  resultado: confirmada
  nota: A fonte antiga (guia do Gemini 3) está marcada como depreciada e remete a esta página. O texto 'para evitar loops' do guia antigo não consta na página vigente e foi retirado da prática.
- texto: o guia de prompting da Anthropic manda reduzir, na migração, o incentivo a ser mais minucioso ou a usar ferramentas com mais agressividade; os modelos 4.6 são mais proativos e podem reagir demais a instruções que o modelo anterior precisava
  ref: anthropic-prompting-best-practices
  localizacao: seção 'Migration considerations', item 6 (Tune anti-laziness prompting)
  resultado: confirmada
- texto: o guia da OpenAI para o GPT-6 manda remover temperature, top_p e top_logprobs quando o esforço de raciocínio não é none
  ref: openai-using-gpt-6
  localizacao: seção de migração, parâmetros sem suporte com esforço de raciocínio ativo
  resultado: confirmada
  nota: Página lida por resumo do WebFetch; a página não trata de remover instruções de prompt antigo nem de refazer avaliações, e a prática não lhe atribui isso.
