revisao_adversarial:
  revisor: sessao-independente
  data: 2026-10-04
  achados:
  - afirmacao: no GitLab vale a receita de ligar o CI com as travas [ref:sdd-scaffold-readme]
    problema: o README não menciona GitLab; a frase tinha fonte que não a contém, e a receita não estava
      ligada
    tratamento: frase retirada do starter e da ferramenta; a receita entra no starter pelo campo receitas
      na M4
  - afirmacao: nó Proteção dos arquivos de governança lista .codex/requirements.toml com mecanismo bloqueia
    problema: o controle do Codex só fixa git_attribution desligado e não protege caminho de escrita
    tratamento: Codex virou linha própria da planta, sem mecanismo de bloqueio e com nota do que o arquivo
      faz
  - afirmacao: scripts/verificar_drift_arquitetura.py ao lado do mecanismo bloqueia
    problema: o README diz que o drift check é informativo e nunca bloqueia o CI
    tratamento: linha própria na planta, com força avisa e a frase da fonte
  - afirmacao: o prompt prometia a versão fixada para a sdd-lifecycle instalada pelo gerador
    problema: o gerador clona o HEAD do repositório da skill; fixar o commit do scaffold não fixa a skill,
      e sem rede o projeto nasce sem ela
    tratamento: texto do starter e das ferramentas diz que a skill vem na versão vigente no dia; o passo
      4 do prompt avisa da ausência da skill sem rede; a ferramenta sdd-lifecycle traz o commit fixado
  - afirmacao: a sdd-lifecycle é instalada na geração, citando só o README
    problema: o checklist pós-geração do README ainda manda copiar a skill, o que contradiz o Quick start
    tratamento: 'nota na referência: vale o Quick start, que é o que criar_projeto.py faz'
  - afirmacao: o repositório da skill traz o SKILL.md e documentação, sem código nem verificador próprio
    problema: frase sem [ref:] que sustentasse a árvore do repositório
    tratamento: nova referência sdd-lifecycle-repo (árvore do commit fixado) citada na frase
  - afirmacao: os links apontam para ../skills
    problema: 'detalhe técnico sem ref: o README diz só links para o mesmo diretório'
    tratamento: o prompt passou a dizer links para a pasta skills/, como o README
  - afirmacao: 'passos não executáveis sem inventar: destino indefinido no prompt, confirmação em conflito
      com o clone, identidade git, Python 3.11 e rede não ditos no comando, commit da skill fora do scaffold
      sem SHA'
    problema: 'não executável sem inventar: pasta de destino do passo 3 não era pedida, e o comando não
      dizia os pré-requisitos'
    tratamento: o passo 1 pergunta o destino, a confirmação vale antes do passo 3, o comando lista os
      pré-requisitos e a ferramenta sdd-lifecycle traz o SHA
