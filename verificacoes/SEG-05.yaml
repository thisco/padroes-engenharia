  comando: "uv run -q --no-project --with fastapi==0.162.0 --with httpx==0.28.1 --with pytest==9.0.2 python -m pytest -q -p no:cacheprovider test_rotas.py (o test_rotas.py importa o app.py)"
  ambiente: "macOS; uv; Python 3.14 do uv; FastAPI 0.162.0; Starlette 1.10.0; httpx 0.28.1; pytest 9.0.2"
  resultado: passou
  evidencia: "8 passed, 1 skipped (GET /saude é pública e é pulada); /pedidos/1 e POST /pedidos sem credencial: 401 com WWW-Authenticate: Bearer; credencial ausente, errada, Basic, Bearer vazio e Bearer com \\xe9: mesmo status, corpo e WWW-Authenticate; limite 2: [200, 200, 429]. RED antes da troca para bytes: 1 failed (Bearer \\xe9: TypeError comparing strings with non-ASCII characters, 500), 7 passed, 1 skipped."
  data: '2026-11-04'
- tipo: arquivo
  arquivo: exemplos/SEG-05/test_rotas.py
  comando: "o mesmo pytest sobre duas cópias alteradas do app.py: uma com app.add_route('/interno/metricas', ...) e outra com docs_url='/docs' e openapi_url='/openapi.json'"
  ambiente: "o mesmo da linha acima, em diretório temporário"
  resultado: falhou-como-esperado
  evidencia: "com add_route: '2 failed, 8 passed, 1 skipped' (GET e HEAD de /interno/metricas); com a documentação ligada: '6 failed, 8 passed, 1 skipped' (GET e HEAD de /docs, /docs/oauth2-redirect e /openapi.json)."
  data: '2026-11-04'
- tipo: prompt
  prompt: SEG-05-prompt-1
  harness: "execução manual pelo curador, seguindo o prompt passo a passo (não foi sessão nova de agente)"
  ambiente: "repositório Git temporário com o app.py do enunciado (autenticação rota a rota, /pedidos/exportar aberta e declarada antes de /pedidos/{pedido_id}); FastAPI 0.162.0, httpx 0.28.1, pytest 9.0.2"
  resultado: passou
  evidencia: "reexecutado em 2026-11-04 depois da rodada de correção: antes, GET /pedidos/exportar 200 sem credencial e /pedidos/1 401; depois, credencial e limite em FastAPI(dependencies=[...]), compare_digest em bytes, ROTAS_PUBLICAS só com GET /saude, documentação desligada; GET /pedidos/exportar 401; test_rotas.py: '9 passed, 1 skipped'. A execução em sessão nova de agente é pendência do dono."
  data: '2026-11-04'
revisao_adversarial:
  revisor: "revisão independente em lote, 2026-11-04 (controlador da Onda 1), mais a autorrevisão do curador de 2026-11-03"
  data: '2026-11-04'
  achados:
  - afirmacao: "Credencial ausente, malformada, errada ou expirada dá a mesma resposta (O que fazer, item 4; Como aplicar, passo 3)"
    problema: "Important da revisão independente: hmac.compare_digest com str lança TypeError em caractere não ASCII; com FastAPI 0.162.0, 'Authorization: Bearer \\xe9' dava 500, e 'Bearer x' dava 401."
    tratamento: "exemplos/SEG-05/app.py compara em bytes (token.encode() contra esperado.encode()); o teste de resposta única ganhou o caso não ASCII e passou a comparar WWW-Authenticate; RED (1 failed, TypeError) e GREEN (8 passed, 1 skipped) registrados; o passo 3 e o prompt dizem 'em bytes', com [ref:python-hmac]."
  - afirmacao: "Antes: /pedidos/exportar declarada depois de /pedidos/{pedido_id}"
    problema: "Achado da reexecução do prompt: com a ordem do Antes, /pedidos/{pedido_id} casa primeiro e /pedidos/exportar respondia 401, não ficava aberta."
    tratamento: "O Antes e o enunciado do prompt declaram /pedidos/exportar antes, com [ref:fastapi-parametros-de-caminho]; o prompt reexecutado mostra 200 antes e 401 depois."
  - afirmacao: "O teste percorre só APIRoute"
    problema: "A documentação gerada e a rota de add_route não são APIRoute e não passam pelas dependências; o teste não as via (autorrevisão, 2026-11-03)."
    tratamento: "O teste passou a percorrer todas as rotas de app.routes, e a execução registra as duas quebras."
  - afirmacao: "SlowApi: default_limits e middleware"
    problema: "A página inicial não mostra a configuração de limite padrão nem o middleware (autorrevisão, 2026-11-03)."
    tratamento: "O texto diz só o que a página sustenta (biblioteca, alfa, 429 sem rodar a view)."
