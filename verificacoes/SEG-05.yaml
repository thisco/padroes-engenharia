conteudo: SEG-05
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: "a OWASP manda negar o acesso por padrão, validar a permissão em toda requisição, no nível da aplicação e não método a método, e lembra que basta ao atacante achar um caminho"
  ref: owasp-authorization-cheat-sheet
  localizacao: "seções 'Deny by Default' e 'Validate the Permissions on Every Request' ('Remember an attacker only needs to find one way in')"
  resultado: confirmada
- texto: "a OWASP pede teste de unidade e de integração que confira que o acesso é negado por padrão"
  ref: owasp-authorization-cheat-sheet
  localizacao: "seção 'Create Unit and Integration Test Cases for Authorization Logic'"
  resultado: confirmada
- texto: "a checagem feita método a método deixa um caminho de fora, e é esse que o atacante acha"
  ref: owasp-authorization-cheat-sheet
  localizacao: "seção 'Validate the Permissions on Every Request'"
  resultado: confirmada
- texto: "FastAPI(dependencies=[...]) aplica as dependências a todas as rotas da aplicação"
  ref: fastapi-dependencias-globais
  localizacao: "página 'Global Dependencies', parágrafo 'they will be applied to all the path operations in the application'"
  resultado: confirmada
- texto: "APIRouter(dependencies=[...]) executa as dependências em cada requisição de toda rota do roteador, e a documentação cita o uso para exigir autenticação de um grupo inteiro de rotas"
  ref: fastapi-aplicacoes-maiores
  localizacao: "seção do APIRouter ('added to all the path operations in the router and will be executed/solved for each request'; 'to require authentication for a whole group of path operations')"
  resultado: confirmada
- texto: "a OWASP recomenda limitar quantas vezes um cliente chama a API num período, com política mais estrita em endpoints sensíveis e teto para a mesma operação repetida, como conferir um código de uso único"
  ref: owasp-api4-2023
  localizacao: "seção 'How To Prevent', itens de rate limiting e de limite por operação (OTP, recuperação de senha)"
  resultado: confirmada
- texto: "acima do limite, a resposta é 429 Too Many Requests, com Retry-After opcional"
  ref: rfc-6585
  localizacao: "seção 4 ('MAY include a Retry-After header')"
  resultado: confirmada
- texto: "o 401 exige o cabeçalho WWW-Authenticate"
  ref: rfc-9110
  localizacao: "seção 15.5.2 ('The server generating a 401 response MUST send a WWW-Authenticate header field')"
  resultado: confirmada
- texto: "a OWASP manda responder com erro genérico, sem revelar se a conta existe, lembra que um código HTTP diferente também revela, e pede o mesmo caminho de código nos dois casos para o tempo de resposta não denunciar"
  ref: owasp-authentication-cheat-sheet
  localizacao: "seção 'Authentication and Error Messages', subseções 'Authentication Responses' e 'Error Codes and URLs'"
  resultado: confirmada
- texto: "o login que responde de um jeito para e-mail inexistente e de outro para senha errada deixa descobrir quais contas existem"
  ref: owasp-authentication-cheat-sheet
  localizacao: "seção 'Authentication Responses' (enumeração de usuários)"
  resultado: confirmada
- texto: "por padrão o Spring Security exige autenticação em toda requisição; com HttpSecurity, declarar ao menos anyRequest().authenticated(); anyRequest().denyAll() nega o que nenhuma regra casou, e negar por padrão transforma as regras em lista de permissões"
  ref: spring-security-authorize-http-requests
  localizacao: "introdução da página, seção 'Matching By Http Method' e o item 6 do exemplo de 'Authorizing Requests'"
  resultado: confirmada
- texto: "a SlowApi é biblioteca de limite de taxa para Starlette e FastAPI adaptada do flask-limiter, em qualidade alfa, e acima do limite responde 429 sem rodar a view"
  ref: slowapi-docs
  localizacao: "página inicial (descrição, aviso de qualidade alfa e exemplo com @limiter.limit('5/minute'))"
  resultado: confirmada
- texto: "o FastAPI avalia as rotas em ordem, e a rota com parâmetro declarada antes casaria também com o caminho fixo"
  ref: fastapi-parametros-de-caminho
  localizacao: "seção 'Order matters'"
  resultado: confirmada
- texto: "hmac.compare_digest evita o curto-circuito pelo conteúdo; com str, só aceita ASCII"
  ref: python-hmac
  localizacao: "função hmac.compare_digest(a, b) ('either str (ASCII only ...), or a bytes-like object'; 'avoiding content-based short circuiting behaviour')"
  resultado: confirmada
