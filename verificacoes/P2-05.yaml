  - afirmacao: 'gitlab-ci.yml: job evals-modelo-real com EVAL_MODELO: assistente'
    problema: '[médio] o alias "assistente" não existe em nenhum config do Exemplo; quem roda o job real precisa
      inventar a rota do gateway. O texto admite que o job não foi executado.'
    tratamento: 'Tratado em T10: o Exemplo declara o alias do job real: o gitlab-ci.yml comenta que EVAL_MODELO
      é o alias que o gateway real expõe e o config.yaml traz, em comentário, a entrada ''assistente'' a declarar;
      o texto do Como aplicar 7 diz o mesmo. Job evals reexecutado com npx --yes gitlab-ci-local@4.76.0: PASS (5/5,
      taxa 1.00) e, com a regressão, FAIL (3/5, taxa 0.60, saída 1).'
  - afirmacao: 'Suíte: um único teste agrega os 5 casos (trazido do plano) (exemplos/P2-05/test_evals.py)'
    problema: '[baixo] um caso reprovado não aparece como teste próprio no relatório do pytest; só o print por caso
      mostra.'
    tratamento: 'Justificado: registrado como limite no Como verificar (um teste agrega os casos e o reprovado aparece
      na linha FALHOU); parametrizar mudaria a suíte já executada e fica para a revalidação.'
  - afirmacao: 'Mock mode: eval contra mock_response'
    problema: '[baixo] no modo mock o resultado é decidido pela gravação do config.yaml, então o job de PR confere
