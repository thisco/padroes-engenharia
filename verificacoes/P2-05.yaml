  - afirmacao: Fonte anthropic-develop-tests (https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)
    problema: '[baixo] confirmada: critérios específicos e mensuráveis, casos que espelham a tarefa com bordas,
      correção automatizada, "volume over quality".'
    tratamento: Nenhum.
