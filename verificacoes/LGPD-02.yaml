    tratamento: 'Tratado: ponto decimal fora da fronteira dos 11 colados; forma ddddddddd-dd aceita; caminho relativizado contra cwd (fora dele, saída 2) e com / no lugar de barra invertida; Mn e seletores U+E0100-E01EF, U+180B-180D, U+17B4/17B5 removidos; teste do status T em pre-commit e ci. Os limites ganharam ofuscação deliberada, celular de 11 dígitos, decimal e pastas sensíveis a maiúsculas.'
  - afirmacao: 'verificadores/lgpd_02.py: senha com %40 em URL, UTF-16 sem BOM, cp1252, caminho e rótulo colado (re-revisão da rodada 3)'
    problema: '[importante] a rodada 3 trocou %40 por @ antes de tirar a credencial, e a senha codificada (https://user:p%40ss@host, amqp, redis) virou e-mail acusado. [baixo] UTF-16 sem BOM com acento saía como binário; linha antiga em cp1252 com €, aspas curvas ou travessão era lida em Latin-1 e acusada como nova no harness; //, ./, a/../b e link simbólico da raiz no caminho do harness tiravam o arquivo do escopo ou saíam 2; CPF colado ao rótulo (cpf, nº) não era acusado.'
    tratamento: 'Tratado: o userinfo vai até o último @ da autoridade; com NUL e fora do UTF-8, a paridade dominante dos NUL escolhe utf-16-le ou utf-16-be antes de declarar binário; cp1252 antes de Latin-1; o caminho é normalizado (posixpath.normpath), ../ sai 2 e, se o prefixo de cwd não bate, compara-se o caminho real; o rótulo cpf, nº, no ou n° (com ou sem hífen, qualquer caixa) não exclui os 11 colados. Um teste para cada. Os limites ganharam binário com NUL fora do UTF-8 e do UTF-16, Git LFS só no harness, identificador com hífen, <11 dígitos>x, <11 dígitos>.00, domínio não latino e outra codificação (entidade HTML, % duplo).'
  - afirmacao: 'verificadores/lgpd_02.py: UTF-16 sem BOM e credencial em URL (re-revisão da rodada 4)'
    problema: '[importante] a paridade dominante dos NUL bastava para ler como UTF-16 sem BOM: um NUL antes de texto cp1252, ou UTF-8 com byte inválido e um NUL, virava texto ilegível em UTF-16 e saía 0 sem aviso (fail-open silencioso), e o teste de binário usava 3 bytes que não representavam arquivo real. [regressão] o userinfo até o último @ da autoridade engolia o e-mail que vinha depois de uma URL sem / (https://host,<e-mail>,<e-mail>), e o e-mail com %40 como usuário da URL.'
    tratamento: 'Tratado: UTF-16 sem BOM só quando os NUL de uma paridade cobrem ao menos metade das unidades de 16 bits e os da outra não passam de um décimo deles; fora disso é binário, com aviso em stderr. O usuário da URL para no primeiro @ ou :, e só a senha, depois do :, vai até o último @. Testes: NUL antes de cp1252 e UTF-8 inválido com NUL são binários com aviso; o teste de binário voltou a afirmar o aviso com uma tabela de inteiros de 32 bits; os dois e-mails depois de URL sem / e o e-mail como usuário da URL pegam; as senhas com %40, postgresql://app:senha@ e ssh://git@ seguem inocentes. Os limites ganharam o e-mail único colado a uma URL sem /, espaço ou aspas, o link simbólico fora das três pastas (só visto no pre-commit e no ci) e o UTF-16 sem BOM majoritariamente não latino (binário); a frase da credencial em URL passou a dizer que o e-mail na senha não é acusado e o e-mail como usuário é.'
