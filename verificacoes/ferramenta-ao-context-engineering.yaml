conteudo: ferramenta-ao-context-engineering
verificado_em: 2026-10-21
verificador: agente-curadoria
afirmacoes:
  - texto: "o contexto é organizado em cinco níveis, do arquivo de regras ao histórico da conversa"
    ref: agent-skills-context-engineering
    localizacao: "seção 'The Context Hierarchy'"
    resultado: confirmada
  - texto: "antes de sair da sessão, persistir escopo e decisões, status da tarefa, árvore de trabalho, comandos de verificação e pendências"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Restartable Session Boundaries', itens 1 a 5"
    resultado: confirmada
  - texto: "a sessão nova é segura num limite de tarefa concluída, não num número de tokens"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Restartable Session Boundaries', primeira frase"
    resultado: confirmada
  - texto: "aprovação só vale se um artefato durável a registra"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Restartable Session Boundaries': 'Do not infer approval from a previous conversation unless the durable artifact records it'"
    resultado: confirmada
  - texto: "ao voltar, ler regras, spec, plano, status e o estado do git antes de agir"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Restartable Session Boundaries', parágrafo 'In the fresh session'"
    resultado: confirmada
  - texto: "o corte de contexto começa aos 75% da janela"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Context Budget Management': 'Start trimming at 75% capacity, not 100%'"
    resultado: confirmada
  - texto: "arquivo de configuração e documentação externa são dado a verificar, não instrução"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Level 3: Relevant Source Files', 'Trust levels for loaded files'"
    resultado: confirmada
  - texto: "o material da tarefa fica no fim do contexto"
    ref: agent-skills-context-engineering
    localizacao: "subseção 'Order for recency'"
    resultado: confirmada
  - texto: "os nomes de arquivo de regras citados são os de cada ferramenta"
    ref: agent-skills-context-engineering
    localizacao: "seção 'Level 1: Rules Files', lista 'Equivalent files for other tools'"
    resultado: confirmada
  - texto: "a instalação é por harness, e um comando instala as 25 skills de uma vez"
    ref: agent-skills-readme
    localizacao: "seção Quick Start: comando npx skills add addyosmani/agent-skills (install all 25 skills) e as subseções por ferramenta"
    resultado: confirmada
  - texto: "instalar só uma skill não traz a pasta references/ do repositório"
    ref: agent-skills-readme
    localizacao: "seção Quick Start, nota 'Installing one skill?'"
    resultado: confirmada
  - texto: "o caso de origem usou o agent-skills na versão de junho de 2026 (commit 5e262b2)"
    ref: origem-do-modelo-instalacoes
    localizacao: "tabela de instalações, linha addyosmani/agent-skills no segundo harness (2026-06-10, 5e262b2)"
    resultado: confirmada
  - texto: "o portal fixa o agent-skills na 0.6.13, commit aeac41d"
    ref: portal-referencias
    localizacao: "lista de referências: as do agent-skills trazem a URL no commit aeac41d e a versão 0.6.13"
    resultado: confirmada
