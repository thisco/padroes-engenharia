conteudo: QLD-02
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: o protocolo segue reproduzir, hipótese, evidência (log ou teste) e correção, e a correção vem com um teste que falha antes e passa depois; sem ele, o bug não está fechado
  ref: sdd-scaffold-steering-troubleshooting
  localizacao: seção 'Protocolo de debugging sistemático' (página aberta no commit fixado da tag v1.7.1)
  resultado: confirmada
- texto: todo gotcha novo descoberto na investigação entra na memória quente (docs/PROJECT_MEMORY.md) na mesma sessão, antes de encerrar
  ref: sdd-scaffold-steering-troubleshooting
  localizacao: seção 'Protocolo de debugging sistemático', última frase
  resultado: confirmada
- texto: o steering pede, para cada gotcha, o sintoma observável, a causa-raiz e a correção ou precaução
  ref: sdd-scaffold-steering-troubleshooting
  localizacao: comentário de preenchimento da seção 'Gotchas por subsistema'
  resultado: confirmada
  nota: 'A passagem está num comentário HTML do template (preencher), visível no arquivo cru e não na página renderizada; foi conferida no clone local da tag v1.7.1.'
- texto: o steering de qualidade exige a correção de bug com um teste que reproduz o defeito, falha antes e passa depois, com a evidência das duas execuções no plano
  ref: sdd-scaffold-steering-qualidade
  localizacao: seção 'TDD e prove-it', segundo item
  resultado: confirmada
- texto: a entrada da memória quente com mais de cerca de 30 dias, ou reutilizada em nova sessão, é promovida ao steering do domínio, e os gotchas estáveis moram em docs/steering/troubleshooting.md
  ref: sdd-scaffold-project-memory
  localizacao: cabeçalho, bloco 'Ciclo de vida', itens 2 e última linha
  resultado: confirmada
- texto: o pytest sai com 1 quando testes são coletados e rodados e alguns falham, e com 0 quando todos passam
  ref: pytest-exit-codes
  localizacao: lista de exit codes, códigos 0 e 1
  resultado: confirmada
