conteudo: IAC-04
verificado_em: '2026-11-04'
verificador: agente-curadoria
afirmacoes:
- texto: o workspace associa vários estados a uma mesma configuração, e o nome do workspace atual fica disponível como terraform.workspace
  ref: opentofu-workspaces
  localizacao: "abertura ('Some backends support multiple named workspaces, allowing multiple states to be associated with a single configuration') e o trecho da interpolação ${terraform.workspace} (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: tofu workspace select -or-create escolhe o workspace e o cria se ele não existir
  ref: opentofu-workspace-select
  localizacao: "descrição do comando e a opção '-or-create - If the workspace that is being selected does not exist, create it' (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: os workspaces de um diretório usam o mesmo backend e não são mecanismo de isolamento; para implantações com credenciais e controles de acesso separados, a documentação recomenda outra abordagem
  ref: opentofu-workspaces-cli
  localizacao: "trecho sobre quando não usar vários workspaces ('CLI workspaces within a working directory use the same backend, so they are not a suitable isolation mechanism'; 'We recommend using alternative approaches for complex deployments requiring separate credentials and access controls') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: o backend por ambiente é informado no tofu init com -backend-config (arquivo ou chave=valor); credencial vai por variável de ambiente, porque o valor do -backend-config fica gravado na pasta .terraform e no arquivo de plano
  ref: opentofu-backend-configuracao
  localizacao: "trechos sobre configuração parcial ('use the -backend-config=PATH option when running tofu init') e sobre credenciais ('We recommend using environment variables to supply credentials'; 'OpenTofu will include these values in both the .terraform subdirectory and in plan files') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: os valores ficam num arquivo de definição de variáveis passado com -var-file; na ordem de precedência o último valor encontrado vence, e um -var dado depois do -var-file passa por cima do arquivo
  ref: opentofu-variaveis
  localizacao: "seções do arquivo .tfvars e 'Variable Definition Precedence' ('OpenTofu uses the last value it finds, overriding any previous values'; 'Any -var and -var-file options on the command line, in the order they are provided') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o OpenTofu lê variável de ambiente no formato TF_VAR_<nome>
  ref: opentofu-variaveis-de-ambiente
  localizacao: "seção TF_VAR_name ('The environment variables must be in the format TF_VAR_name') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: com plano salvo, o tofu apply não pede confirmação
  ref: opentofu-apply
  localizacao: "trecho do modo com plano salvo ('OpenTofu takes the actions in the saved plan without prompting you for confirmation') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: when manual faz o job só rodar quando alguém o inicia; dentro de rules, o job manual bloqueia o pipeline no estágio dele
  ref: gitlab-jobs-manuais
  localizacao: "trechos sobre job manual ('You can require that a job doesn't run unless a user starts it'; dentro de rules o padrão é allow_failure: false e 'The pipeline stops at the stage where the job is defined') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: o GitLab rastreia o que está implantado em cada ambiente pelos jobs de deploy
  ref: gitlab-environments
  localizacao: "abertura ('Track what code is deployed where') e o histórico ('Deployments show up in this list only after a deployment job has created them') (aberta na web em 2026-11-03). Que o apply feito à mão fica fora do registro é consequência, dita pelo portal."
  resultado: confirmada
- texto: o ambiente protegido deixa só quem tem o privilégio implantar, nos planos Premium e Ultimate
  ref: gitlab-ambientes-protegidos
  localizacao: "abertura ('only people with the appropriate privileges can deploy to it'; Tier: Premium, Ultimate) (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: a aprovação de deploy bloqueia o job até as aprovações
  ref: gitlab-aprovacao-de-deploy
  localizacao: "'Deployments are blocked until all required approvals are given'; 'All jobs deploying to the environment are blocked and wait for approvals before running' (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: CI_COMMIT_SHA é a revisão do commit para a qual o projeto é construído
  ref: gitlab-variaveis-predefinidas
  localizacao: "linha CI_COMMIT_SHA, 'The commit revision the project is built for' (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: o job que referencia um environment só vai ao runner depois que as regras de proteção passam
  ref: github-workflow-syntax
  localizacao: "seção jobs.<job_id>.environment ('All deployment protection rules must pass before a job referencing the environment is sent to a runner') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: uma das regras de proteção é a lista de revisores obrigatórios, com a autoaprovação que pode ser impedida; nos planos Free, Pro e Team, revisor obrigatório só existe em repositório público
  ref: github-environments-deploy
  localizacao: "trechos de revisores obrigatórios ('require a specific person or team to approve workflow jobs that reference the environment'), de impedir a autoaprovação e a nota de disponibilidade ('required reviewers are only available for public repositories') (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: github.sha é o commit que disparou o workflow
  ref: github-contextos
  localizacao: "tabela do contexto github, 'The commit SHA that triggered the workflow' (aberta na web em 2026-11-03)"
  resultado: confirmada
- texto: "o rótulo do marco, 'produção só pelo pipeline', resume o que a prática exige e aparece na etapa Revisar da trilha"
  ref: portal-trilha
  localizacao: "página da trilha gerada (gerar.py), etapa Revisar, 'Para sair desta etapa'; corpo da prática, seção 'O que fazer'"
  resultado: confirmada
- texto: com o arquivo local, cada um precisa ter o estado mais recente antes de rodar; o backend remoto guarda o estado num lugar compartilhado; no pipeline, o arquivo local fica no runner do job que o gravou
  ref: opentofu-estado-remoto
  localizacao: "abertura ('use of a local file makes OpenTofu usage complicated'; 'each user must make sure they always have the latest state data before running OpenTofu'; 'writes the state data to a remote data store, which can then be shared between all members of a team') (aberta na web em 2026-11-04)"
  resultado: parcial
  nota: "a fonte fala de equipe, não de pipeline; que o arquivo local fica no runner do job é consequência, reproduzida pela revisão (workspace inexistente no job de produção, saída 1)."
- texto: nem todo backend tem workspaces; a lista traz S3, GCS e AzureRM, entre outros, e não traz o http
  ref: opentofu-workspaces
  localizacao: "lista 'You can use multiple workspaces with the following backends' (AzureRM, Consul, COS, GCS, Kubernetes, Local, OSS, Postgres, Remote, S3) (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o estado gerenciado pelo GitLab usa o backend http, com um endereço por nome de estado, usuário gitlab-ci-token e senha CI_JOB_TOKEN no CI
  ref: gitlab-estado-terraform
  localizacao: "bloco backend \"http\" num backend.tf; TF_ADDRESS '.../api/v4/projects/${PROJECT_ID}/terraform/state/<nome>' com lock_address, lock_method=POST e unlock_method=DELETE; 'If you are using GitLab CI/CD, this value is gitlab-ci-token' e 'the contents of the ${CI_JOB_TOKEN}' (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o GitLab recomenda passar a configuração do backend por variável de ambiente, e não por -backend-config, que fica gravado no plano
  ref: gitlab-estado-terraform
  localizacao: "'Customizing your OpenTofu environment variables' ('use environment variables instead of the init -backend-config=... approach'; com -backend-config a configuração fica 'Cached in the output of the plan command') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: as variáveis de ambiente do backend http são as TF_HTTP_*
  ref: opentofu-backend-http
  localizacao: "lista de variáveis ('address / TF_HTTP_ADDRESS', 'lock_address / TF_HTTP_LOCK_ADDRESS', 'lock_method / TF_HTTP_LOCK_METHOD', 'username / TF_HTTP_USERNAME', 'password / TF_HTTP_PASSWORD') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o endereço do estado sai de CI_API_V4_URL e CI_PROJECT_ID
  ref: gitlab-variaveis-predefinidas
  localizacao: "linhas CI_API_V4_URL ('The GitLab API v4 root URL') e CI_PROJECT_ID ('The ID of the current project') (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o backend s3 guarda o estado de cada workspace num caminho próprio (env:/<workspace>/<key>), trava com use_lockfile e, para credencial no CI, a documentação recomenda OIDC
  ref: opentofu-backend-s3
  localizacao: "'When using a non-default workspace, the state path will be /workspace_key_prefix/workspace_name/key' (prefixo padrão env:), a trava S3 com use_lockfile=true e a recomendação de OIDC para ambiente de CI (aberta na web em 2026-11-04)"
  resultado: confirmada
- texto: o artefato compartilha dados entre jobs do workflow, e o plano passa ao job de produção por upload-artifact e download-artifact
  ref: github-artefatos
  localizacao: "abertura ('Use artifacts to share data between jobs in a workflow') e o exemplo 'Share data between jobs' (actions/upload-artifact@v4, actions/download-artifact@v5) (aberta na web em 2026-11-04)"
  resultado: confirmada
