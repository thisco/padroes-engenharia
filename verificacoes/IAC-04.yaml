revisao_adversarial:
  revisor: revisão independente em lote, 2026-11-04 (antes dela, autorrevisão do curador em 2026-11-03, cujos achados seguem no fim da lista)
  data: '2026-11-04'
  achados:
  - afirmacao: 'verificadores/iac_04.py, regex CHAVE e parse da isenção'
    problema: '[Important] job do GitLab com dois-pontos no nome (deploy:producao) não era reconhecido: o caso-alvo saía 0; e a isenção .gitlab-ci.yml:deploy:producao saía 2, porque o rpartition cortava no último dois-pontos.'
    tratamento: 'Tratado: CHAVE aceita dois-pontos no nome quando não seguido de espaço ou do fim; a isenção corta no primeiro dois-pontos (o caminho não tem). Cinco testes novos (RED: 3 falhas; GREEN: 60 passaram).'
  - afirmacao: 'IAC-04, Exemplo: gitlab-ci-depois.yml e github-entrega.yml sem backend remoto'
    problema: '[Important] sem backend remoto, tofu workspace select producao falha num runner novo (Workspace "producao" doesn''t exist), e mesmo com -or-create o estado local se perde entre jobs, contra "um estado por ambiente".'
    tratamento: 'Tratado: O que fazer e Como aplicar exigem backend remoto (opentofu-estado-remoto, opentofu-workspaces, gitlab-estado-terraform, opentofu-backend-http, opentofu-backend-s3); o molde GitLab usa o backend http do GitLab com um nome de estado por ambiente e TF_HTTP_*; o do GitHub, backend s3 com workspaces; o texto diz que o provider e o backend locais valem só para o executar.sh.'
  - afirmacao: 'IAC-04, Por ferramenta: github-entrega.yml aplicava produção com apply -auto-approve sem plano salvo'
    problema: '[Minor] diverge do passo 3 e do molde GitLab.'
    tratamento: 'Tratado: job plano-producao com o plano como artefato (github-artefatos) e aplicar-producao aplicando o plano salvo.'
  - afirmacao: 'verificacoes/IAC-04.yaml, afirmação de -var-file e precedência'
    problema: '[Minor] registro parcial com redação antiga, enquanto o corpo já tinha a forma confirmada.'
    tratamento: 'Tratado: afirmação reescrita com a redação do corpo, reaberta na fonte, confirmada.'
  - afirmacao: 'IAC-04, título: "um workspace por ambiente"'
    problema: '[ref] a documentação do OpenTofu diz que workspace não é mecanismo de isolamento e recomenda outra abordagem quando produção exige credencial e controle de acesso separados.'
    tratamento: 'Tratado no corpo: o título da spec foi mantido, e O que fazer e Como aplicar dizem que o workspace serve quando os ambientes compartilham backend e credencial, e que produção com credencial própria usa um backend por ambiente (-backend-config). Decisão do dono: ajustar o título na spec para "um estado por ambiente".'
  - afirmacao: 'IAC-04: "um -var na linha de comando vence o valor do arquivo"'
    problema: '[ref] a precedência põe -var e -var-file no mesmo degrau, na ordem dada.'
    tratamento: 'Tratado: o texto diz que o -var dado depois do -var-file passa por cima do arquivo; confirmada em 2026-11-04.'
  - afirmacao: 'iac_04.py: aceita qualquer when: manual do job'
    problema: '[limite] um job com duas regras, uma manual e outra automática, passa.'
    tratamento: 'Declarado em Como verificar, junto com extends/include não seguidos e produção reconhecida só por palavra.'
