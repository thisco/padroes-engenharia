revisao_adversarial:
  revisor: autorrevisão do curador contra as fontes; a revisão em sessão independente fica com o controlador (o despacho desta frente proíbe subagente)
  data: '2026-11-03'
  achados:
  - afirmacao: 'IAC-04, título: "um workspace por ambiente"'
    problema: '[ref] a documentação do OpenTofu diz que workspace não é mecanismo de isolamento e recomenda outra abordagem quando produção exige credencial e controle de acesso separados.'
    tratamento: 'Tratado no corpo: o título da spec foi mantido, e O que fazer e Como aplicar dizem que o workspace serve quando os ambientes compartilham backend e credencial, e que produção com credencial própria usa um backend por ambiente (-backend-config). Decisão do dono: ajustar o título na spec para "um estado por ambiente".'
  - afirmacao: 'IAC-04: "um -var na linha de comando vence o valor do arquivo"'
    problema: '[ref] a precedência põe -var e -var-file no mesmo degrau, na ordem dada.'
    tratamento: 'Tratado: o texto diz que o -var vem depois dos arquivos; a afirmação ficou parcial com nota.'
  - afirmacao: 'iac_04.py: aceita qualquer when: manual do job'
    problema: '[limite] um job com duas regras, uma manual e outra automática, passa.'
    tratamento: 'Declarado em Como verificar, junto com extends/include não seguidos e produção reconhecida só por palavra.'
