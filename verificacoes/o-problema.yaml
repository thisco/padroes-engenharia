- texto: Tratar só o mínimo necessário de dado pessoal, o que a lei chama de necessidade, e usar migration
    reversível (DAD-01).
  ref: lgpd
  localizacao: art. 5º, I (dado pessoal) e art. 6º, III (necessidade)
