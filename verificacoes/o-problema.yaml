afirmacoes:
- texto: Na pesquisa do DORA de 2024, o aumento da adoção de IA veio acompanhado de uma queda estimada
    na estabilidade e no throughput da entrega.
  ref: dora-2024
  localizacao: parágrafo sobre o impacto da adoção de IA no desempenho de entrega
  resultado: confirmada
- texto: 'Cada sessão nova do agente começa sem memória da anterior, e o que ele não alcança no contexto
    efetivamente não existe: só continua o que foi gravado.'
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: 'Cada sessão nova do agente começa sem memória da anterior, e o que ele não alcança no contexto
    efetivamente não existe: só continua o que foi gravado.'
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: O agente tenta fazer demais de uma vez e deixa funcionalidades incompletas, sem registro do que
    falta.
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: O agente replica os padrões que já existem no repositório, inclusive os irregulares, e isso leva
    ao desvio com o tempo.
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: O agente marca a funcionalidade como pronta sem teste de ponta a ponta, e a falha só aparece
    depois.
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: O agente tentou fazer o aplicativo inteiro de uma vez, esgotou o contexto no meio da implementação
    e deixou funcionalidades incompletas.
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: Uma instância posterior olhava o projeto, via que já havia progresso e declarava o trabalho concluído.
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: Cada sessão começa sem memória da anterior (Anthropic, 11/2025); para o agente, o que ele não
    alcança no contexto efetivamente não existe (OpenAI, 02/2026).
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: Cada sessão começa sem memória da anterior (Anthropic, 11/2025); para o agente, o que ele não
    alcança no contexto efetivamente não existe (OpenAI, 02/2026).
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: O agente tendia a marcar a funcionalidade como completa sem teste adequado, e falhas de ponta
    a ponta escapavam de testes unitários e de chamadas de curl.
  ref: anthropic-effective-harnesses
  localizacao: seções dos desafios (sessões sem memória, tudo de uma vez, vitória prematura, teste) e
    das soluções
  resultado: confirmada
- texto: Agentes tendem a elogiar com confiança o próprio trabalho, mesmo quando a qualidade é medíocre;
    separar quem faz de quem avalia é uma alavanca forte, embora não elimine de imediato essa complacência.
  ref: anthropic-harness-design
  localizacao: seção sobre autoavaliação e a separação entre gerador e avaliador
  resultado: confirmada
- texto: O agente replica os padrões do repositório, inclusive os irregulares, e isso leva ao desvio;
    a equipe da OpenAI gastava as sextas-feiras, 20% da semana, limpando o que chamou de resíduos de IA,
    e isso não escalou.
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: Um manual monolítico apodrece, vira um cemitério de regras obsoletas e é difícil de verificar;
    funcionou tratar o AGENTS.md como um mapa de cerca de 100 linhas, com indicações para fontes mais
    profundas.
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: 'Base: cerca de 400 mil sessões interativas de cerca de 235 mil pessoas, de outubro de 2025 a
    abril de 2026; o sucesso exige um classificador mais um sinal concreto, e o nível de experiência também
    é avaliado por modelo.'
  ref: anthropic-claude-code-expertise
  localizacao: Sucesso por nível de experiência e divisão de decisões entre pessoa e Claude
  resultado: confirmada
- texto: Em sessões típicas, a pessoa toma cerca de 70% das decisões de planejamento (o que fazer) e cerca
    de 20% das de execução (como fazer).
  ref: anthropic-claude-code-expertise
  localizacao: Sucesso por nível de experiência e divisão de decisões entre pessoa e Claude
  resultado: confirmada
- texto: À medida que a adoção de IA aumentou, a estimativa é de queda de 7,2% na estabilidade da entrega
    e de 1,5% no throughput.
  ref: dora-2024
  localizacao: parágrafo sobre o impacto da adoção de IA no desempenho de entrega
  resultado: confirmada
- texto: 'Pacotes alucinados: média de pelo menos 5,2% nos modelos comerciais e de 21,7% nos abertos,
    em 576 mil amostras de código de 16 modelos.'
  ref: usenix-pacotes-alucinados
  localizacao: 'resumo do artigo: percentuais de pacotes alucinados, amostras e modelos'
  resultado: confirmada
- texto: Tempo que uma equipe de agentes gastava, às sextas-feiras, limpando resíduos de IA antes de codificar
    princípios no repositório.
  ref: openai-harness-engineering
  localizacao: seções sobre o repositório como sistema de registro, o AGENTS.md como mapa e a limpeza
    de resíduos de IA
  resultado: confirmada
- texto: Declarar os padrões no steering e isolar o núcleo por portas e adaptadores; revisão contra a
    spec.
  ref: cockburn-hexagonal
  localizacao: intenção e descrição de portas e adaptadores
  resultado: confirmada
- texto: Registrar a decisão num ADR curto, com contexto, decisão, status e consequências; drift check
    entre diagrama, IaC e compose.
  ref: nygard-adr
  localizacao: 'texto principal: definição de ADR e seções Title, Context, Decision, Status e Consequences'
  resultado: confirmada
- texto: Descrever a API num contrato legível por pessoas e máquinas, como o OpenAPI; quebra de contrato
    exige ADR.
  ref: openapi-spec
  localizacao: 'abertura: descrição de interface de API HTTP legível por pessoas e máquinas'
  resultado: confirmada
- texto: Definir os quatro estados de cada tela e validar um protótipo antes do código.
  ref: estados-de-interface
  localizacao: seções 'Os quatro estados de toda interface' e 'Protótipo antes do código'
  resultado: confirmada
- texto: Segredo em commit, entrada sem validação e dependência que não existe e que alguém pode registrar.
  ref: usenix-pacotes-alucinados
  localizacao: 'resumo do artigo: percentuais de pacotes alucinados, amostras e modelos'
  resultado: confirmada
- texto: Threat-model em cinco perguntas e o gitleaks no pipeline.
  ref: sdd-scaffold-readme
  localizacao: seções 'O que você recebe', 'Quick start', 'Um corpo de skill, quatro pontos de montagem'
