conteudo: IAC-03
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: todo plano com mudança de schema ou de deploy declara a estratégia de rollback antes da execução; declarar às vezes revela que ela não existe
  ref: migrations-reversiveis
  localizacao: seção 'Estratégia de rollback no plano'
  resultado: confirmada
- texto: 'as três formas aceitas: downgrade testado em ambiente efêmero (schema), redeploy da imagem anterior pelo mesmo pipeline (deploy) e restore de backup com tempo de restauração conhecido (dado)'
  ref: migrations-reversiveis
  localizacao: tabela da seção 'Estratégia de rollback no plano'
  resultado: confirmada
- texto: mudança de schema é a mais cara de desfazer porque o estado já mudou quando o problema aparece
  ref: migrations-reversiveis
  localizacao: parágrafo de abertura
  resultado: confirmada
- texto: o job normas-do-pr bloqueia edição de migration existente e avisa quando o diff mexe em schema sem plano declarando rollback
  ref: migrations-reversiveis
  localizacao: seção 'Verificação'
  resultado: confirmada
- texto: o modelo de steering pede registrar qual workflow faz o redeploy da imagem anterior, onde ficam os backups e o tempo de restauração conhecido
  ref: sdd-scaffold-infra-devops
  localizacao: seção 'Rollback', comentário 'preencher'
  resultado: confirmada
  nota: É um comentário de preenchimento do modelo.
- texto: o healthcheck é o que define quando o serviço está pronto; depends_on com service_healthy espera por ele
  ref: docker-compose-startup-order
  localizacao: seções 'healthcheck' e 'depends_on condition service_healthy'
  resultado: confirmada
- texto: --wait espera os serviços em execução ou saudáveis e --wait-timeout limita a espera em segundos
  ref: docker-compose-up
  localizacao: opções --wait e --wait-timeout
  resultado: confirmada
