conteudo: SEG-02
verificado_em: '2026-10-07'
verificador: agente-curadoria
afirmacoes:
- texto: segredo nunca é commitado, vive em variável de ambiente em runtime e o scanner roda bloqueante
    no CI; remover o commit não invalida a credencial, e a regra é rotacionar antes de limpar o histórico
  ref: sdd-scaffold-threat-model
  localizacao: seção 'Segredo'
  resultado: confirmada
- texto: o gitleaks git aceita --log-opts (opções do git log, por exemplo um intervalo de commits) e --redact;
    o código de saída é 1 com vazamento ou erro e se troca com --exit-code
  ref: gitleaks-readme
  localizacao: 'README: seções de uso do subcomando git, --log-opts, --redact e exit code'
  resultado: confirmada
- texto: o gitleaks tem hook para o pre-commit (pre-commit install; SKIP=gitleaks git commit pula)
  ref: gitleaks-readme
  localizacao: 'README: seção de pre-commit'
  resultado: confirmada
- texto: há imagens Docker oficiais (zricethezav/gitleaks e ghcr.io/gitleaks/gitleaks) e o .gitleaksignore
    trata falso positivo; a detecção usa regras com regex e entropia
  ref: gitleaks-readme
  localizacao: 'README: seções Docker, .gitleaksignore e configuração de regras'
  resultado: confirmada
- texto: o job roda só em pipeline de merge request, pela regra $CI_PIPELINE_SOURCE == merge_request_event
  ref: gitlab-mr-pipelines
  localizacao: seções 'When they run' e de configuração (afirmação já registrada em API-02, referência
    relida em 2026-10-07)
  resultado: confirmada
- texto: CI_MERGE_REQUEST_TARGET_BRANCH_NAME traz a branch de destino da MR e só existe em pipelines de
    merge request
  ref: gitlab-variaveis-predefinidas
  localizacao: seção de variáveis de pipelines de merge request (já registrada em API-02)
  resultado: confirmada
- texto: GIT_DEPTH 0 desliga o clone raso e a variável do .gitlab-ci.yml sobrescreve a configuração do
    projeto
  ref: gitlab-git-depth
  localizacao: seção 'Limit the number of changes fetched during clone' (já registrada em API-02)
  resultado: confirmada
- texto: o merge check chama-se Pipelines must succeed
  ref: gitlab-pipeline-obrigatorio
  localizacao: seção sobre exigir pipeline bem-sucedido (já registrada em API-02)
  resultado: confirmada
- texto: o gitlab-ci-local executa pipelines como shell ou Docker
  ref: gitlab-ci-local-readme
  localizacao: README, instalação e executores (já registrada em API-02)
  resultado: confirmada
