revisao_adversarial:
  revisor: revisão da T7 (sessão independente, modelo forte) e revisão de segurança automática do commit f7ce022; antes, conferência em lote (ADR 0005)
  data: '2026-10-08'
  achados:
  - afirmacao: 'Como verificar: tamanhos mínimos de github_pat_ (50), GitLab (20) e provedores de modelo (32)'
    problema: '[minor] os tamanhos vinham colados à referência, como se a fonte os desse.'
    tratamento: 'Tratado: cada tamanho que a fonte não dá traz "(mínimo escolhido pelo verificador)", separado da referência.'
  - afirmacao: 'Exemplo óbvio não é acusado'
    problema: '[important] o exemplo de token da documentação do Slack (xoxp-111-222-333-...) era acusado.'
    tratamento: 'Tratado: 111-222-333 e 1234-5678 entram nos marcadores de exemplo, com teste.'
  - afirmacao: 'Escrita fora do projeto não é acusada'
    problema: '[important] só valia no shell; escrever com caminho fora de cwd saía 2 (negar).'
    tratamento: 'Tratado (lição 23): escrita fora da raiz sai 0 nos dois caminhos, com teste (inclusive ~/.npmrc e /tmp).'
  - afirmacao: 'Como aplicar, passo 1 (.env no .gitignore)'
    problema: '[critical] o harness barrava a escrita do segredo no .env ignorado, o caminho que a prática manda seguir.'
    tratamento: 'Tratado: arquivo que o Git ignora (git check-ignore) é inocente no harness e no destino do shell; o git add -f é acusado no pre-commit e no ci, com testes.'
  - afirmacao: 'Os limites'
    problema: '[important] omitiam senha em URL, notebook com aspas duplas escapadas e o credentials da AWS.'
    tratamento: 'Tratado: senha em URL acusada (com as exceções de exemplo); .json e .ipynb lidos também desescapados; credentials e .netrc como configuração; os limites ganham CSV, XML, connection string do .NET, token= em .log, JWT, chave DSA, fixture com prefixo real, renomeação para fora da isenção e o token usado no comando com redirecionamento.'
  - afirmacao: 'django-insecure- e JWT de documentação'
    problema: '[important] eram acusados como senha atribuída.'
    tratamento: 'Tratado: os dois ficam fora da regra de atribuição, com teste, e o texto diz para trocar a chave do Django por variável de ambiente antes de publicar.'
  - afirmacao: 'Como aplicar, passos 2 e 5 (executabilidade)'
    problema: '[important] URL do pacote não dita, stage travas não declarado, safe.directory ausente e gitlab-ci-local sem a variável da base para o job novo.'
    tratamento: 'Tratado: o passo 2 diz o que é <URL do portal> e como copiar o arquivo do repositório; o job tem safe.directory e o texto pede stages:; o passo 5 mostra o comando com CI_MERGE_REQUEST_DIFF_BASE_SHA; o job foi rodado no gitlab-ci-local (shell, sem Docker).'
  - afirmacao: 'Job segredo-no-diff (revisão de segurança: ci-gate-bypass)'
    problema: '[important] o job só rodava em pipeline de MR: push direto na branch padrão passava sem varredura.'
    tratamento: 'Tratado: regra para a branch padrão com base CI_COMMIT_BEFORE_SHA; base de zeros varre todo o HEAD (verificador); base vazia sai 2; sem allow_failure nem || true. Push em outra branch sem MR fica como limite escrito.'
  - afirmacao: 'verificadores/seg_02.py (revisão de segurança: fail-open)'
    problema: '[important] no harness, a isenção vinha do disco: gravar o .seg02-ignorar e depois o segredo passava.'
    tratamento: 'Tratado: no harness, a isenção vem do HEAD quando há repositório Git (do disco só fora dele), com teste. Os demais caminhos de saída 0 sem varrer são binário por extensão (avisa em stderr), arquivo ignorado e fora da raiz (lição 23); não há limite de tamanho nem exceção engolida (erro do git sai 2).'
  - afirmacao: 'verificadores/seg_02.py (revisão de segurança: incomplete-scan)'
    problema: '[minor] arquivos sem extensão de configuração (credentials, .netrc) não tinham a regra sem aspas; submódulo, link simbólico e arquivo apagado não são lidos.'
    tratamento: 'Tratado: credentials e .netrc entram; os formatos com prefixo e a chave PEM valem em qualquer arquivo (id_rsa, Dockerfile, .npmrc, .tfvars, .env.local já eram lidos). Submódulo, link simbólico e arquivo apagado ficam em Os limites.'
  - afirmacao: exemplos/SEG-02/plantar-segredo.sh escreve app/config.py
    problema: '[baixo] sobrescrevia o arquivo sem aviso se o diretório fosse um projeto real.'
    tratamento: 'Tratado: aviso no cabeçalho e o script se recusa (saída 1) se app/config.py já existir;
      rodado duas vezes, a segunda recusa.'
  - afirmacao: imagem zricethezav/gitleaks referenciada por tag (pendência herdada da B.4)
    problema: '[baixo] a imagem do job era citada só pela tag v8.30.1, que pode ser movida no registro.'
    tratamento: 'Tratado em 2026-10-07: o job do Exemplo cita v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f (índice multiplataforma, de docker buildx imagetools inspect; igual ao RepoDigest da imagem baixada). Job rodado de novo com o gitlab-ci-local 4.76.0 nos dois estados, em cópia do preparo: FAIL com aws-access-token em app/config.py e PASS com config-depois.py. O .gitlab-ci.yml da raiz do portal e seu teste (tests/unidade/test_ci.py) seguem por tag: são da T1.'
