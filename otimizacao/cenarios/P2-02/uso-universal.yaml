id: P2-02-uso-universal
pratica: P2-02
prompt: P2-02-prompt-1
conjunto: validacao
projeto_base: projeto-teste-17
insumos:
  - [exemplos/P2-02/verificar-classificacao.py, scripts/verificar-classificacao.py]
preparacao:
  - mkdir -p docs/specs
  - |-
    printf '# Spec: resumo de atas\n\nUm assistente interno que resume atas de reunião para a própria equipe. Não toma decisão sobre pessoas.\n' > docs/specs/2026-10-07-resumo-atas.md
  - git add -A && git commit -qm "spec"
variaveis:
  caminho da spec: docs/specs/2026-10-07-resumo-atas.md
  nome de quem classifica: Ana Souza
  AAAA-MM-DD: "2026-10-07"
  quem revisa: analista habilitado
  texto do aviso ao usuário: "Este conteúdo foi produzido com apoio de IA e revisado por uma pessoa."
verificacao:
  comandos:
    - comando: python3 scripts/verificar-classificacao.py docs/steering/ia.md
      saida_esperada: 0
      deve_conter: ["classificação completa"]
    - comando: |-
        grep -q '^escopo: uso-universal' docs/steering/ia.md && grep -Eq '^categoria_eu_ai_act: (minimo|limitado)' docs/steering/ia.md
      saida_esperada: 0
    - comando: |-
          test "$(git log -1 --format=%s)" = "docs(steering): classificar o risco de IA da aplicação (P2-02)"
      saida_esperada: 0
    - comando: test "$(git show --stat --format= HEAD | grep -c '|')" = "1"
      saida_esperada: 0
  nao_deve_alterar: ["AGENTS.md", "docs/specs/*.md", "docs/steering/sdd-processo.md", "scripts/verificar*", "scripts/*.py"]
  deve_criar: ["docs/steering/ia.md"]
  nao_deve_criar: []
