bom_quando: "o time está começando no SDD ou precisa de trilha de auditoria completa: spec aprovada no cabeçalho, gate arquitetural, plano com checkboxes, evidência colada e veredito por requisito, tudo numa skill só."
cuidado: "uma skill conduz todas as fases, do escrever-spec ao continuar entre sessões; os passos que ela não cobre (entrevistar, investigar, executar, domínio, instruções) ficam para a montagem livre."
