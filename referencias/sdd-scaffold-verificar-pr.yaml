notas: "Reconferido em 2026-10-05 no arquivo da tag v1.7.0 (clone local). É o mecanismo declarado em DAD-01 (componentes.yml fixa a versão 1.7.0) e o portal o hospeda em /.well-known/mecanismos/sdd-scaffold/, com o sha256 do arquivo da tag. Mudou desde a versão anterior fixada pelo portal: o script confere a base do diff (sem ela, ERRO e saída 2) e passa a avisar sobre spec (requisito R<n>, aprovação, marcador de dúvida e critério) e sobre o rastro requisito-tarefa-teste, sempre sem bloquear. A regex MIGRATION, a constante EVIDENCIA e as mensagens de migration, rollback e evidência não mudaram."
