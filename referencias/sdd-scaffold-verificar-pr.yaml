notas: "Reconferido em 2026-10-06 no arquivo da tag v1.7.1 (clone local). É o mecanismo declarado em DAD-01 (componentes.yml fixa a versão 1.7.1) e o portal o hospeda em /.well-known/mecanismos/sdd-scaffold/, com o sha256 do arquivo da tag. Mudou desde a 1.7.0 uma linha, em main(): a lista de arquivos alterados vem de git diff --name-only --no-renames, de modo que a migration antiga de um rename segue na lista e a edição dela bloqueia. A regex MIGRATION, a constante EVIDENCIA e as mensagens de migration, rollback e evidência não mudaram."
