notas: "Reconferido em 2026-10-05 no README da tag v1.7.0 (clone local, commit fixado); a URL do commit novo não foi aberta na web nesta sessão. Mudou desde a versão anterior fixada pelo portal: são quatro pontos de montagem de skills (entra .agents/skills), o gerador instala a skill do ciclo pela tag v3.0.0, e há a seção Instalar pelo próprio agente, com um prompt que fixa a tag v1.7.0. O Quick start diz que o gerador instala a sdd-lifecycle; o checklist pós-geração ainda manda copiá-la. Vale o primeiro, que é o que criar_projeto.py faz (clone raso da tag v3.0.0 do repositório da skill)."
