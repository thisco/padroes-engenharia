notas: "Reconferido em 2026-10-06 no README da tag v1.7.1 (clone local, commit fixado); a URL do commit novo não foi aberta na web nesta sessão. Mudou desde a 1.7.0: o prompt da seção Instalar pelo próprio agente clona a tag v1.7.1 (o resto do prompt é igual), e a seção sobre a trava de PR ganhou o limite dela (o job roda o script do próprio PR, então a trava vale contra descuido e não contra má-fé) e a seção Limite dos controles por ferramenta. O que este portal cita das seções O que você recebe, Quick start, pontos de montagem das skills e camada 0 continua no arquivo. O Quick start diz que o gerador instala a sdd-lifecycle; o checklist pós-geração ainda manda copiá-la. Vale o primeiro, que é o que criar_projeto.py faz (clone raso da tag v3.0.0 do repositório da skill)."
