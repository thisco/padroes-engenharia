localizacao: "seções de versões (cada versão ganha um ID), rótulos (latest aponta a versão mais recente; production ou um rótulo de ambiente faz o deploy; sem rótulo, serve a de production), rollback (mover o rótulo production para a versão anterior) atualização de rótulos pelo SDK (update_prompt com new_labels) e rótulos protegidos (Enterprise; Pro com o add-on Teams; self-hosted com Enterprise Edition; não no Hobby nem no Core; só admin e owner mudam)"
