localizacao: "tabela, variáveis CI_MERGE_REQUEST_TARGET_BRANCH_NAME e CI_MERGE_REQUEST_DIFF_BASE_SHA ('The base SHA of the merge request diff', pipelines de merge request), CI_COMMIT_TAG (somente em pipelines de tag), CI_COMMIT_SHA ('The commit revision the project is built for') GITLAB_USER_LOGIN (no job manual, quem iniciou o job), CI_API_V4_URL (a raiz da API v4), CI_PROJECT_ID (o ID do projeto) e CI_JOB_TOKEN (token do job, válido enquanto ele roda)"
dominios: [ci-cd]
