id: gitlab-variaveis-predefinidas
titulo: "Predefined CI/CD variables reference"
organizacao: GitLab
url: https://docs.gitlab.com/ci/variables/predefined_variables/
tipo: vendor
verificado_em: '2026-11-04'
verificacao: V
localizacao: "tabela, variáveis CI_MERGE_REQUEST_TARGET_BRANCH_NAME e CI_MERGE_REQUEST_DIFF_BASE_SHA ('The base SHA of the merge request diff', pipelines de merge request), CI_COMMIT_TAG (somente em pipelines de tag), CI_COMMIT_SHA ('The commit revision the project is built for'), GITLAB_USER_LOGIN (no job manual, quem iniciou o job), CI_API_V4_URL (a raiz da API v4), CI_PROJECT_ID (o ID do projeto), CI_JOB_TOKEN (token do job, válido enquanto ele roda), CI_REGISTRY_IMAGE, CI_REGISTRY_USER e CI_REGISTRY_PASSWORD (o mesmo valor do CI_JOB_TOKEN, válido só enquanto o job roda)"
dominios: [ci-cd]
notas: "Lida na web em 2026-11-04 nas linhas CI_COMMIT_SHA, GITLAB_USER_LOGIN, CI_API_V4_URL, CI_PROJECT_ID, CI_JOB_TOKEN e CI_REGISTRY_*; as demais foram conferidas em 2026-10-08."
