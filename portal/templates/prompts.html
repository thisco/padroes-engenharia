{% extends "base.html" %}
{% import "componentes.html" as c %}
{% block conteudo %}
<div class="topo">
  <h1>{{ titulo }}</h1>
  <p>{{ descricao }}</p>
</div>
{% for grupo in grupos %}
<section aria-label="{{ grupo.titulo }}">
  <h2>{{ grupo.titulo }}</h2>
{% for p in grupo.itens %}
  <figure class="prompt" id="{{ p.id }}">
    <figcaption>Prompt para o agente <button type="button" class="copiar" data-copiar>Copiar</button> <a href="{{ raiz }}{{ p.caminho }}#{{ p.id }}">{{ p.origem }}</a> <span class="ref-meta">{{ p.momento_titulo }}</span></figcaption>
    <pre>{{ p.texto }}</pre>
  </figure>
{% endfor %}
</section>
{% endfor %}
{% endblock %}
